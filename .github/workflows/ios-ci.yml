name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest

jobs:
  test:
    name: Lint and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: swift-format lint
        run: make ios-lint

      - name: Unit tests
        run: |
          xcodebuild \
            -project ios/DinnerOS.xcodeproj \
            -scheme DinnerOS \
            -destination "$IOS_DESTINATION" \
            -resultBundlePath build/TestResults.xcresult \
            -quiet \
            test CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/TestResults.xcresult

  testflight:
    name: Upload to TestFlight
    needs: test
    # Disabled until the App Store Connect setup in docs/deployment.md is done.
    # Enable by setting the repository variable TESTFLIGHT_ENABLED=true.
    # Manual dispatch from main allows re-running an upload without a new commit.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.TESTFLIGHT_ENABLED == 'true'
    runs-on: macos-26
    environment: testflight
    concurrency:
      group: testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: fastlane beta
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: bundle exec fastlane beta
