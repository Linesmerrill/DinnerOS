name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  # One TestFlight upload a day at most: Apple caps uploads per app per day, and a
  # push-per-upload pipeline hit that cap. Pushes run tests only; the nightly run
  # uploads when the app changed in the last day, and a manual dispatch uploads now.
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC = 3am Pacific (PDT)
  workflow_dispatch:
    inputs:
      sync_signing:
        description: "Create or renew the shared signing certificate (fastlane match)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # The event is part of the group so a push can't cancel the nightly upload.
  group: ios-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest

jobs:
  changes:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      changelog: ${{ steps.decide.outputs.changelog }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            subjects=$(git log --since="24 hours ago" --format=%s -- ios .github/workflows/ios-ci.yml)
          else
            subjects=$(git log -1 --format=%s)
          fi
          if [ -z "$subjects" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          # One line for TestFlight's What to Test: every change of the day, newest first.
          changelog=$(printf '%s' "$subjects" | paste -sd ';' - | sed 's/;/; /g' | cut -c1-900)
          echo "changelog=$changelog" >> "$GITHUB_OUTPUT"

  test:
    name: Lint and test
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: swift-format lint
        run: make ios-lint

      - name: Unit tests
        run: |
          xcodebuild \
            -project ios/DinnerOS.xcodeproj \
            -scheme DinnerOS \
            -destination "$IOS_DESTINATION" \
            -resultBundlePath build/TestResults.xcresult \
            -quiet \
            test CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/TestResults.xcresult

  testflight:
    name: Upload to TestFlight
    needs: [changes, test]
    # Enabled by the repository variable TESTFLIGHT_ENABLED=true. Uploads only from the
    # nightly schedule (when the app changed that day) or a manual dispatch: Apple limits
    # uploads per day, so pushes never upload.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.TESTFLIGHT_ENABLED == 'true' && needs.changes.outputs.build == 'true'
    runs-on: macos-26
    # A signing prompt or a stuck archive should fail fast, not idle for hours. The
    # extra time covers waiting for build processing when external groups are set.
    timeout-minutes: 75
    environment: testflight
    concurrency:
      group: testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Signing repository access
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/match_deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: fastlane beta
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ vars.TESTFLIGHT_EXTERNAL_GROUPS }}
          TESTFLIGHT_CHANGELOG: ${{ needs.changes.outputs.changelog }}
        run: bundle exec fastlane beta

  signing:
    name: Sync signing certificate
    # Manual only: creating or renewing a certificate is never part of a build.
    if: github.event_name == 'workflow_dispatch' && inputs.sync_signing
    runs-on: macos-26
    timeout-minutes: 20
    environment: testflight
    concurrency:
      group: signing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Signing repository access
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/match_deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: fastlane signing
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: bundle exec fastlane signing
