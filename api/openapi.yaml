          example: [smoker]
        timeBand:
          description: Preferred cook time (`long` means a long cook is OK), or null for no preference.
          oneOf:
            - $ref: "#/components/schemas/AutopilotTimeBand"
            - type: "null"
          example: long
        frequency:
          $ref: "#/components/schemas/AutopilotRuleFrequency"
    AutopilotDayOverrideInput:
      type: object
      additionalProperties: false
      required: [day]
      properties:
        day:
          $ref: "#/components/schemas/AutopilotDay"
        skip:
          type: boolean
          description: Don't plan this day.
        maxMinutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 480
          description: Hard cook-time cap for this day, like the week's `maxMinutes`; the lower cap wins. Null for none.
          example: 20
        servings:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
          description: Servings for this day, or null to use the week's or profile's.
          example: 6
    AutopilotProfileRequest:
      type: object
      additionalProperties: false
      description: |
        Sections have the shapes of `AutopilotProfile`'s sections and are
        replaced whole. Within a section, omitted lists are empty, omitted
        booleans false, omitted nullable numbers null, and other omitted
        numbers 0 (so an omitted `cookTime.maxLongPerWeek` allows no long
        meals); send the full section to keep values. A section's value must be
        an object: `null` is not a change, so a PATCH with only null sections
        is `400 validation_failed`. Free-text lists are trimmed, lowercased, deduplicated,
        and sorted; fixed-value lists are deduplicated and put in vocabulary
        order.
      properties:
        taste:
          $ref: "#/components/schemas/AutopilotTasteInput"
        restrictions:
          $ref: "#/components/schemas/AutopilotRestrictionsInput"
        schedule:
          $ref: "#/components/schemas/AutopilotScheduleInput"
        cookTime:
          $ref: "#/components/schemas/AutopilotCookTimeInput"
        novelty:
          $ref: "#/components/schemas/AutopilotNovelty"
        equipment:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotEquipment"
        weekdayRules:
          type: array
          maxItems: 7
          description: At most one rule per day.
          items:
            $ref: "#/components/schemas/AutopilotWeekdayRuleInput"
        pairings:
          type: array
          maxItems: 20
          description: |
            Add-on pairing rules, replaced whole like the other sections, with
            one exception: a `PUT` that leaves them out **keeps** them, so
            onboarding never deletes a household's rules. Send each saved
            rule's `id` to keep it; a rule without one is created.
          items:
            $ref: "#/components/schemas/AutopilotPairingRule"
    AutopilotDayOverride:
      type: object
      additionalProperties: false
      required: [day, skip, maxMinutes, servings]
      properties:
        day:
          $ref: "#/components/schemas/AutopilotDay"
        skip:
          type: boolean
          description: Don't plan this day.
        maxMinutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 480
          description: Hard cook-time cap for this day, like the week's `maxMinutes`; the lower cap wins. Null for none.
          example: 20
        servings:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
          description: Servings for this day, or null to use the week's or profile's.
          example: 6
    AutopilotWeekContext:
      type: object
      required: [householdId, week, startDate, endDate, configured, skip, busy, mealsPerWeek, maxMinutes, servings, days, note, updatedBy, updatedAt]
      properties:
        householdId:
          type: string
        week:
          $ref: "#/components/schemas/IsoWeek"
        startDate:
          type: string
          format: date
          description: The week's Monday.
          example: "2026-09-14"
        endDate:
          type: string
          format: date
          description: The week's Sunday.
          example: "2026-09-20"
        configured:
          type: boolean
          description: False when the week has no saved context.
        skip:
          type: boolean
          description: Don't plan this week.
        busy:
          type: boolean
          description: |
            A busy week is about weeknights: on the profile's `weeknights` it
            favors quick meals and allows no long ones, without a cap. Other
            days, and days whose weekday rule allows a long cook, keep their
            usual cook-time handling; only `maxMinutes` caps them.
        mealsPerWeek:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
          description: Overrides the profile's `mealsPerWeek` for this week, or null.
        maxMinutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 480
          description: Hard cook-time cap for every meal this week; recipes with unknown cook time are excluded under it. Null for none.
          example: 30
        servings:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
          description: Servings for this week, or null to use the profile's.
        days:
          type: array
          maxItems: 7
          description: Only days with something set, in week order.
          items:
            $ref: "#/components/schemas/AutopilotDayOverride"
        note:
          type: string
          maxLength: 500
          description: Free text for the household. Autopilot doesn't read it.
          example: Grandparents visiting Saturday.
        updatedBy:
          type: [string, "null"]
          description: Null when the week has no saved context.
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: Null when the week has no saved context.
    AutopilotWeekContextRequest:
      type: object
      additionalProperties: false
      description: The whole context. Fields left out are false, null, empty, or blank.
      properties:
        skip:
          type: boolean
        busy:
          type: boolean
          description: Favor quick meals on the profile's weeknights. See `AutopilotWeekContext.busy`.
        mealsPerWeek:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
        maxMinutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 480
        servings:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
        days:
          type: array
          maxItems: 7
          description: At most one entry per day.
          items:
            $ref: "#/components/schemas/AutopilotDayOverrideInput"
        note:
          type: string
          maxLength: 500
          description: Leading and trailing whitespace is trimmed.
    AutopilotText:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
          description: Stable machine-readable code; see where it's used for the known codes. Handle unknown codes.
        text:
          type: string
          description: Human-readable text to show. Not stable; do not parse.
    AutopilotSlot:
      type: object
      required: [id, day, date, recipe, servings, cookMinutes, timeBand, score, signals, reasons, swapCount, pairings]
      properties:
        id:
          type: string
          description: The slot's ID, which is its day code (a proposal has at most one meal per day).
          example: sun
        day:
          $ref: "#/components/schemas/AutopilotDay"
        date:
          type: string
          format: date
          example: "2026-09-20"
        recipe:
          type: object
          description: Snapshot taken when the meal was proposed.
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
              example: Smoked Pork Shoulder
            imageUrl:
              type: string
        servings:
          type: integer
          minimum: 1
          description: One of the recipe's serving sizes.
          example: 4
        cookMinutes:
          type: [integer, "null"]
          minimum: 1
          description: The recipe's effective cook time, or null when unknown.
          example: 240
        timeBand:
          $ref: "#/components/schemas/AutopilotTimeBand"
        score:
          type: number
          description: Weighted sum of the signals plus week adjustments. Only comparable within a proposal.
          example: 1.284
        signals:
          type: object
          description: |
            Scoring inputs by name, for debugging and explanations. Meal
            signals: `rating`, `feedback`, `familiarity`, `conversion`,
            `recency`, `weekdayAffinity`, `taste`, `rule`, `timeFit`,
            `novelty`, `servingsFit`, `pantry`, `avoid`, and `objective` (when
            present). Week signals appear only when non-zero: `variety`,
            `cookTimeMix`, `ruleFrequency`, `noveltyBudget`. Names may be added.
          additionalProperties:
            type: number
          example:
            rating: 0.75
            taste: 0.5
            rule: 1
            timeFit: 0.2
            variety: -0.1
        reasons:
          type: array
          maxItems: 3
          description: |
            Why the meal was picked, most important first. Codes: `rule`,
            `busyWeek`, `dayLimit`, `rating`, `feedback`, `familiar`,
            `conversion`, `notRecently`, `weekday`, `taste`, `weeknight`,
            `quick`, `new`, `guests`, `pantry`, and `fit` (when nothing else
            applies).
          items:
            $ref: "#/components/schemas/AutopilotText"
          example:
            - code: rule
              text: Sunday smoker night · Pork · Long cook OK
            - code: rating
              text: Rated 4.5★ by your household
        swapCount:
          type: integer
          minimum: 0
          description: Times this slot was swapped.
        pairings:
          type: array
          maxItems: 3
          description: |
            Add-ons and grocery items to offer with this meal ("Add Garlic
            Bread?"). Ones with `included: true` are added when the proposal
            is accepted unless the member takes them out.
          items:
            $ref: "#/components/schemas/AutopilotProposalPairing"
    AutopilotUnfilled:
      type: object
      description: A day the proposal wanted to plan but couldn't.
      required: [day, date, code, text]
      properties:
        day:
          $ref: "#/components/schemas/AutopilotDay"
        date:
          type: string
          format: date
        code:
          type: string
          description: "`no_candidates`, or `no_quick_candidates` when a cook-time cap left nothing."
          example: no_quick_candidates
        text:
          type: string
          example: No remaining recipe is ready within 20 minutes on Friday.
    AutopilotObjective:
      type: object
      description: The week objective's breakdown; `total` is the sum of the others.
      required: [meals, variety, cookTime, rules, novelty, total]
      properties:
        meals:
          type: number
          description: Sum of the meals' base scores.
        variety:
          type: number
          description: Penalty for repeated cuisines and proteins (0 or less).
        cookTime:
          type: number
          description: Penalty for the cook-time mix (0 or less).
        rules:
          type: number
          description: Penalty for `at_most_once` rules matched more than once (0 or less).
        novelty:
          type: number
          description: Penalty for new meals beyond the novelty budget (0 or less).
        total:
          type: number
    AutopilotProposal:
      type: object
      required: [id, householdId, week, startDate, endDate, status, version, attempt, modelVersion, inputsHash, requestedMeals, plannedMeals, candidateCount, coldStart, slots, unfilled, messages, objective, swapCount, excludedSlotIds, generatedBy, generatedAt, updatedAt, decidedBy, decidedAt]
      properties:
        id:
          type: string
          description: Changes each time the week is generated.
        householdId:
          type: string
        week:
          $ref: "#/components/schemas/IsoWeek"
        startDate:
          type: string
          format: date
          description: The week's Monday.
          example: "2026-09-14"
        endDate:
          type: string
          format: date
          description: The week's Sunday.
          example: "2026-09-20"
        status:
          $ref: "#/components/schemas/AutopilotProposalStatus"
        version:
          type: integer
          format: int64
          description: Increases with every change, including regeneration. Send it to swap, accept, or reject.
          example: 3
        attempt:
          type: integer
          minimum: 1
          description: 1 for the week's first generation, then one more each time it's generated again.
        modelVersion:
          type: string
          example: baseline-2026.2
        inputsHash:
          type: string
          description: Fingerprint of the generation inputs; identical inputs give the same hash.
        requestedMeals:
          type: integer
          minimum: 0
          description: Meals the week asked for, from the profile or week context.
          example: 5
        plannedMeals:
          type: integer
          minimum: 0
          description: Meals in `slots` when generated.
          example: 3
        candidateCount:
          type: integer
          minimum: 0
          description: Recipes that passed the hard constraints.
        coldStart:
          type: boolean
          description: True while the household has little history, so picks lean on the taste profile.
        slots:
          type: array
          description: Proposed meals, in week order.
          items:
            $ref: "#/components/schemas/AutopilotSlot"
        unfilled:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotUnfilled"
        messages:
          type: array
          description: |
            Week-level notes. Codes: `week_skipped`, `empty_catalog`,
            `week_full`, `not_enough_candidates`, `not_enough_days`,
            `rule_method_unmet`, `already_planned`, `cold_start`.
          items:
            $ref: "#/components/schemas/AutopilotText"
          example:
            - code: not_enough_candidates
              text: Only 3 quick recipes (≤20 min) match; planned 3 of 5 nights.
        objective:
          $ref: "#/components/schemas/AutopilotObjective"
        swapCount:
          type: integer
          minimum: 0
          description: Swaps across all slots.
        excludedSlotIds:
          type: array
          description: Slots left out when the proposal was accepted; empty otherwise.
          items:
            $ref: "#/components/schemas/AutopilotDay"
        generatedBy:
          type: string
          description: User ID of the member who generated it.
        generatedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        decidedBy:
          type: [string, "null"]
          description: User ID of the member who accepted or rejected it; null while proposed.
        decidedAt:
          type: [string, "null"]
          format: date-time
          description: Null while proposed.
    AutopilotGenerateRequest:
      type: object
      additionalProperties: false
      properties:
        avoidPrevious:
          type: boolean
          default: true
          description: When a pending proposal is replaced, steer away from its meals and the meals swapped out of it.
    AutopilotVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          description: The proposal's current `version`.
          example: 3
    AutopilotAcceptRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          description: The proposal's current `version`.
          example: 3
        excludeSlotIds:
          type: array
          description: Slots not to add. Each must be a slot of the proposal; duplicates are ignored.
          items:
            type: string
          example: [wed]
        pairingIds:
          type: [array, "null"]
          description: |
            The slots' pairings to add, by `AutopilotProposalPairing.id`. Null
            or absent means the ones the proposal includes (the household's
            `always` rules); an empty array adds none. Pairings of excluded
            slots are ignored. 400 when an id isn't a pairing of this proposal.
          items:
            type: string
          example: ["mon/recipe:66e5a1f2c3b4a5d6e7f81008"]
    AutopilotSkippedSlot:
      type: object
      required: [slotId, day, reason]
      properties:
        slotId:
          type: string
          example: tue
        day:
          $ref: "#/components/schemas/AutopilotDay"
        reason:
          type: string
          enum: [dayTaken, alreadyPlanned]
          description: "`dayTaken`: the plan already has a meal that day. `alreadyPlanned`: the recipe is already in the week."
    AutopilotAcceptResult:
      type: object
      required: [proposal, plan, added, skipped, pairingsAdded, pairingsSkipped]
      properties:
        proposal:
          $ref: "#/components/schemas/AutopilotProposal"
        plan:
          $ref: "#/components/schemas/Plan"
        added:
          type: array
          description: The new plan entries, with origin `autopilot`.
          items:
            $ref: "#/components/schemas/PlanEntry"
        skipped:
          type: array
          description: Meals not added because their day or recipe was already planned. Excluded slots aren't listed.
          items:
            $ref: "#/components/schemas/AutopilotSkippedSlot"
        pairingsAdded:
          type: array
          description: The pairings added with the meals: add-on plan entries and grocery items.
          items:
            $ref: "#/components/schemas/AutopilotAddedPairing"
        pairingsSkipped:
          type: array
          description: Chosen pairings that weren't added.
          items:
            $ref: "#/components/schemas/AutopilotSkippedPairing"
    AutopilotMethod:
      type: object
      required: [method, label, suits, source, heuristicSuits]
      properties:
        method:
          $ref: "#/components/schemas/AutopilotEquipment"
        label:
          type: string
          example: Smoker
        suits:
          type: boolean
          description: Whether the recipe suits the method, after the household's override.
        source:
          type: string
          enum: [heuristic, override]
        heuristicSuits:
          type: boolean
          description: The heuristic's answer, even when overridden.
        evidence:
          type: string
          description: What the heuristic matched. Omitted when nothing matched.
          example: pork shoulder
    AutopilotRecipeOverride:
      type: object
      required: [recipeId, methods, mealCategories, updatedBy, updatedAt]
      properties:
        recipeId:
          type: string
        methods:
          type: object
          description: Whether the recipe suits each overridden method. Methods left out use the heuristic.
          propertyNames:
            $ref: "#/components/schemas/AutopilotEquipment"
          additionalProperties:
            type: boolean
          example:
            smoker: true
            grill: false
        mealCategories:
          type: object
          description: Whether the recipe is in each overridden meal category. Categories left out use the heuristic.
          propertyNames:
            $ref: "#/components/schemas/AutopilotMealCategory"
          additionalProperties:
            type: boolean
          example:
            pasta: true
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    AutopilotRecipeOverrideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotRecipeOverride"
    AutopilotRecipeOverrideRequest:
      type: object
      additionalProperties: false
      description: At least one of `methods` or `mealCategories` must name a value.
      properties:
        mealCategories:
          type: object
          minProperties: 1
          description: Meal category to whether the recipe is in it; null clears that category's override.
          propertyNames:
            $ref: "#/components/schemas/AutopilotMealCategory"
          additionalProperties:
            type: [boolean, "null"]
          example:
            pasta: true
            soup: null
        methods:
          type: object
          minProperties: 1
          description: Method to whether the recipe suits it; null clears that method's override.
          propertyNames:
            $ref: "#/components/schemas/AutopilotEquipment"
          additionalProperties:
            type: [boolean, "null"]
          example:
            smoker: true
            air-fryer: null
    AutopilotRecipeAttributes:
      type: object
      required: [recipeId, cookMinutes, timeBand, cuisines, cuisineRegions, tags, proteins, allergens, diets, spicy, methods, mealCategories, override]
      properties:
        recipeId:
          type: string
        cookMinutes:
          type: [integer, "null"]
          minimum: 1
          description: The recipe's effective cook time, or null when unknown.
          example: 240
        timeBand:
          $ref: "#/components/schemas/AutopilotTimeBand"
        cuisines:
          type: array
          description: The recipe's cuisines in canonical form (lowercase; `North America` → `north american`).
          items:
            type: string
          example: [italian]
        cuisineRegions:
          type: array
          description: Broader regions of `cuisines`, nearest first. Likes, dislikes, exclusions, and weekday rules match them too; variety doesn't.
          items:
            type: string
          example: [southern european, european]
        tags:
          type: array
          description: The recipe's tags in canonical form (lowercase).
          items:
            type: string
        proteins:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotProtein"
        allergens:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotAllergen"
        diets:
          type: array
          description: Diets the recipe fits.
          items:
            $ref: "#/components/schemas/AutopilotDiet"
        spicy:
          type: boolean
        spicyEvidence:
          type: string
          description: The tag or ingredient that made it spicy. Omitted when not spicy.
          example: chipotle
        methods:
          type: array
          description: One per equipment value, in vocabulary order, whether or not the household has it.
          items:
            $ref: "#/components/schemas/AutopilotMethod"
        mealCategories:
          type: array
          description: One per meal category, in vocabulary order. The heuristic gives at most one; overrides can add more.
          items:
            $ref: "#/components/schemas/AutopilotMealCategoryAttribute"
        override:
          description: The household's override for this recipe, or null when it has none.
          oneOf:
            - $ref: "#/components/schemas/AutopilotRecipeOverride"
            - type: "null"
    AutopilotFieldChange:
      type: object
      required: [field]
      description: How one field changed. Values are truncated to 100 characters.
      properties:
        field:
          type: string
          description: Dotted path, such as `schedule.mealsPerWeek`, `weekdayRules.sun`, or `days.fri`.
          example: taste.likes.cuisines
        added:
          type: array
          maxItems: 30
          description: For lists. Omitted when empty.
          items:
            type: string
          example: [thai]
        removed:
          type: array
          maxItems: 30
          description: For lists. Omitted when empty.
          items:
            type: string
        from:
          type: string
          description: For single values; omitted when the value was unset.
        to:
          type: string
          description: For single values; omitted when the value is now unset.
    AutopilotHistoryItem:
      type: object
      required: [type, userId, occurredAt]
      properties:
        type:
          type: string
          enum: [autopilot.preferences_updated, autopilot.week_context_updated, autopilot.recipe_override_updated]
        userId:
          type: string
          description: The member who made the change.
        occurredAt:
          type: string
          format: date-time
        week:
          $ref: "#/components/schemas/IsoWeek"
        recipeId:
          type: string
          description: Present for `autopilot.recipe_override_updated`.
        sections:
          type: array
          description: Present for `autopilot.preferences_updated`.
          items:
            $ref: "#/components/schemas/AutopilotSection"
        changes:
          type: array
          maxItems: 40
          description: Present for profile and week context changes. Omitted when a week context was cleared.
          items:
            $ref: "#/components/schemas/AutopilotFieldChange"
        cleared:
          type: boolean
          description: True when the week context was cleared; omitted otherwise.
        method:
          $ref: "#/components/schemas/AutopilotEquipment"
        category:
          description: Present when a meal-category override changed instead of a method.
          oneOf:
            - $ref: "#/components/schemas/AutopilotMealCategory"
            - type: "null"
        value:
          type: string
          enum: [auto, "yes", "no"]
          description: For recipe overrides, the method's new setting (`auto` means the heuristic decides).
        previous:
          type: string
          enum: [auto, "yes", "no"]
          description: For recipe overrides, the method's previous setting.
    AutopilotHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/AutopilotHistoryItem"
    AutopilotOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
          description: What to send.
          example: mexican
        label:
          type: string
          description: What to show.
          example: Mexican
        description:
          type: string
          description: Omitted when there's nothing to add.
        recipeCount:
          type: integer
          minimum: 0
          description: Only on cuisines, tags, and proteins. Main-meal recipes that carry the value; a cuisine counts for its regions too, so a region's count is how many recipes a like of it matches. 0 for starter values.
          example: 12
    AutopilotLimits:
      type: object
      description: Validation bounds, for input limits in the app.
      required: [maxListValues, maxExcludedIngredients, maxValueLength, maxIngredientLength, maxRuleValues, maxLabelLength, maxNoteLength, minCookMinutes, maxCookMinutes, maxServings, maxPairingRules, maxGroceryItemNameLength, maxGroceryItemQuantity]
      properties:
        maxListValues:
          type: integer
          example: 30
        maxExcludedIngredients:
          type: integer
          example: 50
        maxValueLength:
          type: integer
          example: 40
        maxIngredientLength:
          type: integer
          example: 60
        maxRuleValues:
          type: integer
          example: 10
        maxLabelLength:
          type: integer
          example: 40
        maxNoteLength:
          type: integer
          example: 500
        minCookMinutes:
          type: integer
          example: 5
        maxCookMinutes:
          type: integer
          example: 480
        maxServings:
          type: integer
          example: 12
        maxPairingRules:
          type: integer
          example: 20
        maxGroceryItemNameLength:
          type: integer
          example: 60
        maxGroceryItemQuantity:
          type: integer
          example: 99
    AutopilotVocabulary:
      type: object
      required: [cuisines, tags, proteins, diets, allergens, equipment, novelty, timeBands, frequencies, days, mealCategories, pairingFrequencies, catalogRecipeCount, limits]
      properties:
        cuisines:
          type: array
          description: Canonical values the household's main meals use, including their cuisines' regions (most used first), then starter values they don't (in list order); at most 60. Known cuisines have title-case labels.
          items:
            $ref: "#/components/schemas/AutopilotOption"
        tags:
          type: array
          description: Like `cuisines`.
          items:
            $ref: "#/components/schemas/AutopilotOption"
        proteins:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotOption"
        diets:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotOption"
        allergens:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotOption"
        equipment:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotOption"
        novelty:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotOption"
        timeBands:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotOption"
        frequencies:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotOption"
        days:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotOption"
        mealCategories:
          type: array
          description: The meal categories pairing rules match on, with how many main meals the heuristic puts in each.
          items:
            $ref: "#/components/schemas/AutopilotOption"
        pairingFrequencies:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotOption"
        catalogRecipeCount:
          type: integer
          minimum: 0
          description: Main-meal recipes the counts cover.
        limits:
          $ref: "#/components/schemas/AutopilotLimits"
    AutopilotMealCategory:
      type: string
      description: The kind of dinner pairings match on, derived from the recipe (docs/autopilot.md#meal-categories).
      enum: [pasta, soup, salad, tacos, curry, bowl, stir-fry, sandwich, pizza]
    AutopilotMealCategoryAttribute:
      type: object
      required: [category, label, suits, source, heuristicSuits]
      properties:
        category:
          $ref: "#/components/schemas/AutopilotMealCategory"
        label:
          type: string
          example: Pasta
        suits:
          type: boolean
          description: Whether the recipe is in the category, after the household's override.
        source:
          type: string
          enum: [heuristic, override]
        heuristicSuits:
          type: boolean
        evidence:
          type: string
          description: What the heuristic matched. Omitted when nothing matched.
          example: Named rigatoni
    AutopilotPairingKind:
      type: string
      enum: [recipe, grocery_item]
    AutopilotPairingSource:
      type: string
      description: "`rule`: a household rule. `learned`: the household's history."
      enum: [rule, learned]
    AutopilotPairingFrequency:
      type: string
      description: "`always`: included with a proposed meal unless taken out. `suggest`: offered."
      enum: [always, suggest]
    AutopilotGroceryItem:
      type: object
      additionalProperties: false
      required: [name]
      description: A grocery line that isn't a recipe.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Club crackers
        quantity:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 99
          description: Null for no amount. A unit needs a quantity.
          example: 1
        unit:
          type: [string, "null"]
          description: An ingredient unit code (`count`, `package`, `oz`…). Defaults to `count` when a quantity is given without one.
          example: package
    AutopilotPairingRecipe:
      type: object
      description: An add-on recipe offered as a pairing; a recipe summary without ratings.
      required: [id, name, timesOrdered, isAddon, tags]
      properties:
        id:
          type: string
        name:
          type: string
          example: Garlic Bread
        headline:
          type: string
        imageUrl:
          type: string
        cookMinutes:
          type: integer
          minimum: 1
          description: Omitted when unknown.
        timesOrdered:
          type: integer
        lastOrderedWeek:
          type: string
          example: 2026-W37
        isAddon:
          type: boolean
        tags:
          type: array
          items:
            type: string
    AutopilotPairingTarget:
      type: object
      description: What a pairing adds. `recipe` is set for `kind: recipe`, `groceryItem` for `kind: grocery_item`.
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/AutopilotPairingKind"
        recipe:
          $ref: "#/components/schemas/AutopilotPairingRecipe"
        groceryItem:
          $ref: "#/components/schemas/AutopilotGroceryItem"
    AutopilotLearnedPairing:
      type: object
      description: The history behind a learned pairing (docs/autopilot.md#learned-pairings).
      required: [weeksTogether, mealCategoryWeeks, otherWeeks, otherWeeksRate]
      properties:
        weeksTogether:
          type: integer
          description: Weeks with both the meal category and the add-on.
          example: 186
        mealCategoryWeeks:
          type: integer
          example: 195
        otherWeeks:
          type: integer
          description: Weeks with a main meal but not the category.
          example: 35
        otherWeeksRate:
          type: number
          description: The add-on's share of those weeks. A pairing must beat it by 0.2.
          example: 0.49
    AutopilotPairing:
      type: object
      required: [key, target, servings, source, frequency, mealCategory, confidence, learned, reason, ruleId, inPlan, canMakeRule]
      properties:
        key:
          type: string
          description: Identifies the target; send it back to accept or dismiss.
          example: "recipe:66e5a1f2c3b4a5d6e7f81008"
        target:
          $ref: "#/components/schemas/AutopilotPairingTarget"
        servings:
          type: [integer, "null"]
          description: The add-on's serving size for this meal; null for a grocery item.
          example: 2
        source:
          $ref: "#/components/schemas/AutopilotPairingSource"
        frequency:
          $ref: "#/components/schemas/AutopilotPairingFrequency"
        mealCategory:
          description: The meal category that matched, or null.
          oneOf:
            - $ref: "#/components/schemas/AutopilotMealCategory"
            - type: "null"
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: The share of the category's weeks that had the add-on; null without history.
          example: 0.95
        learned:
          oneOf:
            - $ref: "#/components/schemas/AutopilotLearnedPairing"
            - type: "null"
        reason:
          type: string
          description: Human-readable text to show. Not stable; do not parse.
          example: You usually have Garlic Bread with pasta (95% of pasta weeks)
        ruleId:
          type: [string, "null"]
          description: The household rule this came from, or null for a learned pairing.
        inPlan:
          type: boolean
          description: The target is already planned for this meal's day, or on the week's list.
        canMakeRule:
          type: boolean
          description: A learned pairing with a meal category, which `pairings/rules` can keep as a rule.
    AutopilotProposalPairing:
      allOf:
        - $ref: "#/components/schemas/AutopilotPairing"
        - type: object
          required: [id, included]
          properties:
            id:
              type: string
              description: "`<slotId>/<key>`; send it in `pairingIds` when accepting."
              example: "mon/recipe:66e5a1f2c3b4a5d6e7f81008"
            included:
              type: boolean
              description: Accepting adds it unless the member takes it out (always rules).
    AutopilotPairingRuleTarget:
      type: object
      additionalProperties: false
      description: Exactly one of `recipeId` or `groceryItem`.
      properties:
        kind:
          description: Read-only; ignored in requests.
          oneOf:
            - $ref: "#/components/schemas/AutopilotPairingKind"
            - type: "null"
        recipeId:
          type: [string, "null"]
          description: An add-on recipe of this household that has serving sizes.
        recipeName:
          type: [string, "null"]
          description: Read-only; the recipe's name when the rule was saved.
        groceryItem:
          oneOf:
            - $ref: "#/components/schemas/AutopilotGroceryItem"
            - type: "null"
    AutopilotPairingRule:
      type: object
      additionalProperties: false
      description: |
        A household pairing rule. A meal matches when it matches every group
        `when` sets; within a group any value matches, and cuisines match a
        recipe's cuisines or their regions. At least one condition is required.
      required: [when, add]
      properties:
        id:
          type: [string, "null"]
          description: Null for a new rule; send a saved rule's id to keep it.
        label:
          type: string
          maxLength: 40
          example: Pasta night
        when:
          type: object
          additionalProperties: false
          properties:
            mealCategories:
              type: array
              items:
                $ref: "#/components/schemas/AutopilotMealCategory"
            cuisines:
              type: array
              maxItems: 10
              items:
                type: string
                maxLength: 40
            tags:
              type: array
              maxItems: 10
              items:
                type: string
                maxLength: 40
            proteins:
              type: array
              items:
                $ref: "#/components/schemas/AutopilotProtein"
        add:
          $ref: "#/components/schemas/AutopilotPairingRuleTarget"
        frequency:
          $ref: "#/components/schemas/AutopilotPairingFrequency"
    AutopilotPairingGroceryItem:
      type: object
      description: A paired grocery item on the week's grocery list.
      required: [id, key, groceryItem, entryId, recipe, source, ruleId, text, addedBy, addedAt]
      properties:
        id:
          type: string
        key:
          type: string
          example: "grocery:club crackers"
        groceryItem:
          $ref: "#/components/schemas/AutopilotGroceryItem"
        entryId:
          type: string
          description: The meal's plan entry. The item leaves the list when that entry is unplanned.
        recipe:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        source:
          $ref: "#/components/schemas/AutopilotPairingSource"
        ruleId:
          type: [string, "null"]
        text:
          type: string
          example: Club crackers for Chicken Noodle Soup
        addedBy:
          type: string
        addedAt:
          type: string
          format: date-time
    AutopilotMealPairings:
      type: object
      required: [entryId, day, date, recipe, servings, mealCategories, pairings]
      properties:
        entryId:
          type: string
        day:
          oneOf:
            - $ref: "#/components/schemas/AutopilotDay"
            - type: "null"
          description: Null for an unscheduled meal.
        date:
          type: [string, "null"]
          format: date
        recipe:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
            imageUrl:
              type: string
        servings:
          type: integer
        mealCategories:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotMealCategory"
        pairings:
          type: array
          maxItems: 3
          description: Rules first (always, then suggest), then learned pairings by confidence.
          items:
            $ref: "#/components/schemas/AutopilotPairing"
    AutopilotWeekPairings:
      type: object
      required: [week, startDate, endDate, meals, groceryItems]
      properties:
        week:
          $ref: "#/components/schemas/IsoWeek"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        meals:
          type: array
          description: One per planned main meal, in plan order. Add-on entries aren't meals.
          items:
            $ref: "#/components/schemas/AutopilotMealPairings"
        groceryItems:
          type: array
          description: Accepted grocery items on this week's list.
          items:
            $ref: "#/components/schemas/AutopilotPairingGroceryItem"
    AutopilotRecipePairings:
      type: object
      required: [recipeId, week, entryId, mealCategories, items]
      properties:
        recipeId:
          type: string
        week:
          oneOf:
            - $ref: "#/components/schemas/IsoWeek"
            - type: "null"
        entryId:
          type: [string, "null"]
          description: The recipe's plan entry in that week, when it is planned.
        mealCategories:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotMealCategory"
        items:
          type: array
          maxItems: 6
          description: Includes pairings already in the week, with `inPlan: true`.
          items:
            $ref: "#/components/schemas/AutopilotPairing"
    AutopilotPairingActionRequest:
      type: object
      additionalProperties: false
      required: [entryId, key]
      properties:
        entryId:
          type: string
          description: The main meal's plan entry.
        key:
          type: string
          description: The pairing's `key`.
          example: "recipe:66e5a1f2c3b4a5d6e7f81008"
    AutopilotPairingAcceptResult:
      type: object
      required: [status, pairing, entry, groceryItem, plan]
      properties:
        status:
          type: string
          enum: [added, alreadyAdded]
          description: "`alreadyAdded`: the week already had it, and nothing changed."
        pairing:
          $ref: "#/components/schemas/AutopilotPairing"
        entry:
          description: The add-on's plan entry, with origin `autopilot`; null for a grocery item.
          oneOf:
            - $ref: "#/components/schemas/PlanEntry"
            - type: "null"
        groceryItem:
          oneOf:
            - $ref: "#/components/schemas/AutopilotPairingGroceryItem"
            - type: "null"
        plan:
          $ref: "#/components/schemas/Plan"
    AutopilotMakePairingRuleRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `entryId` (a planned meal) or `slotId` (a proposal slot).
      required: [key]
      properties:
        entryId:
          type: [string, "null"]
        slotId:
          type: [string, "null"]
        key:
          type: string
        frequency:
          description: Default `suggest`.
          oneOf:
            - $ref: "#/components/schemas/AutopilotPairingFrequency"
            - type: "null"
    AutopilotMakePairingRuleResult:
      type: object
      required: [status, rule, profile]
      properties:
        status:
          type: string
          enum: [created, merged, unchanged]
          description: "`merged`: the category joined the rule that item already had. `unchanged`: a rule already covers it."
        rule:
          $ref: "#/components/schemas/AutopilotPairingRule"
        profile:
          $ref: "#/components/schemas/AutopilotProfile"
    AutopilotAddedPairing:
      type: object
      required: [id, slotId, pairing, entry, groceryItem]
      properties:
        id:
          type: string
          example: "mon/recipe:66e5a1f2c3b4a5d6e7f81008"
        slotId:
          type: string
        pairing:
          $ref: "#/components/schemas/AutopilotPairing"
        entry:
          oneOf:
            - $ref: "#/components/schemas/PlanEntry"
            - type: "null"
        groceryItem:
          oneOf:
            - $ref: "#/components/schemas/AutopilotPairingGroceryItem"
            - type: "null"
    AutopilotSkippedPairing:
      type: object
      required: [id, slotId, key, reason]
      properties:
        id:
          type: string
        slotId:
          type: string
        key:
          type: string
        reason:
          type: string
          enum: [alreadyPlanned, unavailable]
          description: "`alreadyPlanned`: the add-on is already planned that day. `unavailable`: it can no longer be planned."
    PantryPurchaseProvider:
      type: object
      required: [key, handoffId, lineId, productId]
      properties:
        key:
          type: string
          example: walmart
        handoffId:
          type: string
        lineId:
          type: string
          example: l1
        productId:
          type: string
          description: The provider's product (a Walmart item ID).
    ShoppingCapabilities:
      type: object
      required: [handoff, pasteProductLink, storeId, productSearch, productLookup, storeFinder, cartWrite, orderImport]
      properties:
        handoff:
          type: string
          enum: [cart_link]
        pasteProductLink:
          type: boolean
        storeId:
          type: boolean
        productSearch:
          type: boolean
        productLookup:
          type: boolean
        storeFinder:
          type: boolean
        cartWrite:
          type: boolean
        orderImport:
          type: boolean
    ShoppingProvider:
      type: object
      required: [key, name, affiliateTracked, capabilities]
      properties:
        key:
          type: string
          example: walmart
        name:
          type: string
          example: Walmart
        affiliateTracked:
          type: boolean
          description: Handoff links carry affiliate tracking; show the commission disclosure next to the handoff button.
        capabilities:
          $ref: "#/components/schemas/ShoppingCapabilities"
    ShoppingProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingProvider"
    ShoppingSettings:
      type: object
      required: [provider, storeId, updatedBy, updatedAt]
      properties:
        provider:
          type: [string, "null"]
          example: walmart
        storeId:
          type: [string, "null"]
          example: "5435"
        updatedBy:
          type: [string, "null"]
        updatedAt:
          type: [string, "null"]
          format: date-time
    UpdateShoppingSettingsRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          example: walmart
        storeId:
          type: [string, "null"]
          description: The store number (1–6 digits; leading zeros are dropped). Null or omitted means no store.
          example: "5435"
    ShoppingAmount:
      type: object
      required: [quantity, quantityValue, unit, text]
      properties:
        quantity:
          type: string
          description: Exact, "n" or "n/d".
          example: "16"
        quantityValue:
          type: number
          example: 16
        unit:
          type: string
          example: oz
        text:
          type: string
          example: 16 oz
    ShoppingPreferenceRequest:
      type: object
      description: "`productUrl` or `productId`, not both."
      required: [displayName]
      properties:
        productUrl:
          type: string
          maxLength: 2048
          example: https://www.walmart.com/ip/Great-Value-Ground-Beef-1-lb/123456789?classType=REGULAR
        productId:
          type: string
          pattern: "^[0-9]+$"
          example: "123456789"
        displayName:
          type: string
          maxLength: 100
        packageSize:
          description: How much one package holds; null or omitted when unknown.
          oneOf:
            - type: object
              required: [quantity, unit]
              properties:
                quantity:
                  type: string
                  maxLength: 32
                  example: "16"
                unit:
                  type: string
                  description: A DinnerOS unit code.
                  example: oz
            - type: "null"
        ingredientName:
          type: string
          maxLength: 100
          description: Defaults to the catalog name, or the name after `name:`.
    ShoppingPreference:
      type: object
      required: [id, provider, ingredientKey, ingredientId, ingredientName, productId, productUrl, displayName, packageSize, createdBy, createdAt, updatedBy, updatedAt]
      properties:
        id:
          type: string
        provider:
          type: string
          example: walmart
        ingredientKey:
          type: string
        ingredientId:
          type: [string, "null"]
          description: The catalog ingredient, or null for a `name:` key.
        ingredientName:
          type: string
        productId:
          type: string
          example: "123456789"
        productUrl:
          type: string
          description: Rebuilt from `productId`, never the pasted text.
          example: https://www.walmart.com/ip/123456789
        displayName:
          type: string
        packageSize:
          oneOf:
            - $ref: "#/components/schemas/ShoppingAmount"
            - type: "null"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    ShoppingPreferenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingPreference"
    ShoppingMatchRequest:
      type: object
      description: |
        Every field is optional; `{}` hands off every `toBuy` line. With
        `lines`, exactly those lines are candidates, whatever their status.
      properties:
        lines:
          type: [array, "null"]
          maxItems: 300
          items:
            type: object
            required: [ingredientKey]
            properties:
              ingredientKey:
                type: string
              packages:
                type: integer
                minimum: 1
                maximum: 99
                description: Overrides the computed package count.
        checkedOffKeys:
          type: [array, "null"]
          maxItems: 300
          description: Lines the member already checked off; left out.
          items:
            type: string
        excludeKeys:
          type: [array, "null"]
          maxItems: 300
          items:
            type: string
    ShoppingLineConfirmation:
      type: object
      required: [status, packages, purchaseId, confirmedBy, confirmedAt, skippedBy, skippedAt]
      properties:
        status:
          type: string
          enum: [pending, confirmed, skipped]
        packages:
          type: [integer, "null"]
        purchaseId:
          type: [string, "null"]
        confirmedBy:
          type: [string, "null"]
        confirmedAt:
          type: [string, "null"]
          format: date-time
        skippedBy:
          type: [string, "null"]
        skippedAt:
          type: [string, "null"]
          format: date-time
    ShoppingHandoffLine:
      type: object
      required: [id, ingredientKey, ingredientId, name, category, amounts, quantityText, unquantified, groceryStatus, product, computedPackages, packages, packagesOverridden, checkAmount, reason, reasonText, coverageText, confirmation]
      properties:
        id:
          type: string
          example: l1
        ingredientKey:
          type: string
        ingredientId:
          type: [string, "null"]
        name:
          type: string
        category:
          $ref: "#/components/schemas/GroceryCategoryName"
        amounts:
          type: array
          description: The grocery list's amounts.
          items:
            $ref: "#/components/schemas/ShoppingAmount"
        quantityText:
          type: string
        unquantified:
          type: boolean
        groceryStatus:
          type: string
          enum: [toBuy, inPantry, pantryHint]
        product:
          type: object
          required: [productId, displayName, productUrl, packageSize]
          properties:
            productId:
              type: string
            displayName:
              type: string
            productUrl:
              type: string
            packageSize:
              oneOf:
                - $ref: "#/components/schemas/ShoppingAmount"
                - type: "null"
        computedPackages:
          type: integer
          description: Exact package math (docs/api.md#match-and-hand-off).
        packages:
          type: integer
          description: What the cart link asks for.
        packagesOverridden:
          type: boolean
        checkAmount:
          type: boolean
        reason:
          type: [string, "null"]
          enum: [unit_not_convertible, no_package_size, package_count_capped, null]
        reasonText:
          type: [string, "null"]
          example: "Check amount: 4 cloves doesn't convert to a 3 ct package"
        coverageText:
          type: string
          example: 3 × 16 oz covers 36 oz
        confirmation:
          description: Null on a match.
          oneOf:
            - $ref: "#/components/schemas/ShoppingLineConfirmation"
            - type: "null"
    ShoppingExcludedLine:
      type: object
      required: [ingredientKey, ingredientId, name, category, amounts, quantityText, unquantified, groceryStatus, reason, text]
      properties:
        ingredientKey:
          type: string
        ingredientId:
          type: [string, "null"]
        name:
          type: string
          description: Empty for `not_on_list`.
        category:
          type: string
        amounts:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingAmount"
        quantityText:
          type: string
        unquantified:
          type: boolean
        groceryStatus:
          type: [string, "null"]
          enum: [toBuy, inPantry, pantryHint, null]
        reason:
          type: string
          enum: [in_pantry, pantry_hint, house_made, checked_off, excluded, not_selected, no_product, not_on_list]
        text:
          type: string
          example: Choose a Walmart product
    ShoppingCartLink:
      type: object
      required: [url, lineIds, itemCount]
      properties:
        url:
          type: string
          description: |
            `https://www.walmart.com/sc/cart/addToCart?items=ID_QTY,ID&storeId=N`
            (a `goto.walmart.com` link wrapping it when affiliate tracked). At
            most 2,000 characters and 40 products per link.
          example: https://www.walmart.com/sc/cart/addToCart?items=123456789_3,987654321&storeId=5435
        lineIds:
          type: array
          items:
            type: string
        itemCount:
          type: integer
          description: Distinct products in the link.
    ShoppingProposal:
      type: object
      required: [provider, week, storeId, lines, excluded, cartLinks, affiliateTracked]
      properties:
        provider:
          type: string
          example: walmart
        week:
          $ref: "#/components/schemas/IsoWeek"
        storeId:
          type: [string, "null"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingHandoffLine"
        excluded:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingExcludedLine"
        cartLinks:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingCartLink"
        affiliateTracked:
          type: boolean
    ShoppingHandoff:
      allOf:
        - $ref: "#/components/schemas/ShoppingProposal"
        - type: object
          required: [id, status, createdBy, createdAt, updatedAt]
          properties:
            id:
              type: string
            status:
              type: string
              enum: [open, done]
              description: "`open` while some line is pending."
            createdBy:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ShoppingHandoffList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShoppingHandoff"
    ConfirmShoppingOrderRequest:
      type: object
      description: "`all: true`, or `lines`; `skipRest: true` alone says nothing was ordered."
      properties:
        all:
          type: boolean
          description: Every line that isn't skipped, at its `packages`.
        lines:
          type: array
          items:
            type: object
            required: [lineId]
            properties:
              lineId:
                type: string
              packages:
                type: integer
                minimum: 1
                maximum: 99
                description: What was ordered; defaults to the line's `packages`.
        skipRest:
          type: boolean
          description: Mark the other pending lines as not ordered.
    ConfirmShoppingOrderResponse:
      type: object
      required: [handoff, purchases]
      properties:
        handoff:
          $ref: "#/components/schemas/ShoppingHandoff"
        purchases:
          type: array
          items:
            type: object
            required: [lineId, ingredientKey, created, purchase, item]
            properties:
              lineId:
                type: string
              ingredientKey:
                type: string
              created:
                type: boolean
                description: False when the line was already confirmed; the first purchase is returned.
              purchase:
                $ref: "#/components/schemas/PantryPurchase"
              item:
                $ref: "#/components/schemas/PantryItem"
  responses:
    Forbidden:
      description: "`forbidden`: the caller is a member of the household, but their role doesn't allow this action."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        `last_admin`: the change would leave the household without an admin.
        `conflict`: the membership changed concurrently; reload and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PlanConflict:
      description: |
        `plan_finalized`: the plan is finalized; set its status to `draft` first.
        `plan_full`: the week already has 50 entries.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AutopilotConflict:
      description: |
        `conflict`: the profile or week context kept changing concurrently after several automatic retries; retry.
        `plan_finalized`: the week's plan is finalized; set its status to `draft` to use Autopilot.
        `plan_full`: accepting would put more than 50 entries in the week.
        `proposal_changed`: `version` is stale, or the proposal changed concurrently; reload it and retry.
        `proposal_not_pending`: the proposal was already accepted or rejected.
        `no_alternative`: no other recipe fits the slot's day (swap); the message says why.
        `nothing_to_accept`: every meal is excluded, or its day or recipe is already planned.
        `proposal_stale`: a recipe in the proposal was removed or lost the serving size; generate the week again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PantryConflict:
      description: "`conflict`: the item kept changing concurrently after several automatic retries; retry."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvitationInvalid:
      description: |
        `invitation_invalid`: the token or code is unknown, expired, revoked,
        or already used. The reasons are deliberately not distinguished.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: |
        `invalid_request` (malformed JSON, unknown field, wrong type, empty body)
        or `validation_failed` (missing or invalid field).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: |
        `unauthenticated` (missing, invalid, rotated, or revoked token) or
        `token_expired` (access token expired; refresh and retry).
      headers:
        WWW-Authenticate:
          description: Sent by authenticated routes.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: "`payload_too_large`: the body exceeds HTTP_MAX_BODY_BYTES (RECIPE_IMPORT_MAX_BYTES for recipe imports)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: "`rate_limited`: too many requests from this client IP (sign-in and invitation endpoints) or from this user (event ingestion)."
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ShoppingConflict:
      description: |
        `conflict`: another request is confirming the same handoff line, or a
        pantry item kept changing concurrently. Retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderUnavailable:
      description: |
        `provider_unavailable`: the sign-in method is not configured, the
        provider's signing keys could not be fetched (retry later), or the
        shopping provider isn't enabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
