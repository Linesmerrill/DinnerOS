      operationId: listAutopilotPreferenceHistory
      tags: [autopilot]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/vocabulary:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: Get Autopilot choices
      description: |
        Everything the onboarding and preference screens offer: cuisines and
        tags from the household's main meals plus starter values, the fixed
        lists, and the validation limits. Requires `household.view`.
      operationId: getAutopilotVocabulary
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotVocabulary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/recipe-overrides:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List recipe method overrides
      description: The household's cooking-method overrides, one per recipe that has any. Requires `household.view`.
      operationId: listAutopilotRecipeOverrides
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The overrides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotRecipeOverrideList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/recipes/{recipeId}/attributes:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    get:
      summary: Get a recipe's Autopilot attributes
      description: |
        What Autopilot derives from the recipe (cook time and band, cuisines,
        tags, proteins, allergens, diets, spiciness, and the cooking methods it
        suits), with the household's overrides applied. The time band uses the
        profile's cook-time limits. Requires `household.view`. 404 when the
        recipe isn't in the household.
      operationId: getAutopilotRecipeAttributes
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The attributes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotRecipeAttributes"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/recipes/{recipeId}/override:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    put:
      summary: Override a recipe's cooking methods
      description: |
        Requires `plan.edit`. Says whether the recipe suits each named method;
        `null` clears that method's override, returning it to the heuristic.
        Methods left out don't change. Each changed method appears in the
        preference history. 404 when the recipe isn't in the household.
      operationId: setAutopilotRecipeOverride
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotRecipeOverrideRequest"
      responses:
        "200":
          description: The recipe's attributes with the override applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotRecipeAttributes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/context:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: Get a week's Autopilot context
      description: |
        What's special about the week. Requires `household.view`. A week
        without a saved context reads empty, with `configured: false` and null
        `updatedBy` and `updatedAt`, not a 404.
      operationId: getAutopilotWeekContext
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The week context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotWeekContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Save a week's Autopilot context
      description: |
        Requires `plan.edit`. Replaces the whole context; fields left out take
        their empty values. Days with nothing set are dropped. Changes appear
        in the preference history; saving an identical context changes
        nothing. 409 `conflict` when the context kept changing concurrently.
      operationId: saveAutopilotWeekContext
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotWeekContextRequest"
      responses:
        "200":
          description: The saved week context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotWeekContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
    delete:
      summary: Clear a week's Autopilot context
      description: Requires `plan.edit`. Also 204 when the week had no context.
      operationId: clearAutopilotWeekContext
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cleared.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/generate:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Generate an Autopilot week
      description: |
        Requires `plan.edit`. Proposes meals for the week's open days from the
        profile, the week context, ratings, and history, and saves it as the
        week's proposal, replacing any earlier one (a pending one is recorded
        as rejected). Meals already in the plan are kept and their days aren't
        planned. The plan doesn't change until the proposal is accepted. A
        proposal can plan fewer meals than requested; `unfilled` and
        `messages` say why. The body is optional: an empty body, chunked or
        not, means no options.
        409 `plan_finalized` or `proposal_changed`.
      operationId: generateAutopilotWeek
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotGenerateRequest"
      responses:
        "201":
          description: The new proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/proposal:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: Get a week's Autopilot proposal
      description: |
        The week's latest proposal, whatever its status. Requires
        `household.view`. 404 when the week has none.
      operationId: getAutopilotProposal
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/proposal/slots/{slotId}/swap:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - $ref: "#/components/parameters/SlotID"
    post:
      summary: Swap a proposed meal
      description: |
        Requires `plan.edit`. Replaces the slot's meal with the next best
        recipe that honors the same constraints, given the plan and the other
        proposed meals. Meals swapped out of a slot aren't offered for it
        again. Send the proposal's current `version`; the response carries
        the new one. 400 when `slotId` isn't a day code; 404 when the week has
        no proposal or no meal on that day. 409 `proposal_changed`, `proposal_not_pending`,
        `no_alternative`, or `plan_finalized`.
      operationId: swapAutopilotMeal
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotVersionRequest"
      responses:
        "200":
          description: The proposal after the swap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/proposal/accept:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Accept an Autopilot week
      description: |
        Requires `plan.edit`. Adds the proposal's meals, except
        `excludeSlotIds`, to the week's draft plan as entries with origin
        `autopilot` in one atomic change, and marks the proposal accepted.
        Accepting never replaces or duplicates entries: a meal whose day has
        been planned since (`dayTaken`) or whose recipe is already in the week
        (`alreadyPlanned`) is left out and listed in `skipped`. 400 when an
        excluded ID isn't a slot of the proposal. 404 when the week has no
        proposal. 409 `proposal_changed`, `proposal_not_pending`,
        `nothing_to_accept`, `proposal_stale`, `plan_finalized`, or
        `plan_full`.
      operationId: acceptAutopilotWeek
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotAcceptRequest"
      responses:
        "200":
          description: The accepted proposal, the plan after adding its meals, and what was added and skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotAcceptResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/pairings:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: Pairings for the week's meals
      description: |
        Add-ons and grocery items to have with the week's planned main meals,
        from the household's pairing rules and from what it usually has
        (docs/autopilot.md#add-on-pairings). At most 3 per meal; pairings
        already in the week or dismissed are left out. Reading records
        `pairing.suggested` once per meal and target. Requires
        `household.view`.
      operationId: listAutopilotWeekPairings
      tags: [autopilot]
      security:
        - bearerAuth: []
      parameters:
        - name: entryId
          in: query
          description: Only this plan entry's meal, for the "you added a pasta dish" prompt.
          schema:
            type: string
      responses:
        "200":
          description: The week's pairings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotWeekPairings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/pairings/accept:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Add a pairing to the week
      description: |
        Requires `plan.edit`. An add-on recipe becomes a plan entry on the
        meal's day with origin `autopilot` and the smallest authored serving
        size that feeds the meal; a grocery item joins the week's grocery
        list. Accepting something the week already has adds nothing and
        returns `alreadyAdded`. 404 when the plan entry or the pairing is
        unknown; 409 `plan_finalized`.
      operationId: acceptAutopilotPairing
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotPairingActionRequest"
      responses:
        "200":
          description: What was added, and the week's plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotPairingAcceptResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/pairings/dismiss:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Dismiss a pairing for this week
      description: |
        Requires `plan.edit`. Hides the pairing for that meal this week and
        returns the week's pairings. Dismissing again changes nothing.
      operationId: dismissAutopilotPairing
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotPairingActionRequest"
      responses:
        "200":
          description: The week's pairings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotWeekPairings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/pairings/rules:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Keep a learned pairing as a rule
      description: |
        Requires `plan.edit`. Turns a learned pairing into a household rule
        for its meal category, saved in the profile's `pairings` section. The
        same item for a second category joins the rule it already has
        (`merged`); a rule that already covers it is `unchanged`. 400 when the
        pairing comes from a rule that no longer exists or has no meal
        category.
      operationId: createAutopilotPairingRule
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotMakePairingRuleRequest"
      responses:
        "200":
          description: The rule and the profile it was saved in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotMakePairingRuleResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/pairings/grocery-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Take a paired grocery item off the week
      description: Requires `plan.edit`. 404 when the week has no such item; 409 `plan_finalized`.
      operationId: deleteAutopilotPairingGroceryItem
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/recipes/{recipeId}/pairings:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    get:
      summary: What goes well with a recipe
      description: |
        The recipe detail's "Tastes even better with" list: add-ons and
        grocery items the household pairs with this meal, whether or not it is
        planned. Unlike the week's pairings, items already in the week are
        included with `inPlan: true`. At most 6; add-ons have none. Requires
        `household.view`.
      operationId: listRecipePairings
      tags: [autopilot]
      security:
        - bearerAuth: []
      parameters:
        - name: week
          in: query
          description: Set `inPlan` against this week, and return the recipe's plan entry when it has one.
          schema:
            $ref: "#/components/schemas/IsoWeek"
      responses:
        "200":
          description: The recipe's pairings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotRecipePairings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/proposal/reject:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Reject an Autopilot week
      description: |
        Requires `plan.edit`. Dismisses a pending proposal; the plan doesn't
        change. 404 when the week has no proposal. 409 `proposal_changed` or
        `proposal_not_pending`.
      operationId: rejectAutopilotWeek
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotVersionRequest"
      responses:
        "200":
          description: The rejected proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        DinnerOS access token from a sign-in or refresh response. Valid for 15
        minutes. An expired token yields 401 `token_expired`; refresh and retry.
  headers:
    RequestID:
      description: |
        Request correlation ID. A well-formed incoming `X-Request-ID`
        (8–128 chars of `A-Za-z0-9._-`) is reused; otherwise one is generated.
        Every response includes it.
      schema:
        type: string
  parameters:
    HouseholdID:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80913
    UserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80912
    InvitationID:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80914
    RecipeID:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80915
    Week:
      name: week
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IsoWeek"
    EntryID:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80c01
    PantryItemID:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    SpecialtyID:
      name: specialtyId
      in: path
      required: true
      description: A specialty ingredient's stable slug.
      schema:
        type: string
        example: southwest-spice-blend
    SpecialtyOptionID:
      name: optionId
      in: path
      required: true
      description: A household option ID.
      schema:
        type: string
    SlotID:
      name: slotId
      in: path
      required: true
      description: A proposal slot's ID, which is its day code.
      schema:
        $ref: "#/components/schemas/AutopilotDay"
    ShoppingProvider:
      name: provider
      in: path
      required: true
      description: |
        A shopping provider key. `walmart` is enabled; `instacart` and
        `kroger` return 503 `provider_unavailable`; anything else 404.
      schema:
        type: string
        example: walmart
    IngredientKey:
      name: ingredientKey
      in: path
      required: true
      description: |
        A grocery line's `ingredientKey`, percent-encoded: a catalog
        ingredient ID, or `name:` and a normalized name (`name:red%20onion`).
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80a14
    ShoppingHandoffID:
      name: handoffId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80b01
  schemas:
    RecipeSummary:
      type: object
      required: [id, name, timesOrdered, isAddon, tags, calories, proteinGrams, timeBand, householdRating, myRating]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80915
        name:
          type: string
          example: Beef Tacos
        headline:
          type: string
        imageUrl:
          type: string
        totalMinutes:
          type: integer
        cookMinutes:
          type: integer
          minimum: 1
          description: |
            Effective cook time: the larger of `prepMinutes` and
            `totalMinutes` (sources report them inconsistently). Omitted when
            neither is known. Use it for display and time filters.
        timesOrdered:
          type: integer
          description: Number of distinct weeks the household received this recipe.
        lastOrderedWeek:
          type: string
          description: ISO week of the latest delivery. Omitted when never ordered.
          example: 2026-W30
        isAddon:
          type: boolean
        tags:
          type: array
          items:
            type: string
        calories:
          type: [integer, "null"]
          description: |
            Kilocalories per serving, read from the recipe's nutrition list.
            Null when the source didn't report energy.
          example: 690
        proteinGrams:
          type: [integer, "null"]
          description: Grams of protein per serving, or null.
          example: 36
        timeBand:
          $ref: "#/components/schemas/TimeBand"
        householdRating:
          $ref: "#/components/schemas/HouseholdRating"
        myRating:
          description: The caller's own rating, or null.
          oneOf:
            - $ref: "#/components/schemas/Rating"
            - type: "null"
    RecipeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
        nextCursor:
          type: string
          description: Present when another page exists.
    TimeBand:
      type: [string, "null"]
      enum: [quick, medium, long, null]
      description: |
        The band a recipe's `cookMinutes` falls in under the household's
        Autopilot cook-time limits (20 and 35 minutes by default). Null when
        the cook time is unknown.
    MenuResponse:
      type: object
      required: [week, weekStart, weekEnd, currentWeek, timing, plan, proposal, sections]
      properties:
        week:
          type: string
          example: 2026-W38
        weekStart:
          type: string
          description: The week's Monday, YYYY-MM-DD.
          example: 2026-09-14
        weekEnd:
          type: string
          description: The week's Sunday, YYYY-MM-DD.
          example: 2026-09-20
        currentWeek:
          type: string
          description: The household's current week, which `timing` compares to.
          example: 2026-W38
        timing:
          type: string
          enum: [past, current, upcoming]
        plan:
          description: The week's plan, or null when nothing is stored for it.
          oneOf:
            - $ref: "#/components/schemas/Plan"
            - type: "null"
        proposal:
          description: A summary of the week's Autopilot proposal, or null.
          oneOf:
            - $ref: "#/components/schemas/MenuProposalSummary"
            - type: "null"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/MenuSection"
    MenuProposalSummary:
      type: object
      required: [id, status, version, plannedMeals]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [proposed, accepted, rejected]
        version:
          type: integer
          format: int64
        plannedMeals:
          type: integer
    MenuSection:
      type: object
      required: [id, kind, title, subtitle, items, moreQuery]
      properties:
        id:
          type: string
          description: |
            `favorites`, `quick`, `new_to_you`, `long_cooks`, `sides`,
            `history_planned`, `history_ordered`, or `rule_<day>` for a
            weekday rule (`rule_sun`, and `rule_sun_2` for a second rule on
            one day). Treat it as opaque: new IDs can appear.
          example: favorites
        kind:
          type: string
          enum: [carousel, history]
        title:
          type: string
          example: Your Favorites
        subtitle:
          type: string
          example: Based on what you rate and reorder
        items:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/MenuCard"
        moreQuery:
          description: |
            Query parameters for GET .../menu/recipes that list more of the
            same, or null. Every value is a string.
          oneOf:
            - type: object
              additionalProperties:
                type: string
              example: { "sort": "popular" }
            - type: "null"
    MenuCard:
      type: object
      required: [recipe, badges, reason, inPlan, planEntryIds]
      properties:
        recipe:
          $ref: "#/components/schemas/RecipeSummary"
        badges:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/MenuBadge"
        reason:
          type: [string, "null"]
          description: A short explanation, or null.
          example: Ordered 21 times
        inPlan:
          type: boolean
          description: The shown week's plan has this recipe.
        planEntryIds:
          type: array
          description: The shown week's plan entries for this recipe.
          items:
            type: string
    MenuBadge:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
          enum: [quick, make_again, kid_favorite, new, top_rated, autopilot_pick, smoker_friendly, often_ordered]
        text:
          type: string
          example: Make Again
    MenuRecipesResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuCard"
        nextCursor:
          type: [string, "null"]
          description: Null on the last page. Send it back with the same sort.
    MenuFiltersResponse:
      type: object
      required: [proteins, cuisines, tags, maxMinutes, sorts]
      properties:
        proteins:
          type: array
          items:
            $ref: "#/components/schemas/MenuFilterOption"
        cuisines:
          type: array
          items:
            $ref: "#/components/schemas/MenuFilterOption"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/MenuFilterOption"
        maxMinutes:
          type: array
          description: Cook-time chips, in minutes.
          items:
            type: integer
          example: [15, 20, 30, 45]
        sorts:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
                enum: [recommended, popular, recent, quick, name]
              label:
                type: string
    MenuFilterOption:
      type: object
      required: [value, label, count]
      properties:
        value:
          type: string
          description: Send this back as the filter's value.
          example: chicken
        label:
          type: string
          example: Chicken
        count:
          type: integer
          description: Main meals the chip matches.
    WeeksResponse:
      type: object
      required: [items, earliestWeek]
      properties:
        items:
          type: array
          description: Weeks, oldest first.
          items:
            $ref: "#/components/schemas/WeekSummary"
        earliestWeek:
          type: [string, "null"]
          description: |
            The earliest week with a planned entry or an ordered main meal,
            so the app knows how far back "Past" goes. Null without history.
          example: 2023-W05
    WeekSummary:
      type: object
      required: [week, weekStart, weekEnd, timing, plannedCount, addOnCount, cookedCount, orderedCount, status]
      properties:
        week:
          type: string
          example: 2026-W30
        weekStart:
          type: string
          example: 2026-07-20
        weekEnd:
          type: string
          example: 2026-07-26
        timing:
          type: string
          enum: [past, current, upcoming]
        plannedCount:
          type: integer
          description: |
            Planned main meals that week. Add-ons are excluded, so this is the
            number to show as "meals".
        addOnCount:
          type: integer
          description: |
            Planned add-ons that week (a pairing's garlic bread). Counted
            separately so "5 meals · 1 add-on" reads correctly.
        cookedCount:
          type: integer
          description: Distinct recipe.cooked events that week.
        orderedCount:
          type: integer
          description: Main meals delivered that week; add-ons are excluded.
        status:
          type: string
          enum: [draft, finalized, none]
          description: none when no plan is stored for the week.
    Recipe:
      type: object
      required: [id, householdId, source, sourceRecipeId, sourceAliases, name, isAddon, servings, cuisines, tags, utensils, allergens, nutritionPerServing, ingredients, steps, orderWeeks, timesOrdered, createdAt, updatedAt, householdRating, myRating]
      properties:
        id:
          type: string
        householdId:
          type: string
        source:
          type: string
          enum: [hellofresh, manual, import, user, provider, partner]
        sourceRecipeId:
          type: string
        sourceAliases:
          type: array
          description: Other source IDs known to be this recipe.
          items:
            type: string
        sourceUrl:
          type: string
        name:
          type: string
        headline:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        isAddon:
          type: boolean
        servings:
          type: array
          description: Serving sizes with authored amounts, ascending.
          items:
            type: integer
        prepMinutes:
          type: integer
        totalMinutes:
          type: integer
        cookMinutes:
          type: integer
          minimum: 1
          description: |
            Effective cook time: the larger of `prepMinutes` and
            `totalMinutes` (sources report them inconsistently). Omitted when
            neither is known. Use it for display and time filters.
        timeBand:
          $ref: "#/components/schemas/TimeBand"
        calories:
          type: [integer, "null"]
          description: Kilocalories per serving, or null.
          example: 690
        proteinGrams:
          type: [integer, "null"]
          description: Grams of protein per serving, or null.
          example: 36
        difficulty:
          type: integer
          description: The source's difficulty scale, when it gave one.
        cuisines:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        utensils:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        nutritionPerServing:
          type: array
          items:
            type: object
            required: [name, amount, unit]
            properties:
              name:
                type: string
              amount:
                type: number
              unit:
                type: string
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredient"
        steps:
          type: array
          items:
            type: object
            required: [index, text]
            properties:
              index:
                type: integer
              text:
                type: string
              imageUrl:
                type: string
        orderWeeks:
          type: array
          description: ISO weeks the household received this recipe, sorted.
          items:
            type: string
            example: 2026-W30
        timesOrdered:
          type: integer
        lastOrderedWeek:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        householdRating:
          $ref: "#/components/schemas/HouseholdRating"
        myRating:
          description: The caller's own rating, or null.
          oneOf:
            - $ref: "#/components/schemas/Rating"
            - type: "null"
    RecipeIngredient:
      type: object
      required: [ingredientId, name, category, pantryStaple, amounts]
      properties:
        ingredientId:
          type: string
          description: Catalog ingredient ID.
        name:
          type: string
          example: Parmesan Cheese
        category:
          type: string
          enum: [produce, meat-seafood, dairy-eggs, bakery, deli, pantry, spices, condiments, frozen, beverages, other]
        imageUrl:
          type: string
          description: |
            The catalog ingredient's image, when it has one. Ingredient lines
            carry no allergens of their own: the import format reports
            allergens per recipe.
        pantryStaple:
          type: boolean
          description: Source hint that the ingredient is usually at home.
        amounts:
          type: array
          items:
            $ref: "#/components/schemas/IngredientAmount"
    IngredientAmount:
      type: object
      required: [servings, quantity, quantityValue, unit, sourceUnit, rawText]
      properties:
        servings:
          type: integer
          example: 2
        quantity:
          type: [string, "null"]
          description: Exact amount as "n" or "n/d". Null when the source gave no amount.
          example: 1/2
        quantityValue:
          type: [number, "null"]
          description: The same amount as a number, for display only.
          example: 0.5
        unit:
          type: string
          description: DinnerOS unit code, or empty.
          example: oz
        sourceUnit:
          type: string
          example: ounce
        rawText:
          type: string
          example: ½ ounce Parmesan Cheese
    ImportFile:
      type: object
      description: The recipe import contract. Field-level rules are in docs/import-format.md.
      additionalProperties: false
      required: [version, source, recipes]
      properties:
        version:
          type: integer
          enum: [1]
        source:
          type: string
          enum: [hellofresh, manual, import, user, provider, partner]
        generatedAt:
          type: string
          format: date-time
        recipes:
          type: array
          items:
            type: object
            description: ImportRecipe (docs/import-format.md).
        review:
          type: array
          items:
            type: object
            description: ReviewItem (docs/import-format.md).
    ImportResult:
      type: object
      required: [created, updated, unchanged, ingredientsCreated, reviewItems, errors]
      properties:
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        ingredientsCreated:
          type: integer
          description: New ingredient catalog entries.
        reviewItems:
          type: integer
          description: Distinct review items in the file. Items already recorded are not duplicated.
        errors:
          type: array
          description: Rejected recipes, in file order.
          items:
            type: object
            required: [index, problems]
            properties:
              index:
                type: integer
                description: Position in the file's `recipes` array.
              sourceRecipeId:
                type: string
              name:
                type: string
              problems:
                type: array
                items:
                  type: string
                example: ['ingredients[3] (Mystery Paste): unit "dollop" is not a DinnerOS unit code']
    HouseholdRating:
      type: object
      required: [average, count]
      properties:
        average:
          type: [number, "null"]
          description: Mean score rounded to two decimals. Null when nobody has rated the recipe.
          example: 4.5
        count:
          type: integer
          description: Number of members who rated the recipe.
          example: 2
    RatingTag:
      type: string
      enum: [make-again, never-again, kid-favorite, kids-disliked, too-spicy, too-bland, too-much-work, great-leftovers]
      description: A fixed vocabulary; anything else belongs in `comment`. `make-again` and `never-again` can't be combined.
    Rating:
      type: object
      required: [recipeId, userId, score, comment, tags, createdAt, updatedAt]
      properties:
        recipeId:
          type: string
        userId:
          type: string
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
          description: Empty when there is none.
        tags:
          type: array
          description: Distinct, in the order the `RatingTag` enum lists them.
          items:
            $ref: "#/components/schemas/RatingTag"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MemberRating:
      allOf:
        - $ref: "#/components/schemas/Rating"
        - type: object
          required: [displayName]
          properties:
            displayName:
              type: string
              description: May be empty when the user has no display name.
    RatingListResponse:
      type: object
      required: [householdRating, items]
      properties:
        householdRating:
          $ref: "#/components/schemas/HouseholdRating"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemberRating"
    RateRecipeRequest:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
          description: Leading and trailing whitespace is trimmed.
        tags:
          type: array
          description: Duplicates are ignored.
          items:
            $ref: "#/components/schemas/RatingTag"
    ClientEvent:
      type: object
      additionalProperties: false
      required: [type, occurredAt]
      properties:
        clientEventId:
          type: string
          maxLength: 64
          description: Optional idempotency key, unique per user (a UUID works). Retries with the same key are stored once.
        type:
          type: string
          enum: [recipe.viewed, recipe.cooked, recipe.skipped, grocery.item_checked]
        recipeId:
          type: string
          description: Required for `recipe.*` types and not allowed otherwise. Must be a recipe of the household.
        week:
          type: string
          pattern: '^\d{4}-W(0[1-9]|[1-4]\d|5[0-3])$'
          description: ISO week the event concerns, if any.
          example: 2026-W38
        occurredAt:
          type: string
          format: date-time
          description: When it happened, from the device clock. Within the last 30 days and at most 5 minutes ahead.
        payload:
          description: At most 1024 bytes. The shape depends on `type`; unknown fields are rejected.
          anyOf:
            - $ref: "#/components/schemas/RecipeViewedPayload"
            - $ref: "#/components/schemas/RecipeCookedPayload"
            - $ref: "#/components/schemas/RecipeSkippedPayload"
            - $ref: "#/components/schemas/GroceryItemCheckedPayload"
    RecipeViewedPayload:
      type: object
      additionalProperties: false
      properties:
        surface:
          type: string
          enum: [detail, plan, search, recommendation]
    RecipeCookedPayload:
      type: object
      additionalProperties: false
      properties:
        entryId:
          type: string
          maxLength: 64
          description: The plan entry that was cooked, if it was planned.
        date:
          type: string
          format: date
        servings:
          type: integer
          minimum: 1
          maximum: 12
    RecipeSkippedPayload:
      type: object
      additionalProperties: false
      properties:
        entryId:
          type: string
          maxLength: 64
        date:
          type: string
          format: date
        reason:
          type: string
          enum: [no-time, ate-out, missing-ingredients, not-in-the-mood, other]
    GroceryItemCheckedPayload:
      type: object
      additionalProperties: false
      description: "`ingredientId` or `name` is required."
      required: [checked]
      properties:
        ingredientId:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 100
        checked:
          type: boolean
          description: False when the item was unchecked again.
    IngestEventsRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ClientEvent"
    IngestEventsResponse:
      type: object
      required: [accepted, duplicates, rejected]
      properties:
        accepted:
          type: integer
          description: Newly stored events.
        duplicates:
          type: integer
          description: Events whose `clientEventId` was already stored or repeated in the batch.
        rejected:
          type: array
          description: Invalid events, in batch order. Retrying them won't help.
          items:
            type: object
            required: [index, message]
            properties:
              index:
                type: integer
                description: Position in `events`.
              message:
                type: string
                example: "occurredAt must be within the last 30 days"
    Role:
      type: string
      enum: [admin, member]
      description: |
        A member's role. More roles (viewer, shopper, child, guest) may be
        added later; clients should rely on `permissions`, not the role name.
    Permission:
      type: string
      enum:
        - household.view
        - household.update
        - members.view
        - members.invite
        - members.remove
        - members.changeRole
        - plan.edit
        - pantry.edit
        - recipes.edit
        - recipes.import
        - shopping.edit
    Household:
      type: object
      required: [id, name, defaultServings, timeZone, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80913
        name:
          type: string
          maxLength: 100
          example: The Lines
        defaultServings:
          type: integer
          minimum: 1
          maximum: 12
          example: 2
        timeZone:
          type: string
          description: IANA time zone name. Plan dates are interpreted in it.
          example: America/Denver
        createdBy:
          type: string
          description: User ID of the member who created the household.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Membership:
      type: object
      required: [id, householdId, userId, role, permissions, createdAt, updatedAt]
      properties:
        id:
          type: string
        householdId:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Member:
      type: object
      required: [userId, displayName, role, joinedAt]
      properties:
        userId:
          type: string
        displayName:
          type: string
          description: May be empty when the user has no display name.
          example: Ada Lovelace
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
    CreateHouseholdRequest:
      type: object
      additionalProperties: false
      required: [name, timeZone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Leading and trailing whitespace is trimmed.
          example: The Lines
        timeZone:
          type: string
          description: IANA time zone name (not an offset, not "Local").
          example: America/Denver
        defaultServings:
          type: integer
          minimum: 1
          maximum: 12
          default: 2
    UpdateHouseholdRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        timeZone:
          type: string
          example: Europe/Paris
        defaultServings:
          type: integer
          minimum: 1
          maximum: 12
    CreateHouseholdResponse:
      type: object
      required: [household, membership]
      properties:
        household:
          $ref: "#/components/schemas/Household"
        membership:
          $ref: "#/components/schemas/Membership"
    HouseholdListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [household, role, permissions]
            properties:
              household:
                $ref: "#/components/schemas/Household"
              role:
                $ref: "#/components/schemas/Role"
              permissions:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
    HouseholdDetailResponse:
      type: object
      required: [household, role, permissions]
      properties:
        household:
          $ref: "#/components/schemas/Household"
        members:
          type: array
          description: Oldest member first. Omitted when the caller's role lacks `members.view`.
          items:
            $ref: "#/components/schemas/Member"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          description: What the caller may do in this household.
          items:
            $ref: "#/components/schemas/Permission"
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    Invitation:
      type: object
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          description: Trimmed and lowercased.
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time
          description: Seven days after creation.
        createdAt:
          type: string
          format: date-time
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: A bare address (no display name).
          example: bob@example.com
        role:
          $ref: "#/components/schemas/Role"
    CreateInvitationResponse:
      type: object
      required: [invitation, code, emailDelivered]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        code:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$"
          description: |
            Invite code to share directly. Returned only in this response; it
            can't be retrieved later. The email contains the same code.
          example: 7K3QM-X9D2P
        emailDelivered:
          type: boolean
          description: False when the email could not be sent. The invitation and code still work.
    InvitationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `token` or `code`.
      properties:
        token:
          type: string
          maxLength: 256
          description: The token from the invitation link.
        code:
          type: string
          maxLength: 64
          description: The invite code. Case-insensitive; spaces and dashes are ignored.
          example: 7k3qm x9d2p
      oneOf:
        - required: [token]
        - required: [code]
    InvitationPreviewResponse:
      type: object
      required: [householdName, inviterName, role, expiresAt]
      properties:
        householdName:
          type: string
          example: The Lines
        inviterName:
          type: string
          description: The inviter's display name. Empty when they have none.
          example: Merrill Lines
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time
    AcceptInvitationResponse:
      type: object
      required: [household, role, permissions]
      properties:
        household:
          $ref: "#/components/schemas/Household"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          example:
            mongodb: ok
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          description: Configured application name (APP_NAME).
          example: DinnerOS
        version:
          type: string
          description: Deployed build identifier.
          example: 3f2c1ab

    AppleSignInRequest:
      type: object
      additionalProperties: false
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
          description: The `identityToken` from `ASAuthorizationAppleIDCredential`, as a UTF-8 string.
        nonce:
          type: string
          maxLength: 512
          description: The raw nonce the app generated. Apple's request must use its SHA-256 hex digest.
        fullName:
          type: string
          maxLength: 100
          description: |
            Display name formatted by the app. Apple provides it only on the
            first authorization; it is used only when a new user is created.
    GoogleSignInRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          description: The Google Sign-In ID token.
        nonce:
          type: string
          maxLength: 512
          description: Optional raw nonce passed to Google Sign-In. When present, the token's `nonce` claim must equal it.
    DevSignInRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          maxLength: 256
          description: Stable test identity; the same subject always signs in to the same user.
          example: simulator-ada
        email:
          type: string
          format: email
          example: ada@example.com
        displayName:
          type: string
          maxLength: 100
          example: Ada
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
          description: JWT bearer token for authenticated routes.
        accessTokenExpiresAt:
          type: string
          format: date-time
          example: "2026-09-14T18:45:00Z"
        refreshToken:
          type: string
          description: Opaque single-use token (43 base64url characters). Store in the Keychain.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Sliding expiry; each refresh extends it to 60 days from the refresh.
          example: "2026-11-13T18:30:00Z"
    SessionResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user, isNewUser]
          properties:
            user:
              $ref: "#/components/schemas/User"
            isNewUser:
              type: boolean
              description: True when this sign-in created the account.
    User:
      type: object
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80912
        displayName:
          type: string
          description: May be empty when no provider supplied a name.
          example: Ada Lovelace
        primaryEmail:
          type: string
          format: email
          description: Present only when a provider verified it. May be an Apple private relay address.
        createdAt:
          type: string
          format: date-time
    Identity:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [apple, google, dev]
        email:
          type: string
          format: email
          description: Verified email from this provider, if any.
    MeResponse:
      type: object
      required: [user, identities]
      properties:
        user:
          $ref: "#/components/schemas/User"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
    IsoWeek:
      type: string
      pattern: "^[0-9]{4}-W[0-9]{2}$"
      description: ISO 8601 week, Monday to Sunday. The week must exist in its year (52 or 53 weeks).
      example: 2026-W38
    PlanDay:
      type: [string, "null"]
      enum: [mon, tue, wed, thu, fri, sat, sun, null]
      description: Day of the week, or null for "this week, not scheduled".
    PlanStatus:
      type: string
      enum: [draft, finalized]
      description: A finalized plan's entries are locked until it is set back to draft.
    Plan:
      type: object
      required: [householdId, week, startDate, endDate, status, entries, createdAt, updatedAt]
      properties:
        householdId:
          type: string
        week:
          $ref: "#/components/schemas/IsoWeek"
        startDate:
          type: string
          format: date
          description: The week's Monday.
          example: "2026-09-14"
        endDate:
          type: string
          format: date
          description: The week's Sunday.
          example: "2026-09-20"
        status:
          $ref: "#/components/schemas/PlanStatus"
        entries:
          type: array
          description: In the order they were added.
          items:
            $ref: "#/components/schemas/PlanEntry"
        createdAt:
          type: [string, "null"]
          format: date-time
          description: Null for a week nobody has planned.
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: Null for a week nobody has planned.
    MealCustomizations:
      type: object
      required: [recipeId, servings, groups]
      properties:
        recipeId:
          type: string
        servings:
          type: integer
          description: The serving size the amounts are for.
          example: 2
        groups:
          type: array
          description: One per customizable protein line, in recipe order. Empty when the recipe has none.
          items:
            $ref: "#/components/schemas/MealCustomizationGroup"
    MealCustomizationGroup:
      type: object
      required: [ingredientKey, ingredientName, amountText, quantity, unit, imageUrl, selectedChoiceId, choices]
      properties:
        ingredientKey:
          type: string
          description: The line's key, as on grocery items — a catalog ingredient ID or `name:<normalized name>`. Send it back in a selection.
          example: 66e5a1f2c3b4a5d6e7f80a20
        ingredientName:
          type: string
          example: Ground Pork
        amountText:
          type: string
          description: The recipe's amount for display.
          example: 10 ounce
        quantity:
          type: string
          description: The exact amount as `n` or `n/d`.
          example: "10"
        unit:
          type: string
          description: Unit code; always a weight.
          example: oz
        imageUrl:
          type: [string, "null"]
          description: The catalog ingredient's image, or null.
        selectedChoiceId:
          type: [string, "null"]
          description: The entry's current choice (`original` when it isn't customized) when `entryId` was given; null otherwise.
        choices:
          type: array
          description: The original first, then double, then each swap followed by its double.
          items:
            $ref: "#/components/schemas/MealCustomizationChoice"
    MealCustomizationChoice:
      type: object
      required: [id, label, ingredientName, amountText, quantity, unit, imageUrl, kind, badge]
      properties:
        id:
          type: string
          description: "`original`, `double`, `swap:<proteinId>`, or `swap:<proteinId>:double`."
          example: swap:ground-beef:double
        label:
          type: string
          example: 2x Ground Beef
        ingredientName:
          type: string
          example: Ground Beef
        amountText:
          type: string
          example: 20 ounce
        quantity:
          type: string
          example: "20"
        unit:
          type: string
          example: oz
        imageUrl:
          type: [string, "null"]
        kind:
          type: string
          enum: [original, double, swap, swap_double]
        badge:
          type: [string, "null"]
          description: "`Double portion` on doubled choices, otherwise null."
    SetMealCustomizationRequest:
      type: object
      required: [selections]
      additionalProperties: false
      properties:
        selections:
          type: array
          description: Replaces the entry's customizations. An empty array resets the meal.
          maxItems: 20
          items:
            type: object
            required: [ingredientKey, choiceId]
            additionalProperties: false
            properties:
              ingredientKey:
                type: string
                description: A group's `ingredientKey` for this meal.
              choiceId:
                type: string
                description: One of that group's choice IDs. `original` stores nothing.
    PlanEntryCustomization:
      type: object
      required: [ingredientKey, choiceId, label]
      properties:
        ingredientKey:
          type: string
        choiceId:
          type: string
          example: swap:ground-beef
        label:
          type: string
          description: The choice's label when it was chosen.
          example: Ground Beef
    PlanEntry:
      type: object
      required: [id, recipe, day, date, servings, note, addedBy, addedAt, origin]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80c01
        recipe:
          type: object
          description: Snapshot taken when the entry was added. Load the recipe for details.
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
              example: Beef Tacos
            imageUrl:
              type: string
        day:
          $ref: "#/components/schemas/PlanDay"
        date:
          type: [string, "null"]
          format: date
          description: The date of `day`, or null when unscheduled.
          example: "2026-09-15"
        servings:
          type: integer
          minimum: 1
          example: 2
        note:
          type: string
          maxLength: 500
        addedBy:
          type: string
          description: User ID of the member who added the entry.
        addedAt:
          type: string
          format: date-time
        origin:
          type: string
          enum: [manual, autopilot]
          description: "`autopilot` for entries added by accepting an Autopilot proposal; otherwise `manual`."
        customizations:
          type: array
          description: |
            The meal's protein customizations, omitted when the meal is cooked
            as written. See the customization endpoints.
          items:
            $ref: "#/components/schemas/PlanEntryCustomization"
    AddPlanEntryRequest:
      type: object
      required: [recipeId, servings]
      additionalProperties: false
      properties:
        recipeId:
          type: string
          description: A recipe in this household.
        day:
          $ref: "#/components/schemas/PlanDay"
        servings:
          type: integer
          description: One of the recipe's `servings`.
          example: 2
        note:
          type: string
          maxLength: 500
    AddPlanEntryResponse:
      type: object
      required: [entry, plan]
      properties:
        entry:
          $ref: "#/components/schemas/PlanEntry"
        plan:
          $ref: "#/components/schemas/Plan"
    UpdatePlanEntryRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        day:
          $ref: "#/components/schemas/PlanDay"
        servings:
          type: integer
          description: One of the recipe's `servings`.
        note:
          type: string
          maxLength: 500
    SetPlanStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/PlanStatus"
    PlanSummary:
      type: object
      required: [week, startDate, status, entryCount, updatedAt]
      properties:
        week:
          $ref: "#/components/schemas/IsoWeek"
        startDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/PlanStatus"
        entryCount:
          type: integer
          minimum: 0
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: Null for a week nobody has planned.
    PlanListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanSummary"
    GroceryList:
      type: object
      required: [week, status, pantryApplied, specialtiesApplied, categories, batches, skipped]
      properties:
        week:
          $ref: "#/components/schemas/IsoWeek"
        status:
          $ref: "#/components/schemas/PlanStatus"
        pantryApplied:
          type: boolean
          description: True when the household pantry decided item statuses.
        specialtiesApplied:
          type: boolean
          description: True when the household's specialty ingredient choices were applied.
        batches:
          type: array
          description: The house-made specialty ingredients the week uses.
          items:
            $ref: "#/components/schemas/GroceryBatch"
        categories:
          type: array
          description: In aisle order; empty categories are omitted.
          items:
            $ref: "#/components/schemas/GroceryCategory"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SkippedPlanEntry"
    GroceryCategory:
      type: object
      required: [category, items]
      properties:
        category:
          type: string
          enum: [produce, meat-seafood, dairy-eggs, bakery, deli, pantry, spices, condiments, frozen, beverages, other]
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroceryItem"
    GroceryItem:
      type: object
      required: [ingredientKey, name, amounts, quantityText, unquantified, status, recipes, specialty, specialtyDetail, via, extras]
      properties:
        ingredientKey:
          type: string
          description: The catalog ingredient ID, or `name:<normalized name>` for uncatalogued lines.
        name:
          type: string
          example: Yellow Onion
        amounts:
          type: array
          description: One amount per group of units that combine. A count and a weight stay separate.
          items:
            $ref: "#/components/schemas/GroceryAmount"
        quantityText:
          type: string
          description: The amounts' texts joined with " + ". Empty when no recipe gave an amount.
          example: 1 ½ + 8 oz
        unquantified:
          type: boolean
          description: At least one recipe gave no amount ("salt to taste").
        status:
          type: string
          enum: [toBuy, inPantry, pantryHint]
          description: |
            `inPantry`: in stock in the household pantry. `toBuy`: not at home,
            including anything the pantry marks as out. `pantryHint`: every
            recipe marks it as a staple and the pantry doesn't list it as in
            stock or out (or lists it as low).
        recipes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        specialty:
          type: boolean
          description: The item is a specialty ingredient by its own name (no choice, `as_is`, or a batch in the pantry).
        specialtyDetail:
          oneOf:
            - $ref: "#/components/schemas/GrocerySpecialty"
            - type: "null"
        via:
          type: array
          description: The specialty ingredients this item stands in for. Empty for ordinary items.
          items:
            $ref: "#/components/schemas/GroceryVia"
        extras:
          type: array
          description: What put the item on the list besides a recipe. Empty for ordinary items.
          items:
            type: object
            required: [id, origin, text]
            properties:
              id:
                type: string
                description: Identifies the extra where it is stored, so it can be removed.
              origin:
                type: string
                enum: [pairing]
                description: "`pairing`: an accepted Autopilot pairing (docs/autopilot.md#add-on-pairings)."
              text:
                type: string
                example: Club crackers for Chicken Noodle Soup
    GroceryAmount:
      type: object
      required: [quantity, quantityValue, unit, text]
      properties:
        quantity:
          type: string
          description: Exact amount as "n" or "n/d".
          example: "3/2"
        quantityValue:
          type: number
          description: The same amount as a number, for display only.
          example: 1.5
        unit:
          type: string
          description: DinnerOS unit code.
          example: count
        text:
          type: string
          example: 1 ½
    SkippedPlanEntry:
      type: object
      required: [entryId, recipeId, recipeName, reason]
      properties:
        entryId:
          type: string
        recipeId:
          type: string
        recipeName:
          type: string
        reason:
          type: string
          enum: [recipeUnavailable, servingsUnavailable]
          description: |
            `recipeUnavailable`: the recipe is no longer in the household.
            `servingsUnavailable`: the recipe no longer offers the entry's serving size.
    GroceryCategoryName:
      type: string
      enum: [produce, meat-seafood, dairy-eggs, bakery, deli, pantry, spices, condiments, frozen, beverages, other]
    PantryStatus:
      type: string
      enum: [in_stock, low, out]
      description: |
        `in_stock`: grocery lists show the ingredient as `inPantry`. `low`:
        not treated as at home (`pantryHint` if every recipe marks it as a
        staple, otherwise `toBuy`). `out`: always `toBuy`.
    PantryItem:
      type: object
      required: [id, householdId, ingredientId, key, displayName, category, quantity, quantityValue, unit, status, isStaple, expiresOn, note, statusSource, lowThresholdPercent, unitSize, estimate, updatedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        householdId:
          type: string
        ingredientId:
          type: [string, "null"]
          description: The catalog ingredient; null for free text that matched no catalog ingredient.
        key:
          type: string
          description: The normalized ingredient name, unique within the household (the catalog key when linked).
          example: olive oil
        displayName:
          type: string
          example: Olive Oil
        category:
          $ref: "#/components/schemas/GroceryCategoryName"
        quantity:
          type: [string, "null"]
          description: Exact amount as "n" or "n/d"; null when no amount was recorded ("have some").
          example: "3/2"
        quantityValue:
          type: [number, "null"]
          description: The same amount as a number, for display only.
          example: 1.5
        unit:
          type: [string, "null"]
          description: DinnerOS unit code; null exactly when quantity is null.
          example: cup
        status:
          $ref: "#/components/schemas/PantryStatus"
        isStaple:
          type: boolean
          description: An always-have item such as salt or oil.
        expiresOn:
          type: [string, "null"]
          format: date
        note:
          type: string
        statusSource:
          $ref: "#/components/schemas/PantryStatusSource"
        lowThresholdPercent:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: The item's own low-stock threshold; null uses the household's.
        unitSize:
          oneOf:
            - $ref: "#/components/schemas/PantryUnitSize"
            - type: "null"
        estimate:
          oneOf:
            - $ref: "#/components/schemas/PantryEstimate"
            - type: "null"
          description: The usage estimate; null when no amount is recorded.
        updatedBy:
          type: string
          description: User ID of the last change by a person.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PantryItemListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PantryItem"
    AddPantryItemRequest:
      type: object
      description: Either `ingredientId` or `name` is required.
      properties:
        ingredientId:
          type: string
          description: A catalog ingredient ID from GET /api/v1/ingredients.
        name:
          type: string
          maxLength: 100
          description: Display name. Defaults to the catalog name when `ingredientId` is given.
        category:
          $ref: "#/components/schemas/GroceryCategoryName"
        quantity:
          type: string
          maxLength: 32
          description: A positive amount such as `2`, `0.5`, `1/2`, `1 1/2`, or `½`. Omit for "have some".
          example: 1 1/2
        unit:
          type: string
          description: DinnerOS unit code (docs/grocery-engine.md#units). Defaults to `count` when `quantity` is given; requires `quantity`.
          example: cup
        status:
          $ref: "#/components/schemas/PantryStatus"
        isStaple:
          type: boolean
        expiresOn:
          type: string
          format: date
        note:
          type: string
          maxLength: 500
    UpdatePantryItemRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 100
        category:
          $ref: "#/components/schemas/GroceryCategoryName"
        quantity:
          type: [string, "null"]
          description: A positive amount; null or "" clears the amount and unit.
        unit:
          type: [string, "null"]
          description: DinnerOS unit code for the current or new quantity.
        status:
          $ref: "#/components/schemas/PantryStatus"
        isStaple:
          type: boolean
        expiresOn:
          type: [string, "null"]
          format: date
        note:
          type: [string, "null"]
          maxLength: 500
        lowThresholdPercent:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: The item's own low-stock threshold; null returns it to the household's.
    BulkPantryStatusRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [id, status]
            properties:
              id:
                type: string
              status:
                $ref: "#/components/schemas/PantryStatus"
    BulkPantryStatusResponse:
      type: object
      required: [items, missing]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PantryItem"
        missing:
          type: array
          description: Requested IDs that aren't in the household's pantry.
          items:
            type: string
    DefaultStaplesResponse:
      type: object
      required: [items, skipped]
      properties:
        items:
          type: array
          description: The staples added.
          items:
            $ref: "#/components/schemas/PantryItem"
        skipped:
          type: integer
          description: Default staples the pantry already had.
    PantryStatusSource:
      type: string
      enum: [person, estimate]
      description: "`estimate` when the usage estimate marked the item low; `person` otherwise."
    PantryAmount:
      type: object
      required: [quantity, quantityValue]
      properties:
        quantity:
          type: string
          description: Exact amount as "n" or "n/d".
          example: "5"
        quantityValue:
          type: number
          description: The same amount as a number, for display only.
          example: 5
    PantryUnitSize:
      type: object
      description: One `per` unit holds `quantity` `unit` ("1 count = 1/2 cup").
      required: [per, quantity, quantityValue, unit]
      properties:
        per:
          type: string
          description: A discrete unit code (count, package, can, …).
          example: count
        quantity:
          type: string
          example: "1/2"
        quantityValue:
          type: number
          example: 0.5
        unit:
          type: string
          description: A volume or weight unit code.
          example: cup
    PantryEstimate:
      type: object
      description: |
        The estimated amount left (docs/pantry-usage.md). Every amount is in
        `unit`. `remaining` and `otherUse` are rounded to hundredths and
        `dailyRate` to thousandths; `startAmount` and `recipeUse` are exact.
      required: [cycleId, cycleSource, cycleStartedAt, adjustedAt, unit, startAmount, remaining, percentRemaining, percentUsed, recipeUse, otherUse, dailyRate, skippedRecipes, lowThresholdPercent, thresholdSource, belowThreshold, summary, estimatedAt]
      properties:
        cycleId:
          type: string
          description: The purchase ID that started the cycle, or a generated ID when a person set the amount.
        cycleSource:
          type: string
          enum: [grocery_list, manual, provider, edit, house_made]
        cycleStartedAt:
          type: string
          format: date-time
        adjustedAt:
          type: [string, "null"]
          format: date-time
          description: When a person last corrected the amount in this cycle.
        unit:
          type: string
          example: tbsp
        startAmount:
          $ref: "#/components/schemas/PantryAmount"
        remaining:
          $ref: "#/components/schemas/PantryAmount"
        percentRemaining:
          type: integer
          minimum: 0
          maximum: 100
          example: 31
        percentUsed:
          type: integer
          minimum: 0
          maximum: 100
          example: 69
        recipeUse:
          type: object
          required: [count, quantity, quantityValue]
          description: Cooked recipes deducted this cycle.
          properties:
            count:
              type: integer
              example: 2
            quantity:
              type: string
              example: "6"
            quantityValue:
              type: number
              example: 6
        otherUse:
          $ref: "#/components/schemas/PantryAmount"
        dailyRate:
          type: [object, "null"]
          description: Learned non-recipe use per day; null until at least 2 usage periods are known.
          required: [quantity, quantityValue, basedOnSegments]
          properties:
            quantity:
              type: string
              example: "1"
            quantityValue:
              type: number
              example: 1
            basedOnSegments:
              type: integer
              example: 3
        skippedRecipes:
          type: integer
          description: Cooked recipes that used the item but couldn't be deducted (no amount, or units that don't convert).
        lowThresholdPercent:
          type: integer
          description: The threshold in effect.
          example: 80
        thresholdSource:
          type: string
          enum: [item, household]
        belowThreshold:
          type: boolean
          description: At least `lowThresholdPercent` of `startAmount` is used.
        summary:
          type: string
          example: "About 31% left: 2 recipes used 6 tbsp, plus about 1 tbsp a day of other use."
        estimatedAt:
          type: string
          format: date-time
    RecordPantryPurchaseRequest:
      type: object
      description: "`itemId`, or `ingredientId` or `name`, identifies the item (not both)."
      required: [source]
      properties:
        itemId:
          type: string
          description: A pantry item (restocking from the Pantry tab).
        ingredientId:
          type: string
          description: A catalog ingredient (a checked-off grocery line).
        name:
          type: string
          maxLength: 100
          description: A free-text ingredient (an uncatalogued grocery line).
        source:
          type: string
          enum: [grocery_list, manual]
        quantity:
          type: string
          maxLength: 32
          description: A positive amount; omit when unknown (the item won't be tracked).
          example: "4"
        unit:
          type: string
          description: DinnerOS unit code; defaults to `count` when `quantity` is given.
          example: count
        unitSize:
          type: object
          description: How much one `unit` holds; only for a discrete `unit`.
          required: [quantity, unit]
          properties:
            quantity:
              type: string
              example: "1/2"
            unit:
              type: string
              description: A volume or weight unit code.
              example: cup
        week:
          $ref: "#/components/schemas/IsoWeek"
        clientPurchaseId:
          type: string
          maxLength: 64
          description: Idempotency key, unique per member.
    PantryPurchase:
      type: object
      required: [id, householdId, itemId, source, quantity, quantityValue, unit, unitSize, week, clientPurchaseId, provider, recordedBy, purchasedAt]
      properties:
        id:
          type: string
          description: Also the ID of the usage cycle it started.
        householdId:
          type: string
        itemId:
          type: string
        source:
          type: string
          enum: [grocery_list, manual, provider, house_made]
          description: |
            `house_made` is a batch recorded through POST .../specialty-ingredients/{specialtyId}/batches.
            `provider` is an order confirmed through POST .../shopping/handoffs/{handoffId}/confirm.
        quantity:
          type: [string, "null"]
        quantityValue:
          type: [number, "null"]
        unit:
          type: [string, "null"]
        unitSize:
          oneOf:
            - $ref: "#/components/schemas/PantryUnitSize"
            - type: "null"
        week:
          type: [string, "null"]
        clientPurchaseId:
          type: [string, "null"]
        provider:
          description: The handoff line a `provider` purchase confirms; null for every other source.
          oneOf:
            - $ref: "#/components/schemas/PantryPurchaseProvider"
            - type: "null"
        recordedBy:
          type: string
        purchasedAt:
          type: string
          format: date-time
    RecordPantryPurchaseResponse:
      type: object
      required: [purchase, item]
      properties:
        purchase:
          $ref: "#/components/schemas/PantryPurchase"
        item:
          $ref: "#/components/schemas/PantryItem"
    PantryPurchaseListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PantryPurchase"
    PantrySettings:
      type: object
      required: [lowThresholdPercent, defaultLowThresholdPercent, updatedBy, updatedAt]
      properties:
        lowThresholdPercent:
          type: integer
          minimum: 1
          maximum: 100
          description: Percent of an item's starting amount used before the estimate marks it low.
          example: 80
        defaultLowThresholdPercent:
          type: integer
          example: 80
        updatedBy:
          type: [string, "null"]
          description: Null until someone changes the defaults.
        updatedAt:
          type: [string, "null"]
          format: date-time
    UpdatePantrySettingsRequest:
      type: object
      required: [lowThresholdPercent]
      properties:
        lowThresholdPercent:
          type: integer
          minimum: 1
          maximum: 100
    Notification:
      type: object
      required: [id, householdId, type, title, body, subject, read, createdAt]
      properties:
        id:
          type: string
        householdId:
          type: string
        type:
          type: string
          description: Stable type. Only `pantry.low` exists today; show unknown types by title and body.
          example: pantry.low
        title:
          type: string
          example: Butter is running low
        body:
          type: string
          example: "About 19% left: 4 recipes used 0.81 cup."
        subject:
          type: object
          required: [kind, id]
          description: What to open. `pantry_item` is a pantry item ID.
          properties:
            kind:
              type: string
              example: pantry_item
            id:
              type: string
        read:
          type: boolean
          description: Whether the caller has read it.
        createdAt:
          type: string
          format: date-time
    NotificationListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: [string, "null"]
          description: Pass as `before` for the next page; null on the last page.
    NotificationUnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
    MarkNotificationsReadRequest:
      type: object
      description: "Send `ids`, or `all: true`."
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        all:
          type: boolean
    CatalogIngredient:
      type: object
      required: [id, key, name, category, categoryConfident]
      properties:
        id:
          type: string
        key:
          type: string
          example: olive oil
        name:
          type: string
          example: Olive Oil
        category:
          $ref: "#/components/schemas/GroceryCategoryName"
        categoryConfident:
          type: boolean
          description: False when no category rule matched and the category is a placeholder (`other`).
        imageUrl:
          type: string
    IngredientSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogIngredient"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: not_found
            message:
              type: string
              description: Human-readable description. Not stable; do not parse.
              example: resource not found
            requestId:
              type: string
              description: Matches the X-Request-ID response header; quote it when reporting problems.
              example: 5f0c1e9a2b7d4c3e8f6a1b2c
    GrocerySpecialty:
      type: object
      required: [id, key, name, choiceType, optionId, houseMade, suggestedOptions, text]
      properties:
        id:
          type: string
          example: sweet-soy-glaze
        key:
          type: string
        name:
          type: string
        choiceType:
          type: [string, "null"]
          enum: [as_is, house_made_batch, null]
          description: Null when the household hasn't chosen; `house_made_batch` when a pantry batch covers the week.
        optionId:
          type: [string, "null"]
        houseMade:
          type: boolean
          description: Covered by a house-made batch in the pantry ("In pantry (house-made)").
        suggestedOptions:
          type: array
          description: Options to offer when the household hasn't chosen, the default first.
          items:
            type: object
            required: [id, type, name, isDefault]
            properties:
              id:
                type: string
              type:
                type: string
                enum: [store_alternative, house_made_batch]
              name:
                type: string
              isDefault:
                type: boolean
        text:
          type: string
          example: "Specialty ingredient: choose a store alternative or a house-made batch"
    GroceryVia:
      type: object
      required: [kind, specialtyId, specialtyKey, specialtyName, optionId, optionName, strategy, yield, batches, recipes, text]
      properties:
        kind:
          type: string
          enum: [store_alternative, house_made_batch, customized]
          description: |
            `customized` marks a line a member customized: `specialtyName` is
            the recipe's original ingredient, `optionId` the choice, and
            `optionName` its label. `specialtyId` is then empty.
        specialtyId:
          type: string
        specialtyKey:
          type: string
        specialtyName:
          type: string
          example: Tex-Mex Paste
        optionId:
          type: string
        optionName:
          type: string
        strategy:
          type: string
          enum: ["", similar, closest]
          description: |
            The household strategy that picked the option, empty when a member
            chose it explicitly. When set, `text` says so ("Store alternative
            for Tex-Mex Paste in Smoky Pork Tacos (your default)").
        yield:
          description: What one batch makes; null for a store alternative.
          oneOf:
            - $ref: "#/components/schemas/GroceryAmount"
            - type: "null"
        batches:
          type: [integer, "null"]
          description: Batches the list asks for; null for a store alternative.
        recipes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        text:
          type: string
          example: for Tex-Mex Paste in Smoky Pork Tacos
    GroceryBatch:
      type: object
      required: [specialtyId, specialtyKey, specialtyName, optionId, optionName, yield, status, reason, batches, pantryItemId, remaining, needed, recipes, text]
      properties:
        specialtyId:
          type: string
        specialtyKey:
          type: string
        specialtyName:
          type: string
        optionId:
          type: string
        optionName:
          type: string
        yield:
          $ref: "#/components/schemas/GroceryAmount"
        status:
          type: string
          enum: [inPantry, make]
        reason:
          type: string
          enum: [enough, inStock, notEnough, low, out, missing]
          description: |
            `enough`: in stock and the estimate covers the week. `inStock`: in
            stock but amounts can't be compared. `notEnough`, `low`, `out`,
            `missing`: the list asks for `batches` batches' ingredients.
        batches:
          type: integer
          minimum: 0
          description: Batches to make; 0 when in the pantry.
        pantryItemId:
          type: [string, "null"]
        remaining:
          description: The pantry estimate, or null when untracked or missing.
          oneOf:
            - $ref: "#/components/schemas/GroceryAmount"
            - type: "null"
        needed:
          description: The week's total in the yield's unit, or null when a recipe gives no amount or units don't convert.
          oneOf:
            - $ref: "#/components/schemas/GroceryAmount"
            - type: "null"
        recipes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        text:
          type: string
          example: Make a batch (makes about 12 tbsp)
    SpecialtyAmount:
      type: object
      required: [quantity, quantityValue, unit, text]
      properties:
        quantity:
          type: string
          example: "12"
        quantityValue:
          type: number
          example: 12
        unit:
          type: string
          example: tbsp
        text:
          type: string
          example: 12 tbsp
    SpecialtyOption:
      type: object
      required: [id, specialtyId, source, type, name, notes, isDefault, per, ingredients, steps, yield, shelfLifeDays, basedOnOptionId, summary, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: A slug for curated options (`southwest-spice-blend.batch`), an ObjectID for household options.
        specialtyId:
          type: string
        source:
          type: string
          enum: [curated, household]
        type:
          type: string
          enum: [store_alternative, house_made_batch]
        name:
          type: string
          example: Southwest spice blend (house blend)
        notes:
          type: string
        isDefault:
          type: boolean
        per:
          description: "Store alternatives: `per` of the specialty ingredient is `ingredients`."
          oneOf:
            - $ref: "#/components/schemas/SpecialtyAmount"
            - type: "null"
        ingredients:
          type: array
          description: Per `per` for a store alternative, or for one batch.
          items:
            type: object
            required: [name, quantity, quantityValue, unit, text, category]
            properties:
              name:
                type: string
              quantity:
                type: [string, "null"]
                description: Null for "to taste".
              quantityValue:
                type: [number, "null"]
              unit:
                type: [string, "null"]
              text:
                type: string
                example: 3 tbsp Chili Powder
              category:
                type: [string, "null"]
        steps:
          type: array
          items:
            type: string
        yield:
          oneOf:
            - $ref: "#/components/schemas/SpecialtyAmount"
            - type: "null"
        shelfLifeDays:
          type: [integer, "null"]
        basedOnOptionId:
          type: [string, "null"]
        summary:
          type: string
          example: Makes about 12 tbsp and keeps 180 days.
        createdBy:
          type: [string, "null"]
        updatedBy:
          type: [string, "null"]
        createdAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: [string, "null"]
          format: date-time
    SpecialtyIngredient:
      type: object
      required: [id, key, name, aliases, category, note, ingredientIds, recipeCount, unitSizes, defaultOptionId, retired, choiceSource, choice, options, batch]
      properties:
        id:
          type: string
          example: southwest-spice-blend
        key:
          type: string
          description: The normalized name; also the batch's pantry item key.
          example: southwest spice blend
        name:
          type: string
          example: Southwest Spice Blend
        aliases:
          type: array
          items:
            type: string
        category:
          type: string
        note:
          type: string
          description: |
            A short shopping note for the app, empty for most. It flags the
            specialty ingredients whose store route needs a caveat ("bottled
            ponzu is in the Asian aisle") or that have no honest store
            equivalent.
          example: ""
        ingredientIds:
          type: array
          description: Catalog ingredients that are this specialty ingredient.
          items:
            type: string
        recipeCount:
          type: integer
          description: The household's recipes that use it.
        unitSizes:
          type: array
          description: Estimated packet sizes, so recipes that count packets convert.
          items:
            type: object
            required: [per, quantity, quantityValue, unit, text]
            properties:
              per:
                type: string
                example: count
              quantity:
                type: string
              quantityValue:
                type: number
              unit:
                type: string
              text:
                type: string
        defaultOptionId:
          type: string
        retired:
          type: boolean
        choiceSource:
          type: string
          enum: [household, strategy, none]
          description: |
            Where the current plan comes from: `household` (a member chose it,
            including `as_is`), `strategy` (the household's standing strategy
            picked it, and a member can still override it), or `none` (nothing
            applies, so `choice` is null and the ingredient stays on the list).
        choice:
          description: |
            What currently applies, whoever decided it. Null when
            `choiceSource` is `none`.
          oneOf:
            - type: object
              required: [source, optionId, type, optionName, strategy, chosenBy, chosenAt]
              properties:
                source:
                  type: string
                  enum: [household, strategy]
                optionId:
                  type: string
                type:
                  type: string
                  enum: [as_is, store_alternative, house_made_batch]
                optionName:
                  type: [string, "null"]
                strategy:
                  description: The strategy that picked it; null when a member chose it.
                  oneOf:
                    - type: string
                      enum: [similar, closest]
                    - type: "null"
                chosenBy:
                  description: Null for a strategy, which nobody chose.
                  type: [string, "null"]
                chosenAt:
                  type: [string, "null"]
                  format: date-time
            - type: "null"
        options:
          type: array
          items:
            $ref: "#/components/schemas/SpecialtyOption"
        batch:
          description: The batch item in the pantry, or null.
          oneOf:
            - type: object
              required: [pantryItemId, status, remaining, percentRemaining, expiresOn]
              properties:
                pantryItemId:
                  type: string
                status:
                  type: string
                  enum: [in_stock, low, out]
                remaining:
                  oneOf:
                    - $ref: "#/components/schemas/SpecialtyAmount"
                    - type: "null"
                percentRemaining:
                  type: [integer, "null"]
                expiresOn:
                  type: [string, "null"]
                  format: date
            - type: "null"
    SpecialtyIngredientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpecialtyIngredient"
    SpecialtyDefaultsResponse:
      type: object
      required: [items, skipped]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpecialtyIngredient"
        skipped:
          type: integer
    SetSpecialtyChoiceRequest:
      type: object
      required: [optionId]
      properties:
        optionId:
          type: string
          description: A curated option ID, a household option ID, or `as_is`.
    SetSpecialtySettingsRequest:
      type: object
      required: [strategy]
      properties:
        strategy:
          type: string
          enum: [similar, closest, ask]
    SpecialtySettings:
      type: object
      required: [strategy, updatedBy, updatedAt, options]
      properties:
        strategy:
          type: string
          enum: [similar, closest, ask]
          default: similar
          description: |
            The household's standing answer for specialty ingredients without
            an explicit choice. `similar` prefers a store alternative and falls
            back to a house-made batch; `closest` prefers a batch and falls
            back to a store alternative; `ask` applies nothing.
        updatedBy:
          type: [string, "null"]
          description: Null for a household that never set one.
        updatedAt:
          type: [string, "null"]
          format: date-time
        options:
          type: array
          description: |
            Every strategy with the words to show, in the order to offer them.
            The same three entries every time, so the app needn't hardcode the
            trade-off copy.
          items:
            type: object
            required: [value, label, description]
            properties:
              value:
                type: string
                enum: [similar, closest, ask]
              label:
                type: string
                example: Something similar
              description:
                type: string
                example: Buy something close from the store — quicker, tastes a little different
    SpecialtyOptionRequest:
      type: object
      required: [type, name, ingredients]
      properties:
        type:
          type: string
          enum: [store_alternative, house_made_batch]
        name:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 500
        per:
          type: object
          description: Required for store_alternative; not allowed for batches.
          required: [quantity, unit]
          properties:
            quantity:
              type: string
            unit:
              type: string
        ingredients:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                maxLength: 100
              quantity:
                type: string
                description: Required for store alternatives; omit for "to taste" in a batch.
              unit:
                type: string
                description: DinnerOS unit code; defaults to `count` with a quantity.
              category:
                type: string
                description: A grocery category, used when the catalog doesn't know the ingredient.
        steps:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 500
        yield:
          type: object
          description: Required for house_made_batch.
          required: [quantity, unit]
          properties:
            quantity:
              type: string
            unit:
              type: string
        shelfLifeDays:
          type: integer
          minimum: 1
          maximum: 730
          description: Required for house_made_batch.
        basedOnOptionId:
          type: string
    RecordSpecialtyBatchRequest:
      type: object
      properties:
        optionId:
          type: string
          description: A house_made_batch option; defaults to the household's choice.
        batches:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        clientPurchaseId:
          type: string
          maxLength: 64
    RecordSpecialtyBatchResponse:
      type: object
      required: [purchase, item, option]
      properties:
        purchase:
          $ref: "#/components/schemas/PantryPurchase"
        item:
          $ref: "#/components/schemas/PantryItem"
        option:
          $ref: "#/components/schemas/SpecialtyOption"
    AutopilotDay:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
      description: Day of the week. Unlike `PlanDay`, never null.
      example: sun
    AutopilotProtein:
      type: string
      enum: [chicken, beef, pork, turkey, lamb, duck, fish, shellfish, tofu, legumes, eggs]
      description: "`tofu` covers tofu, tempeh, and seitan; `legumes` covers beans and lentils."
    AutopilotDiet:
      type: string
      enum: [vegetarian, pescatarian, vegan, gluten-free, dairy-free]
    AutopilotAllergen:
      type: string
      enum: [milk, eggs, fish, shellfish, tree-nuts, peanuts, wheat, soy, sesame]
    AutopilotEquipment:
      type: string
      enum: [smoker, grill, air-fryer, slow-cooker, pressure-cooker]
      description: A cooking method or piece of equipment.
    AutopilotNovelty:
      type: string
      enum: [favorites, balanced, adventurous]
      description: Appetite for new meals. Defaults to `balanced`.
    AutopilotRuleFrequency:
      type: string
      enum: [every_week, at_most_once]
      description: "`at_most_once` discourages a second meal matching the rule in the same week."
    AutopilotTimeBand:
      type: string
      enum: [quick, medium, long]
      description: |
        Cook-time band from the profile's limits: `quick` up to
        `quickMaxMinutes`, `medium` up to `mediumMaxMinutes`, `long` beyond.
        A recipe with unknown cook time is `medium`.
    AutopilotProposalStatus:
      type: string
      enum: [proposed, accepted, rejected]
      description: Only a `proposed` proposal can be swapped, accepted, or rejected.
    AutopilotSection:
      type: string
      enum: [taste, restrictions, schedule, cookTime, novelty, equipment, weekdayRules, pairings]
    AutopilotChoices:
      type: object
      additionalProperties: false
      required: [cuisines, tags, proteins]
      properties:
        cuisines:
          type: array
          maxItems: 30
          description: Free values, stored trimmed, lowercase, in canonical form (`North America` → `north american`; see docs/autopilot.md#cuisines), deduplicated, and sorted.
          items:
            type: string
            maxLength: 40
          example: [mexican, thai]
        tags:
          type: array
          maxItems: 30
          description: Free values (food types), stored like `cuisines`.
          items:
            type: string
            maxLength: 40
          example: [one pot, tacos]
        proteins:
          type: array
          description: Deduplicated and returned in vocabulary order.
          items:
            $ref: "#/components/schemas/AutopilotProtein"
          example: [chicken, pork]
    AutopilotTaste:
      type: object
      additionalProperties: false
      description: Soft preferences. A value can't be both liked and disliked.
      required: [likes, dislikes]
      properties:
        likes:
          $ref: "#/components/schemas/AutopilotChoices"
        dislikes:
          $ref: "#/components/schemas/AutopilotChoices"
    AutopilotRestrictions:
      type: object
      additionalProperties: false
      description: |
        Hard constraints: a recipe that violates one is never suggested. A
        liked cuisine or protein can't also be excluded.
      required: [diets, allergens, excludedIngredients, excludedCuisines, excludedProteins, excludedTags, noSpicy]
      properties:
        diets:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotDiet"
        allergens:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotAllergen"
        excludedIngredients:
          type: array
          maxItems: 50
          description: Free values matched against ingredient names, stored like `cuisines`.
          items:
            type: string
            maxLength: 60
          example: [cilantro]
        excludedCuisines:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 40
        excludedProteins:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotProtein"
        excludedTags:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 40
        noSpicy:
          type: boolean
    AutopilotSchedule:
      type: object
      additionalProperties: false
      required: [planDays, weeknights, mealsPerWeek, defaultServings, weeknightMaxMinutes]
      properties:
        planDays:
          type: array
          minItems: 1
          maxItems: 7
          description: Days Autopilot plans, in week order. Defaults to `mon`–`fri`.
          items:
            $ref: "#/components/schemas/AutopilotDay"
          example: [mon, tue, wed, thu, sun]
        weeknights:
          type: array
          maxItems: 7
          description: Days the weeknight time limit applies to, in week order. Defaults to `mon`–`thu`.
          items:
            $ref: "#/components/schemas/AutopilotDay"
          example: [mon, tue, wed, thu]
        mealsPerWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Between 1 and the number of `planDays`. Defaults to 4.
          example: 4
        defaultServings:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
          description: Null uses the household's default servings (see `effective.defaultServings`).
        weeknightMaxMinutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 480
          description: Soft cook-time limit on weeknights, or null for none.
          example: 30
    AutopilotCookTime:
      type: object
      additionalProperties: false
      required: [quickMaxMinutes, mediumMaxMinutes, maxLongPerWeek, minQuickPerWeek, avoidConsecutiveLong]
      properties:
        quickMaxMinutes:
          type: integer
          minimum: 5
          maximum: 480
          description: Longest quick meal. Defaults to 20.
          example: 20
        mediumMaxMinutes:
          type: integer
          minimum: 6
          maximum: 480
          description: Longest medium meal; greater than `quickMaxMinutes`. Longer meals are long. Defaults to 35.
          example: 35
        maxLongPerWeek:
          type: integer
          minimum: 0
          maximum: 7
          description: Most long meals wanted in a week; 7 means no limit. Defaults to 2.
          example: 2
        minQuickPerWeek:
          type: integer
          minimum: 0
          maximum: 7
          description: Fewest quick meals wanted in a week. Defaults to 0.
          example: 2
        avoidConsecutiveLong:
          type: boolean
          description: Discourage long meals on back-to-back days. Defaults to true.
    AutopilotWeekdayRule:
      type: object
      additionalProperties: false
      description: |
        A soft preference for one day. Needs at least one cuisine, tag,
        protein, method, or a time band.
      required: [day, label, cuisines, tags, proteins, methods, timeBand, frequency]
      properties:
        day:
          $ref: "#/components/schemas/AutopilotDay"
        label:
          type: string
          maxLength: 40
          description: Whitespace is collapsed; an empty label becomes the day's name.
          example: Sunday smoker night
        cuisines:
          type: array
          maxItems: 10
          description: Free values, stored like profile cuisines.
          items:
            type: string
            maxLength: 40
        tags:
          type: array
          maxItems: 10
          description: Free values, stored like profile tags.
          items:
            type: string
            maxLength: 40
        proteins:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotProtein"
          example: [pork]
        methods:
          type: array
          description: Each must also be in the profile's `equipment`.
          items:
            $ref: "#/components/schemas/AutopilotEquipment"
          example: [smoker]
        timeBand:
          description: Preferred cook time (`long` means a long cook is OK), or null for no preference.
          oneOf:
            - $ref: "#/components/schemas/AutopilotTimeBand"
            - type: "null"
          example: long
        frequency:
          $ref: "#/components/schemas/AutopilotRuleFrequency"
    AutopilotChange:
      type: object
      required: [updatedBy, updatedAt]
      properties:
        updatedBy:
          type: string
          description: User ID of the member who made the change.
        updatedAt:
          type: string
          format: date-time
    AutopilotProfile:
      type: object
