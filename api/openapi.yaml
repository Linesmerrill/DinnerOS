openapi: 3.1.0
info:
  title: DinnerOS API
  version: 0.4.0
  description: |
    Backend for the DinnerOS iOS app. "DinnerOS" is a working name.

    Conventions (see docs/api.md):
    - All product routes are versioned under `/api/v1`.
    - JSON bodies use camelCase. Unknown request fields are rejected.
    - Every non-2xx response uses the `ErrorResponse` envelope.
    - Authenticated routes take `Authorization: Bearer <accessToken>`
      (see docs/authentication.md).
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: operations
  - name: auth
    description: Sign-in, token refresh, logout, and the current user.
  - name: households
    description: |
      Households, members, and roles. Routes under `/households/{householdId}`
      return 404 to non-members and 403 to members whose role lacks the
      required permission (see docs/authentication.md).
  - name: invitations
    description: Inviting people to a household by email, link, or code.
  - name: recipes
    description: A household's recipes and recipe import (docs/import-format.md).
  - name: plans
    description: |
      Week plans (ISO weeks such as `2026-W38`) and each week's grocery list.
      Concurrent edits by different members are applied atomically; none are lost.
paths:
  /health:
    get:
      summary: Liveness check
      description: Reports that the process is serving HTTP. Does not check dependencies.
      operationId: getHealth
      tags: [operations]
      responses:
        "200":
          description: The API process is up.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      summary: Readiness check
      description: Reports whether dependencies (MongoDB) are reachable. Failure details are logged, not returned.
      operationId: getReady
      tags: [operations]
      responses:
        "200":
          description: All dependencies are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /invite:
    get:
      summary: Invitation landing page
      description: |
        HTML page that invitation emails link to as `/invite#token=<token>`. The
        token stays in the URL fragment, which browsers never send. The page's
        script reads it, links to the app's custom URL scheme
        (`<APP_URL_SCHEME>://invite?token=`), explains how to install the app
        through TestFlight or enter the invite code, and calls
        `POST /api/v1/invitations/preview` to name the household. With the iOS
        app installed, iOS opens this URL in the app instead (universal link).
      operationId: getInvitePage
      tags: [invitations]
      security: []
      responses:
        "200":
          description: The landing page.
          headers:
            Content-Security-Policy:
              description: "`default-src 'none'`, with the inline script and style allowed by SHA-256 hash and `connect-src 'self'`."
              schema:
                type: string
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
            Referrer-Policy:
              description: Always `no-referrer`.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
  /.well-known/apple-app-site-association:
    get:
      summary: Apple app site association
      description: |
        Associates `/invite` with the iOS app (`<APPLE_TEAM_ID>.<APPLE_BUNDLE_ID>`)
        so invitation links open in the app. Served directly, without redirects.
        Returns `404` until `APPLE_TEAM_ID` is set.
      operationId: getAppleAppSiteAssociation
      tags: [operations]
      security: []
      responses:
        "200":
          description: The association file, in the applinks `details` and `components` format.
          content:
            application/json:
              schema:
                type: object
              example:
                applinks:
                  details:
                    - appIDs: [6VTPDG2HNK.com.linesmerrill.dinneros]
                      components:
                        - "/": /invite
                          comment: Household invitation links; the token is in the fragment
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/apple:
    post:
      summary: Sign in with Apple
      description: |
        Verifies a Sign in with Apple identity token (signature via Apple's
        JWKS, `iss`, `aud` = bundle ID, `exp`/`iat`, and `nonce` = hex SHA-256
        of the raw nonce sent here), then finds or creates the user and starts
        a new session. Rate limited per client IP.
      operationId: signInWithApple
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/auth/google:
    post:
      summary: Sign in with Google
      description: |
        Verifies a Google ID token (signature via Google's JWKS, `iss`,
        `aud` = iOS OAuth client ID, `exp`/`iat`, and `nonce` when supplied),
        then finds or creates the user and starts a new session. Returns 503
        when Google sign-in is not configured on the server.
      operationId: signInWithGoogle
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/auth/dev:
    post:
      summary: Development sign-in (development only)
      description: |
        Signs in with an **unverified** identity using provider `dev`. The route
        exists only when `APP_ENV=development` and `AUTH_DEV_LOGIN_ENABLED=true`;
        otherwise it returns 404. For simulator and integration testing.
      operationId: signInDev
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      description: |
        Exchanges a refresh token for a new access token and a new refresh
        token. The presented refresh token becomes unusable. Presenting a
        refresh token that was already rotated or revoked revokes every session
        from that sign-in and returns 401, so clients must never send two
        refreshes with the same token concurrently.
      operationId: refreshToken
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      summary: Log out
      description: |
        Revokes the sign-in the refresh token belongs to (its whole token
        family). Idempotent: unknown, expired, or already revoked tokens also
        return 204. No access token is required, so an expired session can
        still log out.
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Logged out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/me:
    get:
      summary: Current user
      description: Returns the authenticated user and their login methods.
      operationId: getMe
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/households:
    post:
      summary: Create a household
      description: Creates a household with the caller as its first admin.
      operationId: createHousehold
      tags: [households]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHouseholdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    get:
      summary: List the caller's households
      description: |
        Every household the caller belongs to, oldest membership first. Not
        paginated: a user belongs to a handful of households.
      operationId: listHouseholds
      tags: [households]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's households.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: Get a household
      description: The household, its members, and the caller's role. Requires `household.view`.
      operationId: getHousehold
      tags: [households]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update household settings
      description: Partial update; at least one field is required. Requires `household.update`.
      operationId: updateHousehold
      tags: [households]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdRequest"
      responses:
        "200":
          description: The updated household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/UserID"
    patch:
      summary: Change a member's role
      description: |
        Requires `members.changeRole`, and the caller's role must include every
        permission of both the member's current role and the new one. Setting
        the current role is a no-op. Demoting the last admin returns
        `409 last_admin`.
      operationId: changeMemberRole
      tags: [households]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleRequest"
      responses:
        "200":
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Remove a member, or leave
      description: |
        With the caller's own user ID, leaves the household (no permission
        needed). Otherwise requires `members.remove` and a role that includes
        the member's permissions. Removing the last admin, including the last
        admin leaving when they are the only member, returns `409 last_admin`.
      operationId: removeMember
      tags: [households]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/households/{householdId}/invitations:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Invite someone by email
      description: |
        Requires `members.invite` and a role that includes the invited role's
        permissions. Revokes any pending invitation for the same address, then
        emails a link and code. The code is returned only in this response so
        the admin can share it directly. If the email cannot be sent, the
        invitation is still created and `emailDelivered` is false. Rate limited
        per client IP.
      operationId: createInvitation
      tags: [invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      summary: List pending invitations
      description: Unaccepted, unrevoked, unexpired invitations, newest first. Never includes tokens or codes. Requires `members.invite`.
      operationId: listInvitations
      tags: [invitations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/InvitationID"
    delete:
      summary: Revoke an invitation
      description: |
        Requires `members.invite`. Idempotent: revoking an invitation that is
        already revoked, accepted, or expired also returns 204. An ID that
        doesn't belong to the household returns 404.
      operationId: revokeInvitation
      tags: [invitations]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/invitations/accept:
    post:
      summary: Accept an invitation
      description: |
        Joins the household with the invited role, using the token from the
        email link or the code. The signed-in user's email does not need to
        match the invited address. If the caller is already a member, the
        invitation is used up and their existing role is kept. Retrying an
        invitation the caller already accepted returns the same result.
        Rate limited per client IP.
      operationId: acceptInvitation
      tags: [invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Joined (or already a member).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/InvitationInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/invitations/preview:
    post:
      summary: Preview an invitation
      description: |
        Describes the invitation for a token or code without accepting it, so
        the invitation landing page and the app can name the household before
        anyone joins. Needs no authentication. Every invitation accept would
        reject as unusable (unknown, expired, revoked, used) returns the same
        `404 invitation_invalid`, and malformed input gets the same `400`, so
        preview reveals nothing accept doesn't. Rate limited per client IP,
        sharing accept's bucket.
      operationId: previewInvitation
      tags: [invitations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: The invitation can be accepted.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/InvitationInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/households/{householdId}/recipes:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List recipes
      description: |
        Recipe summaries for the household. Requires `household.view`.
        `sort=name` (default) is alphabetical and case-insensitive, `recent` is
        most recently ordered first with never-ordered recipes last, and
        `popular` is most often ordered first. Ties break by name. For the next
        page, send `nextCursor` as `cursor` with the same `sort` and filters.
      operationId: listRecipes
      tags: [recipes]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Text the name must contain, case-insensitive. Literal text, not a pattern.
          schema:
            type: string
            maxLength: 100
        - name: addons
          in: query
          description: "`true` for add-ons only (sides, desserts), `false` for main meals only."
          schema:
            type: boolean
        - name: tag
          in: query
          description: Tag to match, case-insensitive.
          schema:
            type: string
            maxLength: 100
        - name: cuisine
          in: query
          description: Cuisine to match, case-insensitive.
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, recent, popular]
            default: name
        - name: limit
          in: query
          description: Page size. Values above 200 are treated as 200.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/recipes/{recipeId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    get:
      summary: Get a recipe
      description: |
        The full recipe, with each ingredient's catalog category. Requires
        `household.view`. Recipes of other households return 404.
      operationId: getRecipe
      tags: [recipes]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/recipes/import:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Import recipes
      description: |
        Imports a recipe import file (docs/import-format.md, version 1) into the
        household. Requires `recipes.import`. The body may be up to
        `RECIPE_IMPORT_MAX_BYTES` (default 32 MB) instead of
        `HTTP_MAX_BODY_BYTES`.

        The import is idempotent: re-importing the same file reports every
        recipe as unchanged. A file with the wrong version or an unknown source
        is rejected with 400. Invalid recipes are listed in `errors`, and the
        rest still import.
      operationId: importRecipes
      tags: [recipes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFile"
      responses:
        "200":
          description: Import finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: a concurrent import of the same recipes won; retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/v1/households/{householdId}/plans:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List week summaries
      description: |
        One summary per ISO week from `from` to `to` inclusive, in order,
        including weeks nobody has planned (`entryCount: 0`, `updatedAt: null`).
        Requires `household.view`. The range covers at most 26 weeks.
      operationId: listPlans
      tags: [plans]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/IsoWeek"
        - name: to
          in: query
          required: true
          description: Not before `from`, and at most 25 weeks after it.
          schema:
            $ref: "#/components/schemas/IsoWeek"
      responses:
        "200":
          description: The weeks in the range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/plans/{week}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: Get a week plan
      description: |
        The household's plan for the week. Requires `household.view`. A week
        nobody has planned is an empty draft with null timestamps, not a 404.
      operationId: getPlan
      tags: [plans]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/plans/{week}/entries:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Add a recipe to a week
      description: |
        Requires `plan.edit`. Creates the plan as a draft if needed. The recipe
        must belong to the household (otherwise 400 `validation_failed`), and
        `servings` must be one of its serving sizes.
      operationId: addPlanEntry
      tags: [plans]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlanEntryRequest"
      responses:
        "201":
          description: The new entry and the plan after adding it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddPlanEntryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PlanConflict"
  /api/v1/households/{householdId}/plans/{week}/entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - $ref: "#/components/parameters/EntryID"
    patch:
      summary: Change a planned entry
      description: |
        Requires `plan.edit`. Send at least one of `day`, `servings`, `note`;
        omitted fields don't change, and `"day": null` unschedules. New
        servings must be one of the recipe's serving sizes.
      operationId: updatePlanEntry
      tags: [plans]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanEntryRequest"
      responses:
        "200":
          description: The plan after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PlanConflict"
    delete:
      summary: Remove a planned entry
      description: Requires `plan.edit`.
      operationId: deletePlanEntry
      tags: [plans]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PlanConflict"
  /api/v1/households/{householdId}/plans/{week}/status:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    put:
      summary: Finalize a week or reopen it
      description: |
        Requires `plan.edit`. Creates the plan if needed. A finalized plan's
        entries can't change until its status is set back to `draft`.
      operationId: setPlanStatus
      tags: [plans]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPlanStatusRequest"
      responses:
        "200":
          description: The plan with its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/plans/{week}/grocery:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: Get a week's grocery list
      description: |
        Aggregates the week's entries with the grocery engine, using each live
        recipe's authored amounts for the entry's serving size (never scaled).
        Requires `household.view`. Computed on every request. The household
        pantry isn't applied yet (`pantryApplied: false`), so statuses are
        `toBuy` or `pantryHint`. Amounts whose units can't be combined stay
        separate.
      operationId: getPlanGroceryList
      tags: [plans]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The grocery list, grouped by category in aisle order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        DinnerOS access token from a sign-in or refresh response. Valid for 15
        minutes. An expired token yields 401 `token_expired`; refresh and retry.
  headers:
    RequestID:
      description: |
        Request correlation ID. A well-formed incoming `X-Request-ID`
        (8–128 chars of `A-Za-z0-9._-`) is reused; otherwise one is generated.
        Every response includes it.
      schema:
        type: string
  parameters:
    HouseholdID:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80913
    UserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80912
    InvitationID:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80914
    RecipeID:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80915
    Week:
      name: week
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IsoWeek"
    EntryID:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80c01
  schemas:
    RecipeSummary:
      type: object
      required: [id, name, timesOrdered, isAddon, tags]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80915
        name:
          type: string
          example: Beef Tacos
        headline:
          type: string
        imageUrl:
          type: string
        totalMinutes:
          type: integer
        timesOrdered:
          type: integer
          description: Number of distinct weeks the household received this recipe.
        lastOrderedWeek:
          type: string
          description: ISO week of the latest delivery. Omitted when never ordered.
          example: 2026-W30
        isAddon:
          type: boolean
        tags:
          type: array
          items:
            type: string
    RecipeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
        nextCursor:
          type: string
          description: Present when another page exists.
    Recipe:
      type: object
      required: [id, householdId, source, sourceRecipeId, sourceAliases, name, isAddon, servings, cuisines, tags, utensils, allergens, nutritionPerServing, ingredients, steps, orderWeeks, timesOrdered, createdAt, updatedAt]
      properties:
        id:
          type: string
        householdId:
          type: string
        source:
          type: string
          enum: [hellofresh, manual, import, user, provider, partner]
        sourceRecipeId:
          type: string
        sourceAliases:
          type: array
          description: Other source IDs known to be this recipe.
          items:
            type: string
        sourceUrl:
          type: string
        name:
          type: string
        headline:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        isAddon:
          type: boolean
        servings:
          type: array
          description: Serving sizes with authored amounts, ascending.
          items:
            type: integer
        prepMinutes:
          type: integer
        totalMinutes:
          type: integer
        difficulty:
          type: integer
        cuisines:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        utensils:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        nutritionPerServing:
          type: array
          items:
            type: object
            required: [name, amount, unit]
            properties:
              name:
                type: string
              amount:
                type: number
              unit:
                type: string
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredient"
        steps:
          type: array
          items:
            type: object
            required: [index, text]
            properties:
              index:
                type: integer
              text:
                type: string
              imageUrl:
                type: string
        orderWeeks:
          type: array
          description: ISO weeks the household received this recipe, sorted.
          items:
            type: string
            example: 2026-W30
        timesOrdered:
          type: integer
        lastOrderedWeek:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecipeIngredient:
      type: object
      required: [ingredientId, name, category, pantryStaple, amounts]
      properties:
        ingredientId:
          type: string
          description: Catalog ingredient ID.
        name:
          type: string
          example: Parmesan Cheese
        category:
          type: string
          enum: [produce, meat-seafood, dairy-eggs, bakery, deli, pantry, spices, condiments, frozen, beverages, other]
        pantryStaple:
          type: boolean
          description: Source hint that the ingredient is usually at home.
        amounts:
          type: array
          items:
            $ref: "#/components/schemas/IngredientAmount"
    IngredientAmount:
      type: object
      required: [servings, quantity, quantityValue, unit, sourceUnit, rawText]
      properties:
        servings:
          type: integer
          example: 2
        quantity:
          type: [string, "null"]
          description: Exact amount as "n" or "n/d". Null when the source gave no amount.
          example: 1/2
        quantityValue:
          type: [number, "null"]
          description: The same amount as a number, for display only.
          example: 0.5
        unit:
          type: string
          description: DinnerOS unit code, or empty.
          example: oz
        sourceUnit:
          type: string
          example: ounce
        rawText:
          type: string
          example: ½ ounce Parmesan Cheese
    ImportFile:
      type: object
      description: The recipe import contract. Field-level rules are in docs/import-format.md.
      additionalProperties: false
      required: [version, source, recipes]
      properties:
        version:
          type: integer
          enum: [1]
        source:
          type: string
          enum: [hellofresh, manual, import, user, provider, partner]
        generatedAt:
          type: string
          format: date-time
        recipes:
          type: array
          items:
            type: object
            description: ImportRecipe (docs/import-format.md).
        review:
          type: array
          items:
            type: object
            description: ReviewItem (docs/import-format.md).
    ImportResult:
      type: object
      required: [created, updated, unchanged, ingredientsCreated, reviewItems, errors]
      properties:
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        ingredientsCreated:
          type: integer
          description: New ingredient catalog entries.
        reviewItems:
          type: integer
          description: Distinct review items in the file. Items already recorded are not duplicated.
        errors:
          type: array
          description: Rejected recipes, in file order.
          items:
            type: object
            required: [index, problems]
            properties:
              index:
                type: integer
                description: Position in the file's `recipes` array.
              sourceRecipeId:
                type: string
              name:
                type: string
              problems:
                type: array
                items:
                  type: string
                example: ['ingredients[3] (Mystery Paste): unit "dollop" is not a DinnerOS unit code']
    Role:
      type: string
      enum: [admin, member]
      description: |
        A member's role. More roles (viewer, shopper, child, guest) may be
        added later; clients should rely on `permissions`, not the role name.
    Permission:
      type: string
      enum:
        - household.view
        - household.update
        - members.view
        - members.invite
        - members.remove
        - members.changeRole
        - plan.edit
        - pantry.edit
        - recipes.edit
        - recipes.import
    Household:
      type: object
      required: [id, name, defaultServings, timeZone, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80913
        name:
          type: string
          maxLength: 100
          example: The Lines
        defaultServings:
          type: integer
          minimum: 1
          maximum: 12
          example: 2
        timeZone:
          type: string
          description: IANA time zone name. Plan dates are interpreted in it.
          example: America/Denver
        createdBy:
          type: string
          description: User ID of the member who created the household.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Membership:
      type: object
      required: [id, householdId, userId, role, permissions, createdAt, updatedAt]
      properties:
        id:
          type: string
        householdId:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Member:
      type: object
      required: [userId, displayName, role, joinedAt]
      properties:
        userId:
          type: string
        displayName:
          type: string
          description: May be empty when the user has no display name.
          example: Ada Lovelace
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
    CreateHouseholdRequest:
      type: object
      additionalProperties: false
      required: [name, timeZone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Leading and trailing whitespace is trimmed.
          example: The Lines
        timeZone:
          type: string
          description: IANA time zone name (not an offset, not "Local").
          example: America/Denver
        defaultServings:
          type: integer
          minimum: 1
          maximum: 12
          default: 2
    UpdateHouseholdRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        timeZone:
          type: string
          example: Europe/Paris
        defaultServings:
          type: integer
          minimum: 1
          maximum: 12
    CreateHouseholdResponse:
      type: object
      required: [household, membership]
      properties:
        household:
          $ref: "#/components/schemas/Household"
        membership:
          $ref: "#/components/schemas/Membership"
    HouseholdListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [household, role, permissions]
            properties:
              household:
                $ref: "#/components/schemas/Household"
              role:
                $ref: "#/components/schemas/Role"
              permissions:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
    HouseholdDetailResponse:
      type: object
      required: [household, role, permissions]
      properties:
        household:
          $ref: "#/components/schemas/Household"
        members:
          type: array
          description: Oldest member first. Omitted when the caller's role lacks `members.view`.
          items:
            $ref: "#/components/schemas/Member"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          description: What the caller may do in this household.
          items:
            $ref: "#/components/schemas/Permission"
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    Invitation:
      type: object
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          description: Trimmed and lowercased.
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time
          description: Seven days after creation.
        createdAt:
          type: string
          format: date-time
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: A bare address (no display name).
          example: bob@example.com
        role:
          $ref: "#/components/schemas/Role"
    CreateInvitationResponse:
      type: object
      required: [invitation, code, emailDelivered]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        code:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$"
          description: |
            Invite code to share directly. Returned only in this response; it
            can't be retrieved later. The email contains the same code.
          example: 7K3QM-X9D2P
        emailDelivered:
          type: boolean
          description: False when the email could not be sent. The invitation and code still work.
    InvitationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `token` or `code`.
      properties:
        token:
          type: string
          maxLength: 256
          description: The token from the invitation link.
        code:
          type: string
          maxLength: 64
          description: The invite code. Case-insensitive; spaces and dashes are ignored.
          example: 7k3qm x9d2p
      oneOf:
        - required: [token]
        - required: [code]
    InvitationPreviewResponse:
      type: object
      required: [householdName, inviterName, role, expiresAt]
      properties:
        householdName:
          type: string
          example: The Lines
        inviterName:
          type: string
          description: The inviter's display name. Empty when they have none.
          example: Merrill Lines
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time
    AcceptInvitationResponse:
      type: object
      required: [household, role, permissions]
      properties:
        household:
          $ref: "#/components/schemas/Household"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          example:
            mongodb: ok
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          description: Configured application name (APP_NAME).
          example: DinnerOS
        version:
          type: string
          description: Deployed build identifier.
          example: 3f2c1ab

    AppleSignInRequest:
      type: object
      additionalProperties: false
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
          description: The `identityToken` from `ASAuthorizationAppleIDCredential`, as a UTF-8 string.
        nonce:
          type: string
          maxLength: 512
          description: The raw nonce the app generated. Apple's request must use its SHA-256 hex digest.
        fullName:
          type: string
          maxLength: 100
          description: |
            Display name formatted by the app. Apple provides it only on the
            first authorization; it is used only when a new user is created.
    GoogleSignInRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          description: The Google Sign-In ID token.
        nonce:
          type: string
          maxLength: 512
          description: Optional raw nonce passed to Google Sign-In. When present, the token's `nonce` claim must equal it.
    DevSignInRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          maxLength: 256
          description: Stable test identity; the same subject always signs in to the same user.
          example: simulator-ada
        email:
          type: string
          format: email
          example: ada@example.com
        displayName:
          type: string
          maxLength: 100
          example: Ada
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
          description: JWT bearer token for authenticated routes.
        accessTokenExpiresAt:
          type: string
          format: date-time
          example: "2026-09-14T18:45:00Z"
        refreshToken:
          type: string
          description: Opaque single-use token (43 base64url characters). Store in the Keychain.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Sliding expiry; each refresh extends it to 60 days from the refresh.
          example: "2026-11-13T18:30:00Z"
    SessionResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user, isNewUser]
          properties:
            user:
              $ref: "#/components/schemas/User"
            isNewUser:
              type: boolean
              description: True when this sign-in created the account.
    User:
      type: object
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80912
        displayName:
          type: string
          description: May be empty when no provider supplied a name.
          example: Ada Lovelace
        primaryEmail:
          type: string
          format: email
          description: Present only when a provider verified it. May be an Apple private relay address.
        createdAt:
          type: string
          format: date-time
    Identity:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [apple, google, dev]
        email:
          type: string
          format: email
          description: Verified email from this provider, if any.
    MeResponse:
      type: object
      required: [user, identities]
      properties:
        user:
          $ref: "#/components/schemas/User"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
    IsoWeek:
      type: string
      pattern: "^[0-9]{4}-W[0-9]{2}$"
      description: ISO 8601 week, Monday to Sunday. The week must exist in its year (52 or 53 weeks).
      example: 2026-W38
    PlanDay:
      type: [string, "null"]
      enum: [mon, tue, wed, thu, fri, sat, sun, null]
      description: Day of the week, or null for "this week, not scheduled".
    PlanStatus:
      type: string
      enum: [draft, finalized]
      description: A finalized plan's entries are locked until it is set back to draft.
    Plan:
      type: object
      required: [householdId, week, startDate, endDate, status, entries, createdAt, updatedAt]
      properties:
        householdId:
          type: string
        week:
          $ref: "#/components/schemas/IsoWeek"
        startDate:
          type: string
          format: date
          description: The week's Monday.
          example: "2026-09-14"
        endDate:
          type: string
          format: date
          description: The week's Sunday.
          example: "2026-09-20"
        status:
          $ref: "#/components/schemas/PlanStatus"
        entries:
          type: array
          description: In the order they were added.
          items:
            $ref: "#/components/schemas/PlanEntry"
        createdAt:
          type: [string, "null"]
          format: date-time
          description: Null for a week nobody has planned.
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: Null for a week nobody has planned.
    PlanEntry:
      type: object
      required: [id, recipe, day, date, servings, note, addedBy, addedAt]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80c01
        recipe:
          type: object
          description: Snapshot taken when the entry was added. Load the recipe for details.
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
              example: Beef Tacos
            imageUrl:
              type: string
        day:
          $ref: "#/components/schemas/PlanDay"
        date:
          type: [string, "null"]
          format: date
          description: The date of `day`, or null when unscheduled.
          example: "2026-09-15"
        servings:
          type: integer
          minimum: 1
          example: 2
        note:
          type: string
          maxLength: 500
        addedBy:
          type: string
          description: User ID of the member who added the entry.
        addedAt:
          type: string
          format: date-time
    AddPlanEntryRequest:
      type: object
      required: [recipeId, servings]
      additionalProperties: false
      properties:
        recipeId:
          type: string
          description: A recipe in this household.
        day:
          $ref: "#/components/schemas/PlanDay"
        servings:
          type: integer
          description: One of the recipe's `servings`.
          example: 2
        note:
          type: string
          maxLength: 500
    AddPlanEntryResponse:
      type: object
      required: [entry, plan]
      properties:
        entry:
          $ref: "#/components/schemas/PlanEntry"
        plan:
          $ref: "#/components/schemas/Plan"
    UpdatePlanEntryRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        day:
          $ref: "#/components/schemas/PlanDay"
        servings:
          type: integer
          description: One of the recipe's `servings`.
        note:
          type: string
          maxLength: 500
    SetPlanStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/PlanStatus"
    PlanSummary:
      type: object
      required: [week, startDate, status, entryCount, updatedAt]
      properties:
        week:
          $ref: "#/components/schemas/IsoWeek"
        startDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/PlanStatus"
        entryCount:
          type: integer
          minimum: 0
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: Null for a week nobody has planned.
    PlanListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanSummary"
    GroceryList:
      type: object
      required: [week, status, pantryApplied, categories, skipped]
      properties:
        week:
          $ref: "#/components/schemas/IsoWeek"
        status:
          $ref: "#/components/schemas/PlanStatus"
        pantryApplied:
          type: boolean
          description: False until the household pantry exists (Phase 7).
        categories:
          type: array
          description: In aisle order; empty categories are omitted.
          items:
            $ref: "#/components/schemas/GroceryCategory"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SkippedPlanEntry"
    GroceryCategory:
      type: object
      required: [category, items]
      properties:
        category:
          type: string
          enum: [produce, meat-seafood, dairy-eggs, bakery, deli, pantry, spices, condiments, frozen, beverages, other]
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroceryItem"
    GroceryItem:
      type: object
      required: [ingredientKey, name, amounts, quantityText, unquantified, status, recipes]
      properties:
        ingredientKey:
          type: string
          description: The catalog ingredient ID, or `name:<normalized name>` for uncatalogued lines.
        name:
          type: string
          example: Yellow Onion
        amounts:
          type: array
          description: One amount per group of units that combine. A count and a weight stay separate.
          items:
            $ref: "#/components/schemas/GroceryAmount"
        quantityText:
          type: string
          description: The amounts' texts joined with " + ". Empty when no recipe gave an amount.
          example: 1 ½ + 8 oz
        unquantified:
          type: boolean
          description: At least one recipe gave no amount ("salt to taste").
        status:
          type: string
          enum: [toBuy, inPantry, pantryHint]
          description: "`pantryHint`: every recipe marks it as a staple. `inPantry` needs the pantry (Phase 7)."
        recipes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
    GroceryAmount:
      type: object
      required: [quantity, quantityValue, unit, text]
      properties:
        quantity:
          type: string
          description: Exact amount as "n" or "n/d".
          example: "3/2"
        quantityValue:
          type: number
          description: The same amount as a number, for display only.
          example: 1.5
        unit:
          type: string
          description: DinnerOS unit code.
          example: count
        text:
          type: string
          example: 1 ½
    SkippedPlanEntry:
      type: object
      required: [entryId, recipeId, recipeName, reason]
      properties:
        entryId:
          type: string
        recipeId:
          type: string
        recipeName:
          type: string
        reason:
          type: string
          enum: [recipeUnavailable, servingsUnavailable]
          description: |
            `recipeUnavailable`: the recipe is no longer in the household.
            `servingsUnavailable`: the recipe no longer offers the entry's serving size.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: not_found
            message:
              type: string
              description: Human-readable description. Not stable; do not parse.
              example: resource not found
            requestId:
              type: string
              description: Matches the X-Request-ID response header; quote it when reporting problems.
              example: 5f0c1e9a2b7d4c3e8f6a1b2c
  responses:
    Forbidden:
      description: "`forbidden`: the caller is a member of the household, but their role doesn't allow this action."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        `last_admin`: the change would leave the household without an admin.
        `conflict`: the membership changed concurrently; reload and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PlanConflict:
      description: |
        `plan_finalized`: the plan is finalized; set its status to `draft` first.
        `plan_full`: the week already has 50 entries.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvitationInvalid:
      description: |
        `invitation_invalid`: the token or code is unknown, expired, revoked,
        or already used. The reasons are deliberately not distinguished.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: |
        `invalid_request` (malformed JSON, unknown field, wrong type, empty body)
        or `validation_failed` (missing or invalid field).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: |
        `unauthenticated` (missing, invalid, rotated, or revoked token) or
        `token_expired` (access token expired; refresh and retry).
      headers:
        WWW-Authenticate:
          description: Sent by authenticated routes.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: "`payload_too_large`: the body exceeds HTTP_MAX_BODY_BYTES (RECIPE_IMPORT_MAX_BYTES for recipe imports)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: "`rate_limited`: too many requests from this client IP (sign-in and invitation endpoints)."
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderUnavailable:
      description: |
        `provider_unavailable`: the sign-in method is not configured, or the
        provider's signing keys could not be fetched. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
