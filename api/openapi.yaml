                - type: "null"
            schedule:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            cookTime:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            novelty:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            equipment:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            weekdayRules:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            pairings:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
        effective:
          type: object
          description: Values resolved from the household.
          required: [defaultServings]
          properties:
            defaultServings:
              type: integer
              description: "`schedule.defaultServings`, or the household's default servings when that is null."
              example: 4
        createdBy:
          type: [string, "null"]
          description: Null until the profile is saved.
        createdAt:
          type: [string, "null"]
          format: date-time
          description: Null until the profile is saved.
        updatedBy:
          type: [string, "null"]
          description: Null until the profile is saved.
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: Null until the profile is saved.
