openapi: 3.1.0
info:
  title: DinnerOS API
  version: 0.11.0
  description: |
    Backend for the DinnerOS iOS app. "DinnerOS" is a working name.

    Conventions (see docs/api.md):
    - All product routes are versioned under `/api/v1`.
    - JSON bodies use camelCase. Unknown request fields are rejected.
    - Every non-2xx response uses the `ErrorResponse` envelope.
    - Authenticated routes take `Authorization: Bearer <accessToken>`
      (see docs/authentication.md).
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: operations
  - name: auth
    description: Sign-in, token refresh, logout, and the current user.
  - name: households
    description: |
      Households, members, and roles. Routes under `/households/{householdId}`
      return 404 to non-members and 403 to members whose role lacks the
      required permission (see docs/authentication.md).
  - name: invitations
    description: Inviting people to a household by email, link, or code.
  - name: recipes
    description: A household's recipes and recipe import (docs/import-format.md).
  - name: plans
    description: |
      Week plans (ISO weeks such as `2026-W38`) and each week's grocery list.
      Concurrent edits by different members are applied atomically; none are lost.
  - name: pantry
    description: |
      A household's pantry: one item per ingredient, with a status that
      decides grocery list statuses (docs/grocery-engine.md#pantry). Items
      with a recorded amount estimate what's left from purchases, cooked
      recipes, and learned use, and are marked low at a threshold
      (docs/pantry-usage.md).
  - name: specialty-ingredients
    description: |
      Meal-kit blends, sauces, pastes, and concentrates that recipes name but
      grocery stores don't sell under that name. Curated store alternatives
      and house-made batches, household options and choices, and batches
      recorded in the pantry (docs/specialty-ingredients.md).
  - name: notifications
    description: |
      Household notifications (such as a pantry item running low). Every
      member sees the same notifications and reads them separately. Devices
      register push tokens under `/me/device-tokens`, and an hourly sweep
      pushes new notifications to them (docs/pantry-usage.md#push-delivery).
  - name: ingredients
    description: The global ingredient catalog.
  - name: ratings
    description: |
      Household members' ratings of recipes. Ratings are personal, so
      `household.view` is enough to rate, change, or remove your own.
  - name: events
    description: Client-observed household behavior, used for recommendations (docs/autopilot.md).
  - name: autopilot
    description: |
      A household's taste profile, weekday rules, equipment, per-week
      context, and Autopilot week proposals (generate, swap, accept, reject).
  - name: menu
    description: |
      The Menu screen: one week's plan and curated sections, the All Meals
      list with its filter chips, and the week strip (docs/api.md#menu).
      Reading needs `household.view`; changes need `plan.edit`. Proposals are
      separate from plans: accepting one adds its meals to the week's draft
      plan as entries with origin `autopilot` (docs/autopilot.md).
  - name: shopping
    description: |
      Handing the week's grocery list to a shopping provider (Phase 8a:
      Walmart add-to-cart links, no Walmart credentials): store settings,
      the product saved per ingredient from a pasted product link, matches
      with package counts, stored handoffs, and confirming what was ordered
      into the pantry (docs/shopping-providers.md). The API never fetches
      provider pages.
paths:
  /health:
    get:
      summary: Liveness check
      description: Reports that the process is serving HTTP. Does not check dependencies.
      operationId: getHealth
      tags: [operations]
      responses:
        "200":
          description: The API process is up.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      summary: Readiness check
      description: Reports whether dependencies (MongoDB) are reachable. Failure details are logged, not returned.
      operationId: getReady
      tags: [operations]
      responses:
        "200":
          description: All dependencies are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /:
    get:
      summary: Home page
      description: |
        Static HTML: the app name, a one-line description, a link to `/privacy`,
        and the contact email. Google's OAuth consent screen lists it as the app
        home page. Matches `/` exactly.
      operationId: getHomePage
      tags: [operations]
      security: []
      responses:
        "200":
          description: The home page. No script; `default-src 'none'` with the inline style allowed by hash.
          content:
            text/html:
              schema:
                type: string
  /privacy:
    get:
      summary: Privacy policy
      description: |
        Static HTML privacy policy: what is collected, where it is stored and who
        processes it, and how to delete it. Linked from the app, TestFlight, and
        Google's OAuth consent screen.
      operationId: getPrivacyPolicy
      tags: [operations]
      security: []
      responses:
        "200":
          description: The privacy policy. No script; `default-src 'none'` with the inline style allowed by hash.
          content:
            text/html:
              schema:
                type: string
  /invite:
    get:
      summary: Invitation landing page
      description: |
        HTML page that invitation emails link to as `/invite#token=<token>`. The
        token stays in the URL fragment, which browsers never send. The page's
        script reads it, links to the app's custom URL scheme
        (`<APP_URL_SCHEME>://invite?token=`), explains how to install the app
        through TestFlight or enter the invite code, and calls
        `POST /api/v1/invitations/preview` to name the household. With the iOS
        app installed, iOS opens this URL in the app instead (universal link).
      operationId: getInvitePage
      tags: [invitations]
      security: []
      responses:
        "200":
          description: The landing page.
          headers:
            Content-Security-Policy:
              description: "`default-src 'none'`, with the inline script and style allowed by SHA-256 hash and `connect-src 'self'`."
              schema:
                type: string
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
            Referrer-Policy:
              description: Always `no-referrer`.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
  /.well-known/apple-app-site-association:
    get:
      summary: Apple app site association
      description: |
        Associates `/invite` with the iOS app (`<APPLE_TEAM_ID>.<APPLE_BUNDLE_ID>`)
        so invitation links open in the app. Served directly, without redirects.
        Returns `404` until `APPLE_TEAM_ID` is set.
      operationId: getAppleAppSiteAssociation
      tags: [operations]
      security: []
      responses:
        "200":
          description: The association file, in the applinks `details` and `components` format.
          content:
            application/json:
              schema:
                type: object
              example:
                applinks:
                  details:
                    - appIDs: [6VTPDG2HNK.com.linesmerrill.dinneros]
                      components:
                        - "/": /invite
                          comment: Household invitation links; the token is in the fragment
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/apple:
    post:
      summary: Sign in with Apple
      description: |
        Verifies a Sign in with Apple identity token (signature via Apple's
        JWKS, `iss`, `aud` = bundle ID, `exp`/`iat`, and `nonce` = hex SHA-256
        of the raw nonce sent here), then finds or creates the user and starts
        a new session. Rate limited per client IP.
      operationId: signInWithApple
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/auth/google:
    post:
      summary: Sign in with Google
      description: |
        Verifies a Google ID token (signature via Google's JWKS, `iss`,
        `aud` = iOS OAuth client ID, `exp`/`iat`, and `nonce` when supplied),
        then finds or creates the user and starts a new session. Returns 503
        when Google sign-in is not configured on the server.
      operationId: signInWithGoogle
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/auth/dev:
    post:
      summary: Development sign-in (development only)
      description: |
        Signs in with an **unverified** identity using provider `dev`. The route
        exists only when `APP_ENV=development` and `AUTH_DEV_LOGIN_ENABLED=true`;
        otherwise it returns 404. For simulator and integration testing.
      operationId: signInDev
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      description: |
        Exchanges a refresh token for a new access token and a new refresh
        token. The presented refresh token becomes unusable. Presenting a
        refresh token that was already rotated or revoked revokes every session
        from that sign-in and returns 401, so clients must never send two
        refreshes with the same token concurrently.
      operationId: refreshToken
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      summary: Log out
      description: |
        Revokes the sign-in the refresh token belongs to (its whole token
        family). Idempotent: unknown, expired, or already revoked tokens also
        return 204. No access token is required, so an expired session can
        still log out.
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Logged out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/me:
    get:
      summary: Current user
      description: Returns the authenticated user and their login methods.
      operationId: getMe
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      summary: Delete account
      description: |
        Permanently deletes the caller's account (App Review guideline 5.1.1(v)).
        A household the caller is the last member of is deleted with all of its
        data. A household others share is left and keeps its data; if the caller
        is its only admin, the longest-standing other member becomes admin. The
        caller's ratings, sessions, device tokens, sign-in identities, and user
        record are deleted, and their ID is removed from events, cook usage, and
        notification read receipts in shared households. Every step is
        idempotent, so a `500` can be retried. See docs/api.md#delete-account.
      operationId: deleteMe
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The account is deleted. Existing access tokens can no longer refresh.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          description: "`internal`: a store failed part-way. Retrying is safe."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/device-tokens:
    put:
      summary: Register a push device token
      description: |
        Registers the caller's APNs device token so household notifications
        can be pushed to the device (docs/api.md#push-device-tokens).
        Idempotent and keyed by token: registering again updates the
        environment and `updatedAt`, and a token registered by another user
        moves to the caller. The token is in the body so it stays out of
        request logs.
      operationId: registerDeviceToken
      tags: [notifications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceTokenRequest"
      responses:
        "200":
          description: The registered token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      summary: Delete a push device token
      description: |
        Removes the token if it belongs to the caller, for sign-out. A token
        that isn't registered to the caller is not an error.
      operationId: deleteDeviceToken
      tags: [notifications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteDeviceTokenRequest"
      responses:
        "204":
          description: The token is no longer registered to the caller.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/households:
    post:
      summary: Create a household
      description: Creates a household with the caller as its first admin.
      operationId: createHousehold
      tags: [households]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHouseholdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    get:
      summary: List the caller's households
      description: |
        Every household the caller belongs to, oldest membership first. Not
        paginated: a user belongs to a handful of households.
      operationId: listHouseholds
      tags: [households]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's households.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: Get a household
      description: The household, its members, and the caller's role. Requires `household.view`.
      operationId: getHousehold
      tags: [households]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update household settings
      description: |
        Partial update of `name`, `timeZone`, `defaultServings`, `orderDay`,
        `thawReminderHour`, `weekStartsOn`, and `mealKit`; at least one field
        is required. Requires `household.update`.
      operationId: updateHousehold
      tags: [households]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdRequest"
      responses:
        "200":
          description: The updated household.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/UserID"
    patch:
      summary: Change a member's role
      description: |
        Requires `members.changeRole`, and the caller's role must include every
        permission of both the member's current role and the new one. Setting
        the current role is a no-op. Demoting the last admin returns
        `409 last_admin`.
      operationId: changeMemberRole
      tags: [households]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleRequest"
      responses:
        "200":
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Remove a member, or leave
      description: |
        With the caller's own user ID, leaves the household (no permission
        needed). Otherwise requires `members.remove` and a role that includes
        the member's permissions. Removing the last admin, including the last
        admin leaving when they are the only member, returns `409 last_admin`.
      operationId: removeMember
      tags: [households]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/households/{householdId}/invitations:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Invite someone by email
      description: |
        Requires `members.invite` and a role that includes the invited role's
        permissions. Revokes any pending invitation for the same address, then
        emails a link and code. The code is returned only in this response so
        the admin can share it directly. If the email cannot be sent, the
        invitation is still created and `emailDelivered` is false. Rate limited
        per client IP.
      operationId: createInvitation
      tags: [invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      summary: List pending invitations
      description: Unaccepted, unrevoked, unexpired invitations, newest first. Never includes tokens or codes. Requires `members.invite`.
      operationId: listInvitations
      tags: [invitations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/InvitationID"
    delete:
      summary: Revoke an invitation
      description: |
        Requires `members.invite`. Idempotent: revoking an invitation that is
        already revoked, accepted, or expired also returns 204. An ID that
        doesn't belong to the household returns 404.
      operationId: revokeInvitation
      tags: [invitations]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/invitations/accept:
    post:
      summary: Accept an invitation
      description: |
        Joins the household with the invited role, using the token from the
        email link or the code. The signed-in user's email does not need to
        match the invited address. If the caller is already a member, the
        invitation is used up and their existing role is kept. Retrying an
        invitation the caller already accepted returns the same result.
        Rate limited per client IP.
      operationId: acceptInvitation
      tags: [invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Joined (or already a member).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/InvitationInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/invitations/preview:
    post:
      summary: Preview an invitation
      description: |
        Describes the invitation for a token or code without accepting it, so
        the invitation landing page and the app can name the household before
        anyone joins. Needs no authentication. Every invitation accept would
        reject as unusable (unknown, expired, revoked, used) returns the same
        `404 invitation_invalid`, and malformed input gets the same `400`, so
        preview reveals nothing accept doesn't. Rate limited per client IP,
        sharing accept's bucket.
      operationId: previewInvitation
      tags: [invitations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: The invitation can be accepted.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/InvitationInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/households/{householdId}/recipes:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List recipes
      description: |
        Recipe summaries for the household. Requires `household.view`.
        `sort=name` (default) is alphabetical and case-insensitive, `recent` is
        most recently ordered first with never-ordered recipes last, and
        `popular` is most often ordered first. Ties break by name. For the next
        page, send `nextCursor` as `cursor` with the same `sort` and filters.
      operationId: listRecipes
      tags: [recipes]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Text the name must contain, case-insensitive. Literal text, not a pattern.
          schema:
            type: string
            maxLength: 100
        - name: addons
          in: query
          description: "`true` for add-ons only (sides, desserts), `false` for main meals only."
          schema:
            type: boolean
        - name: tag
          in: query
          description: Tag to match, case-insensitive.
          schema:
            type: string
            maxLength: 100
        - name: cuisine
          in: query
          description: Cuisine to match, case-insensitive.
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, recent, popular]
            default: name
        - name: limit
          in: query
          description: Page size. Values above 200 are treated as 200.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/recipes/{recipeId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    get:
      summary: Get a recipe
      description: |
        The full recipe, with each ingredient's catalog category. Requires
        `household.view`. Recipes of other households return 404.
      operationId: getRecipe
      tags: [recipes]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/recipes/{recipeId}/instructions:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    get:
      summary: Get cooking instructions
      description: |
        The recipe's steps rendered for one serving size, the way a member
        reads them while cooking. Requires `household.view`.

        Every ingredient the recipe lists is marked where a step names it, as
        an `ingredient` segment carrying the amount for `servings`, and a
        specialty ingredient reads as whatever the household chose to buy or
        make (docs/specialty-ingredients.md). Nothing is stored: a changed
        choice shows on the next read.

        Joining every segment's `text` in order gives the step's `text`
        exactly, so a client needs no character offsets.
      operationId: getRecipeInstructions
      tags: [recipes]
      security:
        - bearerAuth: []
      parameters:
        - name: servings
          in: query
          description: |
            One of the recipe's `servings`. Amounts are never scaled from
            another serving size, so any other value is a 400. Defaults to the
            recipe's smallest size.
          schema:
            type: integer
            minimum: 1
            example: 4
      responses:
        "200":
          description: The rendered instructions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeInstructions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/recipes/import-reviews:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List import review items
      description: |
        Things an importer could not map confidently, oldest first. Requires
        `recipes.import`, because they are import bookkeeping.

        A `variant` item means the delivered menu variant differed from the
        canonical recipe page the details came from, so the stored ingredients
        may name a different protein than the box held. `value` is the
        delivered variant's name. Resolving one needs an account capture of
        that delivered ID and a re-import; nothing closes an item
        automatically.
      operationId: listImportReviews
      tags: [recipes]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: "`open` (default) for unresolved items, `all` for every status."
          schema:
            type: string
            enum: [open, all]
            default: open
        - name: limit
          in: query
          description: Page size. Values above 500 are treated as 500.
          schema:
            type: integer
            minimum: 1
            default: 200
      responses:
        "200":
          description: The household's review items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReviewListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/households/{householdId}/recipes/import:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Import recipes
      description: |
        Imports a recipe import file (docs/import-format.md, version 1) into the
        household. Requires `recipes.import`. The body may be up to
        `RECIPE_IMPORT_MAX_BYTES` (default 32 MB) instead of
        `HTTP_MAX_BODY_BYTES`.

        The import is idempotent: re-importing the same file reports every
        recipe as unchanged. A file with the wrong version or an unknown source
        is rejected with 400. Invalid recipes are listed in `errors`, and the
        rest still import.
      operationId: importRecipes
      tags: [recipes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFile"
      responses:
        "200":
          description: Import finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: a concurrent import of the same recipes won; retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/v1/households/{householdId}/menu:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      tags: [menu]
      summary: One week's menu
      operationId: getMenu
      description: |
        The week's plan, its Autopilot proposal, and the curated sections
        (docs/api.md#menu). Sections come in display order, an empty one is
        left out, and each holds at most 12 cards. Add-ons appear only in
        `sides` and the history sections. Nothing is stored: every request
        reads the catalog once and builds the response in memory.
      parameters:
        - name: week
          in: query
          description: ISO week. Defaults to the household's current week.
          schema:
            type: string
            example: 2026-W38
      responses:
        "200":
          description: The week's menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/menu/recipes:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      tags: [menu]
      summary: The All Meals list
      operationId: listMenuRecipes
      description: |
        The household's recipes as menu cards, with search, filters, sorting,
        and cursor paging. `recommended` orders by a deterministic score built
        from favorite and taste signals; a cursor is the last item's position
        in the sort, so pages stay in order for the same inputs.
      parameters:
        - name: q
          in: query
          description: Text the name or headline contains, case-insensitive.
          schema:
            type: string
            maxLength: 100
        - name: protein
          in: query
          description: An Autopilot protein value, from the filters endpoint.
          schema:
            type: string
            example: chicken
        - name: cuisine
          in: query
          description: A canonical cuisine; a region also matches its cuisines.
          schema:
            type: string
            example: asian
        - name: tag
          in: query
          description: A canonical tag.
          schema:
            type: string
        - name: maxMinutes
          in: query
          description: Keeps meals with a known cook time at most this long.
          schema:
            type: integer
            minimum: 1
            example: 30
        - name: addons
          in: query
          description: List add-ons instead of main meals.
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum: [recommended, popular, recent, quick, name]
            default: recommended
        - name: week
          in: query
          description: The week `inPlan` and `planEntryIds` refer to.
          schema:
            type: string
            example: 2026-W38
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: The previous page's `nextCursor`. Send it with the same sort.
          schema:
            type: string
      responses:
        "200":
          description: A page of cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuRecipesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/menu/filters:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      tags: [menu]
      summary: Filter chips for the All Meals list
      operationId: getMenuFilters
      description: |
        Chip options with counts over the household's main meals, from the
        same Autopilot vocabulary the preference screens use, so a chip's
        count is how many recipes the matching filter returns. Options the
        catalog doesn't use are left out.
      responses:
        "200":
          description: The chips.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuFiltersResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/weeks:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      tags: [menu]
      summary: The week strip
      operationId: listMenuWeeks
      description: |
        Past, current, and upcoming weeks with what the household planned,
        cooked, and ordered in each, oldest first.
      parameters:
        - name: around
          in: query
          description: The week the range centers on. Defaults to the current week.
          schema:
            type: string
            example: 2026-W38
        - name: before
          in: query
          description: Weeks before `around`, clamped to 52.
          schema:
            type: integer
            default: 8
        - name: after
          in: query
          description: Weeks after `around`, clamped to 52.
          schema:
            type: integer
            default: 4
      responses:
        "200":
          description: The strip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeksResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/plans:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List week summaries
      description: |
        One summary per ISO week from `from` to `to` inclusive, in order,
        including weeks nobody has planned (`entryCount: 0`, `updatedAt: null`).
        Requires `household.view`. The range covers at most 26 weeks.
      operationId: listPlans
      tags: [plans]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/IsoWeek"
        - name: to
          in: query
          required: true
          description: Not before `from`, and at most 25 weeks after it.
          schema:
            $ref: "#/components/schemas/IsoWeek"
      responses:
        "200":
          description: The weeks in the range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/plans/{week}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: Get a week plan
      description: |
        The household's plan for the week. Requires `household.view`. A week
        nobody has planned is an empty draft with null timestamps, not a 404.
      operationId: getPlan
      tags: [plans]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/plans/{week}/entries:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Add a recipe to a week
      description: |
        Requires `plan.edit`. Creates the plan as a draft if needed. The recipe
        must belong to the household (otherwise 400 `validation_failed`), and
        `servings` must be one of its serving sizes.
      operationId: addPlanEntry
      tags: [plans]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlanEntryRequest"
      responses:
        "201":
          description: The new entry and the plan after adding it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddPlanEntryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PlanConflict"
  /api/v1/households/{householdId}/recipes/{recipeId}/customizations:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
      - name: servings
        in: query
        description: |
          One of the recipe's serving sizes. Defaults to the entry's servings
          when `entryId` is given, otherwise the recipe's smallest size.
        schema:
          type: integer
          minimum: 1
      - name: entryId
        in: query
        description: A plan entry of this recipe; send `week` with it.
        schema:
          type: string
      - name: week
        in: query
        description: The entry's ISO week.
        schema:
          type: string
          example: 2026-W38
    get:
      summary: List a meal's protein customizations
      description: |
        The ways this meal's protein can be changed: doubled, or swapped for
        another protein. Requires `household.view`.

        Only protein lines of a curated table, with an exact weight for the
        serving size, get a group; a recipe with none returns an empty list.
        Choices the household's Autopilot restrictions rule out (an excluded
        protein or ingredient, an allergen, or a diet) are dropped, except the
        original and the choice the entry already has.
      operationId: listMealCustomizations
      tags: [plans]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The recipe's customization groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealCustomizations"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/plans/{week}/entries/{entryId}/customization:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - $ref: "#/components/parameters/EntryID"
    put:
      summary: Customize a planned meal
      description: |
        Requires `plan.edit`. `selections` replaces the entry's
        customizations; `[]` resets the meal, and a line left out goes back to
        its original. A `choiceId` of `original` stores nothing.

        An unknown `ingredientKey` or `choiceId`, including a choice the
        household's restrictions rule out, is `400 validation_failed`. The
        chosen customization changes the week's grocery list and what cooking
        the meal deducts from the pantry, and is recorded as `meal.customized`.
      operationId: setMealCustomization
      tags: [plans]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMealCustomizationRequest"
      responses:
        "200":
          description: The plan after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PlanConflict"
  /api/v1/households/{householdId}/plans/{week}/entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - $ref: "#/components/parameters/EntryID"
    patch:
      summary: Change a planned entry
      description: |
        Requires `plan.edit`. Send at least one of `day`, `servings`, `note`;
        omitted fields don't change, and `"day": null` unschedules. New
        servings must be one of the recipe's serving sizes.
      operationId: updatePlanEntry
      tags: [plans]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanEntryRequest"
      responses:
        "200":
          description: The plan after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PlanConflict"
    delete:
      summary: Remove a planned entry
      description: Requires `plan.edit`.
      operationId: deletePlanEntry
      tags: [plans]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PlanConflict"
  /api/v1/households/{householdId}/plans/{week}/status:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    put:
      summary: Finalize a week or reopen it
      description: |
        Requires `plan.edit`. Creates the plan if needed. A finalized plan's
        entries can't change until its status is set back to `draft`.
      operationId: setPlanStatus
      tags: [plans]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPlanStatusRequest"
      responses:
        "200":
          description: The plan with its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/plans/{week}/grocery:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: Get a week's grocery list
      description: |
        Aggregates the week's entries with the grocery engine, using each live
        recipe's authored amounts for the entry's serving size (never scaled).
        Requires `household.view`. Computed on every request, with the
        household pantry deciding statuses (`pantryApplied: true`): in-stock
        items are `inPantry`, in-stock freezer items are `fromFreezer`, items
        marked low or out are `toBuy`, and the rest are `pantryHint` when
        every recipe marks them as staples, otherwise `toBuy`. Amounts whose units can't be combined stay separate.

        Specialty ingredients are handled as the household chose first
        (`specialtiesApplied: true`, docs/specialty-ingredients.md): a store
        alternative is replaced by its regular ingredients (`via`); a
        house-made batch stays as an `inPantry` item when the pantry batch
        covers the week, or is replaced by the ingredients for enough batches
        (`batches`); without a choice the item stays with `specialty: true`
        and `specialtyDetail.suggestedOptions`.
      operationId: getPlanGroceryList
      tags: [plans]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The grocery list, grouped by category in aisle order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/thaw:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: What to thaw today
      description: |
        The frozen pantry items today's planned meals need, with the fridge
        thaw estimate for one portion and the local time to move each one out
        of the freezer so it is ready at dinner. `date` is today in the
        household's time zone and `reminderHour` is the hour the household's
        thaw reminders go out (`thawReminderHour`). An item whose `moveBy`
        has already passed comes back with `overnight: true`, so the honest
        advice is "move it now". Requires `household.view`.
      operationId: getThawDue
      tags: [plans]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: What to move to the fridge today.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThawDue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/grocery-skips:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List the ingredients the household does not buy
      description: |
        The household's skipped ingredients, newest first. A skip leaves an
        ingredient off the grocery list on purpose, and is a different state
        from the pantry's "already at home" and from checking a line off.
        Requires `household.view`.
      operationId: listGrocerySkips
      tags: [plans]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The household's skipped ingredients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrocerySkipList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Skip an ingredient
      description: |
        Leaves an ingredient off the grocery list, for one week or for good.
        Requires `plan.edit`.

        One ingredient has at most one skip per household, so posting again for
        the same `ingredientKey` replaces it and answers 200 rather than 201.
        That is how a skip-once becomes a skip-forever, with nothing to delete
        first. A household may skip at most 500 ingredients; changing a skip it
        already has still works at the cap.

        The skip matches the key it was made from, `name:<normalized name>`,
        and the catalog ingredient ID for that name, so it covers every way a
        recipe reaches the ingredient. It is applied after specialty choices,
        so skipping something a store alternative introduced drops only that
        component.
      operationId: setGrocerySkip
      tags: [plans]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrocerySkipRequest"
      responses:
        "200":
          description: The ingredient's existing skip was replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrocerySkip"
        "201":
          description: The ingredient is now skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrocerySkip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/grocery-skips/{skipId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - name: skipId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Resume an ingredient
      description: |
        Removes the skip, so the ingredient is back on the next grocery list
        built. Requires `plan.edit`.
      operationId: deleteGrocerySkip
      tags: [plans]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Resumed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ingredients:
    get:
      summary: Search the ingredient catalog
      description: |
        Autocomplete for pantry items. The catalog is global, so any signed-in
        user may search; no household is involved. `q` is normalized like
        catalog keys (case, accents, and punctuation are ignored) and matches
        the start of any word in the name. The exact name comes first, then
        names starting with `q`, then names with a later word starting with
        it; each group is alphabetical.
      operationId: searchIngredients
      tags: [ingredients]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
          example: oil
        - name: limit
          in: query
          description: Values above 50 are treated as 50.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Matching catalog ingredients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/households/{householdId}/pantry:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List pantry items
      description: |
        Every matching item in the household's pantry, in aisle order and then
        by name. A pantry holds at most 1000 items, so the list isn't
        paginated. Requires `household.view`.

        Before responding, the low-stock check runs: a tracked item whose
        estimate crossed its threshold is marked `low` (`statusSource:
        estimate`) and the household is notified once per cycle.
      operationId: listPantryItems
      tags: [pantry]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PantryStatus"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/GroceryCategoryName"
        - name: staple
          in: query
          description: "`true` for staples only, `false` for the rest."
          schema:
            type: boolean
        - name: storage
          in: query
          description: |
            Where the item is kept. `pantry` also matches every item stored
            before the freezer existed.
          schema:
            $ref: "#/components/schemas/PantryStorage"
        - name: q
          in: query
          description: |
            Text the display name contains (case-insensitive), or that the
            normalized name contains (`jalapeno` finds "Jalapeño"). Literal
            text, not a pattern.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: The pantry items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryItemListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Add a pantry item
      description: |
        Adds an ingredient by catalog `ingredientId` or free-text `name`, or
        merges into the item that already has the same ingredient (one item per
        ingredient per household). Requires `pantry.edit`.

        A free-text name that is a catalog ingredient is linked to it. A merge
        applies `status` (default `in_stock`) and every field sent; omitted
        fields keep their values and the display name is kept, so retrying is
        safe.
      operationId: addPantryItem
      tags: [pantry]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPantryItemRequest"
      responses:
        "201":
          description: Added a new item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryItem"
        "200":
          description: Merged into the existing item for this ingredient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PantryConflict"
  /api/v1/households/{householdId}/pantry/{itemId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/PantryItemID"
    patch:
      summary: Update a pantry item
      description: |
        Changes the fields sent. `quantity`, `expiresOn`, and `note` may be
        `null` (or `""`) to clear them; clearing `quantity` also clears `unit`.
        Setting `status` to `out` clears the amount. Requires `pantry.edit`.

        A new `quantity` becomes the usage estimate's starting point, and a
        `status` sent here replaces one the estimate set.
        `lowThresholdPercent` sets the item's own threshold; `null` returns
        it to the household's.
      operationId: updatePantryItem
      tags: [pantry]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePantryItemRequest"
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PantryConflict"
    delete:
      summary: Delete a pantry item
      description: Requires `pantry.edit`.
      operationId: deletePantryItem
      tags: [pantry]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/pantry/bulk:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Set several items' statuses
      description: |
        Sets up to 200 items' statuses at once, for example after shopping.
        Items marked `out` lose their amount. Requested IDs that aren't in the
        pantry are listed in `missing` instead of failing the request.
        Requires `pantry.edit`.
      operationId: setPantryStatuses
      tags: [pantry]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPantryStatusRequest"
      responses:
        "200":
          description: The updated items, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkPantryStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/pantry/freezer:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Freeze a bulk pack's remainder
      description: |
        Records what a member sealed and put in the freezer. The ingredient's
        pantry item (added when the pantry doesn't have it yet) is stored with
        `storage: freezer`, the sealed amount, and how many portions it was
        split into, and a usage cycle starts from it so cooked meals count it
        down like any other pantry amount. The response carries the fridge
        thaw estimate for one portion, so the app can say "about 4 hours"
        without a second request. Requires `pantry.edit`.

        `quantity` is the real remainder ("16 oz"), not the package size.
        With `source`, freezing is idempotent per handoff line: sending the
        same line again returns 200 with `alreadyFrozen: true` and changes
        nothing. Without `source` it is an ordinary write, so a member can
        freeze something the app never bought.
      operationId: freezePantryItem
      tags: [pantry]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreezePantryItemRequest"
      responses:
        "201":
          description: The ingredient wasn't in the pantry, so a freezer item was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreezePantryItemResponse"
        "200":
          description: Merged into the existing item for this ingredient, or this handoff line was already frozen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreezePantryItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PantryConflict"
  /api/v1/households/{householdId}/pantry/staples/defaults:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Add the default staples
      description: |
        Adds salt, black pepper, cooking oil, olive oil, butter, sugar, flour,
        garlic powder, and onion powder, in stock and marked `isStaple`, unless
        the pantry already has them. Each links to the catalog ingredient with
        its name or a known alias ("Pepper" for black pepper). Idempotent:
        staples already in the pantry under either name are left unchanged and
        counted in `skipped`. No request body. Requires `pantry.edit`.
      operationId: addDefaultPantryStaples
      tags: [pantry]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The staples added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultStaplesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/pantry/purchases:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Record a purchase
      description: |
        Records that the household bought an item: after a member checks off a
        grocery line and confirms "Add to pantry?" (`source: grocery_list`),
        or restocks from the Pantry tab (`source: manual`). `provider` is
        rejected: it's recorded by confirming a shopping handoff.

        The item (added when `ingredientId` or `name` isn't in the pantry yet)
        is set `in_stock` with the bought amount, and a new usage cycle starts
        from that amount. Without `quantity` the item is in stock but
        untracked. Repeating a `clientPurchaseId` returns 200 with the first
        purchase and changes nothing. Requires `pantry.edit`.
      operationId: recordPantryPurchase
      tags: [pantry]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPantryPurchaseRequest"
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPantryPurchaseResponse"
        "200":
          description: The `clientPurchaseId` was already recorded; the first purchase and the item as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPantryPurchaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PantryConflict"
  /api/v1/households/{householdId}/pantry/{itemId}/purchases:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/PantryItemID"
    get:
      summary: List an item's purchases
      description: The item's 20 most recent purchases, newest first. Requires `household.view`.
      operationId: listPantryPurchases
      tags: [pantry]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The purchases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantryPurchaseListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/pantry/purchases/{purchaseId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - name: purchaseId
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Set a purchase's price
      description: |
        Sets what a purchase cost, or clears it with null. `priceCents` is
        required. Prices of provider purchases are usually set through
        POST .../shopping/handoffs/{handoffId}/prices, which keeps the handoff
        line in step. Requires `pantry.edit`.
      operationId: setPantryPurchasePrice
      tags: [pantry]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [priceCents]
              properties:
                priceCents:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 1000000
      responses:
        "200":
          description: The purchase.
          content:
            application/json:
              schema:
                type: object
                required: [purchase]
                properties:
                  purchase:
                    $ref: "#/components/schemas/PantryPurchase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/pantry/settings:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: Get pantry settings
      description: The household's low-stock threshold. Requires `household.view`.
      operationId: getPantrySettings
      tags: [pantry]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The settings (defaults until changed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantrySettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update pantry settings
      description: |
        Sets the household's low-stock threshold. Estimates use it from the
        next read. Requires `pantry.edit`.
      operationId: updatePantrySettings
      tags: [pantry]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePantrySettingsRequest"
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PantrySettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/households/{householdId}/specialty-ingredients:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List specialty ingredients
      description: |
        The specialty ingredients the household's recipes use, most used first
        (`recipeCount`), then by name, each with the household's choice, every
        option (curated, then the household's), and the batch item in the
        pantry. `all=true` includes every curated specialty ingredient, used
        or not. Requires `household.view`.
      operationId: listSpecialtyIngredients
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The household's specialty ingredients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialtyIngredientList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/specialty-ingredients/choices/defaults:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Choose the curated defaults
      description: |
        Chooses `defaultOptionId` for every specialty ingredient the
        household's recipes use that has no choice yet. Existing choices are
        never changed, so calling it again chooses nothing. Requires
        `pantry.edit`.
      operationId: applySpecialtyIngredientDefaults
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The specialty ingredients that got their default, and how many already had a choice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialtyDefaultsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/specialty-ingredients/settings:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: Get the specialty ingredient settings
      description: |
        The household's standing answer for specialty ingredients nobody has
        chosen an option for, with short descriptions of each strategy so the
        app can show the trade-off. Requires `household.view`.
      operationId: getSpecialtyIngredientSettings
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The household's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialtySettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Set the specialty ingredient strategy
      description: |
        Sets one standing answer for the whole household: `similar` prefers a
        store alternative wherever there is one, `closest` prefers a
        house-made batch, and `ask` applies nothing until a member chooses.
        The strategy is resolved when a grocery list is built, so it is never
        written to the household's choices and changing it changes future
        lists. An explicit per-ingredient choice always wins over it.
        Requires `pantry.edit`.
      operationId: setSpecialtyIngredientStrategy
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSpecialtySettingsRequest"
      responses:
        "200":
          description: The household's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialtySettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/specialty-ingredients/{specialtyId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/SpecialtyID"
    get:
      summary: Get a specialty ingredient
      description: One specialty ingredient with its options, the household's choice, and batch stock. Requires `household.view`.
      operationId: getSpecialtyIngredient
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The specialty ingredient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialtyIngredient"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/specialty-ingredients/{specialtyId}/choice:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/SpecialtyID"
    put:
      summary: Choose an option
      description: |
        Sets the household's option: a curated option ID, one of the
        household's options for this specialty ingredient, or `as_is` (keep it
        on grocery lists by its own name and stop suggesting options).
        Requires `pantry.edit`.
      operationId: setSpecialtyIngredientChoice
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSpecialtyChoiceRequest"
      responses:
        "200":
          description: The specialty ingredient with the new choice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialtyIngredient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Clear the choice
      description: Removes the household's choice; grocery lists suggest options again. Clearing twice is fine. Requires `pantry.edit`.
      operationId: clearSpecialtyIngredientChoice
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cleared.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/specialty-ingredients/{specialtyId}/options:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/SpecialtyID"
    post:
      summary: Add a household option
      description: |
        Adds the household's own store alternative or house-made batch, for
        example a tweaked copy of a curated option (`basedOnOptionId`). At most
        10 per specialty ingredient. Requires `pantry.edit`.
      operationId: createSpecialtyIngredientOption
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialtyOptionRequest"
      responses:
        "201":
          description: The new option.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialtyOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/specialty-ingredients/{specialtyId}/options/{optionId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/SpecialtyID"
      - $ref: "#/components/parameters/SpecialtyOptionID"
    put:
      summary: Replace a household option
      description: Replaces a household option's content. Curated options can't be edited; copy one with `basedOnOptionId` instead. Requires `pantry.edit`.
      operationId: updateSpecialtyIngredientOption
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialtyOptionRequest"
      responses:
        "200":
          description: The updated option.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialtyOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a household option
      description: Deletes a household option and clears any choice of it. Requires `pantry.edit`.
      operationId: deleteSpecialtyIngredientOption
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/specialty-ingredients/{specialtyId}/batches:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/SpecialtyID"
    post:
      summary: Record a batch made
      description: |
        Records that the household made a house-made batch: a pantry purchase
        with `source: house_made` for the option's yield (times `batches`)
        that starts a usage cycle on the batch item (key = the specialty
        ingredient's `key`, added when missing), with the packet size from
        `unitSizes` and `expiresOn` from the shelf life. Cooked recipes then
        deduct from it and the low-stock alert works unchanged. `optionId`
        defaults to the household's choice, which must be a
        `house_made_batch`. Repeating a `clientPurchaseId` returns 200 and
        changes nothing. Requires `pantry.edit`.
      operationId: recordSpecialtyIngredientBatch
      tags: [specialty-ingredients]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordSpecialtyBatchRequest"
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordSpecialtyBatchResponse"
        "200":
          description: The `clientPurchaseId` was already recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordSpecialtyBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PantryConflict"
  /api/v1/shopping/providers:
    get:
      summary: List shopping providers
      description: |
        The enabled shopping providers and what each can do. Phase 8a enables
        Walmart with cart links only. `affiliateTracked` says whether handoff
        links carry affiliate tracking, which the app must disclose next to
        the handoff button. Requires a signed-in user.
      operationId: listShoppingProviders
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingProviderList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/households/{householdId}/shopping/settings:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: Get store settings
      description: The household's shopping provider and store. Every field is null until set. Requires `household.view`.
      operationId: getShoppingSettings
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Set store settings
      description: |
        Sets the household's provider and optional store number, recording
        who set them and when. Handoff links carry the store while the
        provider matches. Requires `shopping.edit`.
      operationId: updateShoppingSettings
      tags: [shopping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShoppingSettingsRequest"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/households/{householdId}/shopping/{provider}/preferences:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/ShoppingProvider"
    get:
      summary: List saved products
      description: The household's saved product per ingredient for the provider, by ingredient name. Requires `household.view`.
      operationId: listShoppingPreferences
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The saved products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingPreferenceList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/households/{householdId}/shopping/{provider}/preferences/{ingredientKey}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/ShoppingProvider"
      - $ref: "#/components/parameters/IngredientKey"
    get:
      summary: Get a saved product
      description: Requires `household.view`.
      operationId: getShoppingPreference
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The saved product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
    put:
      summary: Save a product for an ingredient
      description: |
        Saves the product the household buys for an ingredient, from a pasted
        product link (`productUrl`) or the numeric item ID (`productId`). The
        item ID is read from the link text (walmart.com or www.walmart.com,
        `/ip/<id>` or `/ip/<name>/<id>`); the page is never fetched, and
        short links, other hosts, and other page types are rejected. The
        member types `displayName` and an optional `packageSize`. Replacing
        keeps `id`, `createdBy`, and `createdAt`. Requires `shopping.edit`.
      operationId: putShoppingPreference
      tags: [shopping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingPreferenceRequest"
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingPreference"
        "200":
          description: Replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
    delete:
      summary: Remove a saved product
      description: Requires `shopping.edit`.
      operationId: deleteShoppingPreference
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/households/{householdId}/plans/{week}/shopping/{provider}/match:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - $ref: "#/components/parameters/ShoppingProvider"
    post:
      summary: Match the week's list to saved products
      description: |
        Matches the week's grocery list to the household's saved products:
        per-line package counts with check-amount flags, excluded lines with
        reasons, and cart links. Nothing is stored. Send `{}` for the
        defaults (every `toBuy` line). Requires `household.view`.
      operationId: matchShoppingList
      tags: [shopping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingMatchRequest"
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/households/{householdId}/plans/{week}/shopping/{provider}/handoffs:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - $ref: "#/components/parameters/ShoppingProvider"
    post:
      summary: Hand off the week's list
      description: |
        Matches like `.../match` and sends the result to the week's handoff,
        so what members confirm can be recorded. Open `cartLinks` in order;
        each adds its products to the same cart.

        A household has one current handoff per week and provider. The first
        send stores it (`201`) with every line. Later sends add to it
        (`200`) and their `cartLinks` add only what isn't in the cart yet:
        new lines, and the extra packages of a line whose count went up.
        When nothing is new, the handoff comes back unchanged with empty
        `cartLinks`; open nothing. Marking the week ordered, starting over,
        or answering every line closes it, and the next send stores a new
        one. At least one line needs a saved product. Requires
        `shopping.edit`.
      operationId: createShoppingHandoff
      tags: [shopping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingMatchRequest"
      responses:
        "200":
          description: The week's current handoff, with links for what this send adds (none when nothing is new).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingHandoff"
        "201":
          description: A new handoff for the week.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingHandoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/households/{householdId}/plans/{week}/shopping/{provider}/handoffs/start-over:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - $ref: "#/components/parameters/ShoppingProvider"
    post:
      summary: Start the week's handoff over
      description: |
        Closes the week's current handoff (`closedReason: started_over`) and
        marks its pending lines not ordered, so the next send adds every line
        again. For a member who emptied the cart. Does nothing when there is
        no current handoff. Requires `shopping.edit`.
      operationId: startOverShoppingHandoff
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Started over.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/households/{householdId}/plans/{week}/shopping/{provider}/handoffs/send-again:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - $ref: "#/components/parameters/ShoppingProvider"
    post:
      summary: Send one line again
      description: |
        Removes one ingredient's pending lines from the week's current
        handoff, so the next send adds it in full, for a member who removed
        it from the cart. Confirmed lines stay (their purchases are
        recorded). Does nothing when there is no current handoff or nothing
        pending for the ingredient. Requires `shopping.edit`.
      operationId: sendShoppingLineAgain
      tags: [shopping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ingredientKey]
              properties:
                ingredientKey:
                  type: string
      responses:
        "204":
          description: The line will be sent again.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /api/v1/households/{householdId}/shopping/handoffs:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List handoffs
      description: The household's handoffs, newest first. Requires `household.view`.
      operationId: listShoppingHandoffs
      tags: [shopping]
      security:
        - bearerAuth: []
      parameters:
        - name: week
          in: query
          schema:
            $ref: "#/components/schemas/IsoWeek"
        - name: status
          in: query
          description: "`open`: some line is pending. `done`: every line is confirmed or skipped."
          schema:
            type: string
            enum: [open, done]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: The handoffs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingHandoffList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/shopping/handoffs/{handoffId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/ShoppingHandoffID"
    get:
      summary: Get a handoff
      description: Requires `household.view`.
      operationId: getShoppingHandoff
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The handoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingHandoff"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/shopping/handoffs/{handoffId}/bulk-packs:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/ShoppingHandoffID"
    get:
      summary: List the handoff's bulk packs
      description: |
        The handoff's lines whose packages hold far more than the week needs:
        a line is a bulk pack when at least 50% of what it bought is left
        over. Each one carries what the week uses of what was bought, whether
        the remainder is worth sealing (`freezable`) and whether it already
        is (`frozen`), and the recipes Autopilot suggests planning on the
        week's still-open days so the surplus is cooked rather than stored.
        An empty `packs` means the week's packages matched what it needs.
        Requires `household.view`.
      operationId: listShoppingBulkPacks
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The handoff's bulk packs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingBulkPackList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/shopping/handoffs/{handoffId}/confirm:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/ShoppingHandoffID"
    post:
      summary: Confirm what was ordered
      description: |
        Records what a member says was ordered ("Did you order these?"). Lines
        counted per_amount, and per_week lines (not meat or seafood) with a
        measurable leftover of at least 25%, become pantry purchases; other
        lines are confirmed with `pantry: not_tracked` and no purchase. Each
        tracked line becomes one pantry purchase with `source: provider`,
        written from the stored line: `unit: package` with `unitSize` for a
        weight or volume package size, the exact amount for a discrete size
        (2 × 12 count = 24 count), or a package count without a size. A
        confirmed line keeps its first purchase: confirming it again returns
        that purchase with `created: false` and changes nothing. `skipRest`
        marks the other pending lines as not ordered; a skipped line can be
        confirmed later. Requires `pantry.edit`.
      operationId: confirmShoppingOrder
      tags: [shopping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmShoppingOrderRequest"
      responses:
        "200":
          description: The handoff and a purchase per confirmed line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmShoppingOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ShoppingConflict"
  /api/v1/households/{householdId}/shopping/handoffs/{handoffId}/prices:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/ShoppingHandoffID"
    post:
      summary: Set what handoff lines cost
      description: |
        Sets each line's `priceCents` (null clears). A confirmed line's pantry
        purchase gets the same price, and the saved product remembers the
        package price (price ÷ packages) while it is still the line's product.
        Prices come from members, typed in or read on the phone from an order
        screenshot that never leaves the phone. Requires `pantry.edit`.
      operationId: setShoppingPrices
      tags: [shopping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items:
                    type: object
                    additionalProperties: false
                    required: [lineId, priceCents]
                    properties:
                      lineId:
                        type: string
                      priceCents:
                        type: [integer, "null"]
                        minimum: 0
                        maximum: 1000000
      responses:
        "200":
          description: The handoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingHandoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/shopping/weeks/{week}/cost:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: What the week's groceries cost
      description: |
        Spent, used by this week's meals, stocked for later, cost per meal, and
        the comparison with the household's meal kit, from the prices members
        entered (docs/grocery-engine.md#weekly-cost). Requires `household.view`.
      operationId: getWeekCost
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The week's cost.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekCost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/shopping/weeks/{week}/spend:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    put:
      summary: Record the week's order total
      description: |
        What the whole order cost, fees, tax, tip, and discounts included, or
        null to clear it. Requires `shopping.edit`.
      operationId: setWeekSpend
      tags: [shopping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderTotalCents]
              properties:
                orderTotalCents:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 1000000
      responses:
        "200":
          description: The week's cost with the new total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekCost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/shopping/savings:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: Recent weeks' cost and savings
      description: |
        Weeks with a confirmed order or an order total, newest first, with the
        total saved against the meal kit. Requires `household.view`.
      operationId: getShoppingSavings
      tags: [shopping]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 26
            default: 8
      responses:
        "200":
          description: The savings history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingSavings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/shopping/weeks/{week}/order:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: The week's order reminder
      description: |
        Whether the household should be reminded to order this week. Every
        field but `ordered` is derived on read, so nothing is scheduled and
        nothing can drift: `due` means the household's `orderDay` has arrived
        and the week hasn't ended, both in the household's time zone, and
        `remind` is `due` and not `ordered`. A reminder belongs to its own
        week, so an unmarked past week stops asking once the week ends. A
        household with no `orderDay` gets nulls and `due: false`. Requires
        `household.view`.
      operationId: getOrderReminder
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The week's order state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReminder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Mark the week ordered, or take it back
      description: |
        Records that a member placed this week's grocery order, which silences
        the reminder for that week only. Sending `ordered: false` removes the
        mark and brings the reminder back, so a mis-tap can't leave a
        household un-remindable for a week. Marking is idempotent and keeps
        the first member and time, and also marks the caller's copy of the
        `shopping.order_due` notification read. Nothing else sets this: a
        Walmart hand-off is not proof an order was placed. Requires
        `shopping.edit`.
      operationId: setWeekOrdered
      tags: [shopping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetWeekOrderedRequest"
      responses:
        "200":
          description: The week's new order state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReminder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/shopping/catalog:
    get:
      summary: The store catalog
      description: |
        The curated list of grocers and delivery services households ask for,
        with the demand behind each one. Signed in, and not household scoped.
        `status` is what docs/shopping-providers.md concluded, never live
        capability: only `available` can take a list today. Without `q` the
        whole list comes back, ordered by status then name.
      operationId: listStoreCatalog
      tags: [shopping]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: |
            A case-insensitive prefix of a store's name, key, or one of its
            aliases ("krog", "fry's", "quality food").
          schema:
            type: string
            maxLength: 100
            example: krog
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCatalog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/households/{householdId}/shopping/requests:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List the household's store requests
      description: Newest first. Requires `household.view`.
      operationId: listStoreRequests
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The household's store requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreRequestList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Request a store
      description: |
        Asks DinnerOS to support a store, which is demand data and makes
        nothing usable. Send `key` for a catalog entry, or `name` for a store
        the catalog doesn't list; a typed name is matched against catalog
        names, keys, and aliases first, so "frys" records as Fry's rather
        than a new entry. Idempotent per household and store: a second
        request updates the note and returns `200`, keeping the first
        requester and time. At most 25 stores per household.

        A store the catalog already lists as `available` cannot be requested
        and comes back `400`, since DinnerOS supports it today and the demand
        counts are what decide which store is built next. That covers a typed
        `name` as well as a `key`, because a name is resolved against the
        catalog first. The app should send the member to store setup instead.

        Requires `household.view`.
      operationId: requestStore
      tags: [shopping]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreRequestRequest"
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreRequestEnvelope"
        "200":
          description: The note was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreRequestEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StoreRequestLimit"
  /api/v1/households/{householdId}/shopping/requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/StoreRequestID"
    delete:
      summary: Withdraw a store request
      description: Requires `household.view`.
      operationId: deleteStoreRequest
      tags: [shopping]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Withdrawn.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/recipes/{recipeId}/rating:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    put:
      summary: Rate a recipe
      description: |
        Creates or replaces the caller's rating of the recipe; each member has
        at most one. Requires `household.view`. Records a `recipe.rated`
        event on a best-effort basis: a failure to record it doesn't fail the
        rating.
      operationId: rateRecipe
      tags: [ratings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateRecipeRequest"
      responses:
        "200":
          description: The caller's saved rating.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove your rating
      description: |
        Removes the caller's rating of the recipe. Idempotent: also 204 when
        there is none. Requires `household.view`. Records `recipe.unrated`
        when a rating was removed.
      operationId: removeRecipeRating
      tags: [ratings]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed, or there was no rating.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/recipes/{recipeId}/ratings:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    get:
      summary: List a recipe's ratings
      description: |
        Every member's rating, most recently updated first, with display names
        and the household aggregate. Not paginated: there is at most one
        rating per member. Requires `household.view`.
      operationId: listRecipeRatings
      tags: [ratings]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The recipe's ratings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/events:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Send client-observed events
      description: |
        Stores a batch of 1–100 events the app observed. Only
        `recipe.viewed`, `recipe.cooked`, `recipe.skipped`, and
        `grocery.item_checked` are accepted; the server records every other
        type itself. The user and household come from the request, never the
        body. Requires `household.view`. Rate limited per user.

        Each event is validated on its own. Invalid events are listed in
        `rejected` and the rest are stored, so after a 200 the client drops
        the whole batch: retrying a rejected event can't succeed. An event
        whose `clientEventId` was already stored counts in `duplicates`.
      operationId: ingestEvents
      tags: [events]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventsRequest"
      responses:
        "200":
          description: Every event is counted once in `accepted`, `duplicates`, or `rejected`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/households/{householdId}/notifications:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List notifications
      description: |
        The household's notifications, newest first, with `read` for the
        caller. Before reading, the pantry's low-stock check runs, so items
        that ran low as time passed are included. Requires `household.view`.
      operationId: listNotifications
      tags: [notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          description: "`true` keeps notifications the caller hasn't read."
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          description: The previous page's `nextCursor`.
          schema:
            type: string
      responses:
        "200":
          description: A page of notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/notifications/unread-count:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: Count unread notifications
      description: |
        How many of the household's notifications the caller hasn't read,
        after the pantry's low-stock check. Requires `household.view`.
      operationId: countUnreadNotifications
      tags: [notifications]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationUnreadCount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/notifications/read:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      summary: Mark notifications read
      description: |
        Marks the given notifications, or all of them, read for the caller.
        Unknown IDs are ignored. Requires `household.view`.
      operationId: markNotificationsRead
      tags: [notifications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadRequest"
      responses:
        "200":
          description: The caller's unread count afterwards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationUnreadCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/profile:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: Get the Autopilot profile
      description: |
        The household's taste, restrictions, schedule, cook-time mix, novelty,
        equipment, and weekday rules. Requires `household.view`. A household
        that never saved a profile reads the defaults with `configured: false`
        and null timestamps, not a 404.
      operationId: getAutopilotProfile
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Replace the Autopilot profile
      description: |
        Requires `plan.edit`. Every section is optional; sections left out
        reset to their defaults, so onboarding sends all of them. The whole
        resulting profile is validated (400 `validation_failed`). Sections
        whose values change record who changed them and appear in the
        preference history; saving an identical profile changes nothing.
        409 `conflict` when the profile kept changing concurrently.
      operationId: replaceAutopilotProfile
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotProfileRequest"
      responses:
        "200":
          description: The saved profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
    patch:
      summary: Update Autopilot profile sections
      description: |
        Requires `plan.edit`. Send at least one section as an object (`null`
        is not a change); each sent section is replaced whole and the others don't change. The whole resulting
        profile is validated, so a change can fail because of another section
        (a weekday rule's method must be in `equipment`, for example).
        409 `conflict` when the profile kept changing concurrently.
      operationId: updateAutopilotProfile
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AutopilotProfileRequest"
              minProperties: 1
      responses:
        "200":
          description: The saved profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/autopilot/profile/history:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List Autopilot preference changes
      description: |
        Changes to the profile, week contexts, and recipe overrides, newest
        first. Requires `household.view`.
      operationId: listAutopilotPreferenceHistory
      tags: [autopilot]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/vocabulary:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: Get Autopilot choices
      description: |
        Everything the onboarding and preference screens offer: cuisines and
        tags from the household's main meals plus starter values, the fixed
        lists, and the validation limits. Requires `household.view`.
      operationId: getAutopilotVocabulary
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotVocabulary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/recipe-overrides:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: List recipe method overrides
      description: The household's cooking-method overrides, one per recipe that has any. Requires `household.view`.
      operationId: listAutopilotRecipeOverrides
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The overrides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotRecipeOverrideList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/recipes/{recipeId}/attributes:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    get:
      summary: Get a recipe's Autopilot attributes
      description: |
        What Autopilot derives from the recipe (cook time and band, cuisines,
        tags, proteins, allergens, diets, spiciness, and the cooking methods it
        suits), with the household's overrides applied. The time band uses the
        profile's cook-time limits. Requires `household.view`. 404 when the
        recipe isn't in the household.
      operationId: getAutopilotRecipeAttributes
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The attributes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotRecipeAttributes"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/recipes/{recipeId}/override:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    put:
      summary: Override a recipe's cooking methods
      description: |
        Requires `plan.edit`. Says whether the recipe suits each named method;
        `null` clears that method's override, returning it to the heuristic.
        Methods left out don't change. Each changed method appears in the
        preference history. 404 when the recipe isn't in the household.
      operationId: setAutopilotRecipeOverride
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotRecipeOverrideRequest"
      responses:
        "200":
          description: The recipe's attributes with the override applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotRecipeAttributes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/context:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: Get a week's Autopilot context
      description: |
        What's special about the week. Requires `household.view`. A week
        without a saved context reads empty, with `configured: false` and null
        `updatedBy` and `updatedAt`, not a 404.
      operationId: getAutopilotWeekContext
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The week context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotWeekContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Save a week's Autopilot context
      description: |
        Requires `plan.edit`. Replaces the whole context; fields left out take
        their empty values. Days with nothing set are dropped. Changes appear
        in the preference history; saving an identical context changes
        nothing. 409 `conflict` when the context kept changing concurrently.
      operationId: saveAutopilotWeekContext
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotWeekContextRequest"
      responses:
        "200":
          description: The saved week context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotWeekContext"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
    delete:
      summary: Clear a week's Autopilot context
      description: Requires `plan.edit`. Also 204 when the week had no context.
      operationId: clearAutopilotWeekContext
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cleared.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/generate:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Generate an Autopilot week
      description: |
        Requires `plan.edit`. Proposes meals for the week's open days from the
        profile, the week context, ratings, and history, and saves it as the
        week's proposal, replacing any earlier one (a pending one is recorded
        as rejected). Meals already in the plan are kept and their days aren't
        planned. The plan doesn't change until the proposal is accepted. A
        proposal can plan fewer meals than requested; `unfilled` and
        `messages` say why. The body is optional: an empty body, chunked or
        not, means no options.
        409 `plan_finalized` or `proposal_changed`.
      operationId: generateAutopilotWeek
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotGenerateRequest"
      responses:
        "201":
          description: The new proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/proposal:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: Get a week's Autopilot proposal
      description: |
        The week's latest proposal, whatever its status. Requires
        `household.view`. 404 when the week has none.
      operationId: getAutopilotProposal
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/proposal/slots/{slotId}/swap:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - $ref: "#/components/parameters/SlotID"
    post:
      summary: Swap a proposed meal
      description: |
        Requires `plan.edit`. Replaces the slot's meal with the next best
        recipe that honors the same constraints, given the plan and the other
        proposed meals. Meals swapped out of a slot aren't offered for it
        again. Send the proposal's current `version`; the response carries
        the new one. 400 when `slotId` isn't a day code; 404 when the week has
        no proposal or no meal on that day. 409 `proposal_changed`, `proposal_not_pending`,
        `no_alternative`, or `plan_finalized`.
      operationId: swapAutopilotMeal
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotVersionRequest"
      responses:
        "200":
          description: The proposal after the swap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/proposal/accept:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Accept an Autopilot week
      description: |
        Requires `plan.edit`. Adds the proposal's meals, except
        `excludeSlotIds`, to the week's draft plan as entries with origin
        `autopilot` in one atomic change, and marks the proposal accepted.
        Accepting never replaces or duplicates entries: a meal whose day has
        been planned since (`dayTaken`) or whose recipe is already in the week
        (`alreadyPlanned`) is left out and listed in `skipped`. 400 when an
        excluded ID isn't a slot of the proposal. 404 when the week has no
        proposal. 409 `proposal_changed`, `proposal_not_pending`,
        `nothing_to_accept`, `proposal_stale`, `plan_finalized`, or
        `plan_full`.
      operationId: acceptAutopilotWeek
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotAcceptRequest"
      responses:
        "200":
          description: The accepted proposal, the plan after adding its meals, and what was added and skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotAcceptResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/pairings:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    get:
      summary: Pairings for the week's meals
      description: |
        Add-ons and grocery items to have with the week's planned main meals,
        from the household's pairing rules and from what it usually has
        (docs/autopilot.md#add-on-pairings). At most 3 per meal; pairings
        already in the week or dismissed are left out. Reading records
        `pairing.suggested` once per meal and target. Requires
        `household.view`.
      operationId: listAutopilotWeekPairings
      tags: [autopilot]
      security:
        - bearerAuth: []
      parameters:
        - name: entryId
          in: query
          description: Only this plan entry's meal, for the "you added a pasta dish" prompt.
          schema:
            type: string
      responses:
        "200":
          description: The week's pairings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotWeekPairings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/pairings/accept:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Add a pairing to the week
      description: |
        Requires `plan.edit`. An add-on recipe becomes a plan entry on the
        meal's day with origin `autopilot` and the smallest authored serving
        size that feeds the meal; a grocery item joins the week's grocery
        list. Accepting something the week already has adds nothing and
        returns `alreadyAdded`. 404 when the plan entry or the pairing is
        unknown; 409 `plan_finalized`.
      operationId: acceptAutopilotPairing
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotPairingActionRequest"
      responses:
        "200":
          description: What was added, and the week's plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotPairingAcceptResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/pairings/dismiss:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Dismiss a pairing for this week
      description: |
        Requires `plan.edit`. Hides the pairing for that meal this week and
        returns the week's pairings. Dismissing again changes nothing.
      operationId: dismissAutopilotPairing
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotPairingActionRequest"
      responses:
        "200":
          description: The week's pairings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotWeekPairings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/pairings/rules:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Keep a learned pairing as a rule
      description: |
        Requires `plan.edit`. Turns a learned pairing into a household rule
        for its meal category, saved in the profile's `pairings` section. The
        same item for a second category joins the rule it already has
        (`merged`); a rule that already covers it is `unchanged`. 400 when the
        pairing comes from a rule that no longer exists or has no meal
        category.
      operationId: createAutopilotPairingRule
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotMakePairingRuleRequest"
      responses:
        "200":
          description: The rule and the profile it was saved in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotMakePairingRuleResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/pairings/grocery-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Take a paired grocery item off the week
      description: Requires `plan.edit`. 404 when the week has no such item; 409 `plan_finalized`.
      operationId: deleteAutopilotPairingGroceryItem
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"
  /api/v1/households/{householdId}/recipes/{recipeId}/pairings:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/RecipeID"
    get:
      summary: What goes well with a recipe
      description: |
        The recipe detail's "Tastes even better with" list: add-ons and
        grocery items the household pairs with this meal, whether or not it is
        planned. Unlike the week's pairings, items already in the week are
        included with `inPlan: true`. At most 6; add-ons have none. Requires
        `household.view`.
      operationId: listRecipePairings
      tags: [autopilot]
      security:
        - bearerAuth: []
      parameters:
        - name: week
          in: query
          description: Set `inPlan` against this week, and return the recipe's plan entry when it has one.
          schema:
            $ref: "#/components/schemas/IsoWeek"
      responses:
        "200":
          description: The recipe's pairings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotRecipePairings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/households/{householdId}/autopilot/learning:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      summary: What Autopilot learned
      description: |
        Requires `household.view`. The strongest (at most 20) adjustments
        Autopilot learned from the household's feedback — swaps, meals left
        out, accepted suggestions, views, cooks, skips, and ratings — as of
        the current week (docs/autopilot.md#learning-from-feedback). They
        are recomputed from events, not stored. 501 `not_supported` when the
        recommendation provider doesn't report learning.
      operationId: getAutopilotLearning
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: What was learned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotLearning"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: The recommendation provider doesn't report learning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Reset what Autopilot learned
      description: |
        Requires `plan.edit`. Feedback from before now no longer adjusts
        suggestions; ratings, history, and preferences work as before.
        Records `autopilot.learning_reset` and returns the (empty) learning.
      operationId: resetAutopilotLearning
      tags: [autopilot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Learning after the reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotLearning"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          description: The recommendation provider doesn't report learning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/households/{householdId}/autopilot/weeks/{week}/proposal/reject:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/Week"
    post:
      summary: Reject an Autopilot week
      description: |
        Requires `plan.edit`. Dismisses a pending proposal; the plan doesn't
        change. 404 when the week has no proposal. 409 `proposal_changed` or
        `proposal_not_pending`.
      operationId: rejectAutopilotWeek
      tags: [autopilot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotVersionRequest"
      responses:
        "200":
          description: The rejected proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopilotProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AutopilotConflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        DinnerOS access token from a sign-in or refresh response. Valid for 15
        minutes. An expired token yields 401 `token_expired`; refresh and retry.
  headers:
    RequestID:
      description: |
        Request correlation ID. A well-formed incoming `X-Request-ID`
        (8–128 chars of `A-Za-z0-9._-`) is reused; otherwise one is generated.
        Every response includes it.
      schema:
        type: string
  parameters:
    HouseholdID:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80913
    UserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80912
    InvitationID:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80914
    RecipeID:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80915
    Week:
      name: week
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IsoWeek"
    EntryID:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80c01
    PantryItemID:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    SpecialtyID:
      name: specialtyId
      in: path
      required: true
      description: A specialty ingredient's stable slug.
      schema:
        type: string
        example: southwest-spice-blend
    SpecialtyOptionID:
      name: optionId
      in: path
      required: true
      description: A household option ID.
      schema:
        type: string
    SlotID:
      name: slotId
      in: path
      required: true
      description: A proposal slot's ID, which is its day code.
      schema:
        $ref: "#/components/schemas/AutopilotDay"
    ShoppingProvider:
      name: provider
      in: path
      required: true
      description: |
        A shopping provider key. `walmart` is enabled; `instacart` and
        `kroger` return 503 `provider_unavailable`; anything else 404.
      schema:
        type: string
        example: walmart
    IngredientKey:
      name: ingredientKey
      in: path
      required: true
      description: |
        A grocery line's `ingredientKey`, percent-encoded: a catalog
        ingredient ID, or `name:` and a normalized name (`name:red%20onion`).
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80a14
    ShoppingHandoffID:
      name: handoffId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80b01
    StoreRequestID:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        example: 66e5a1f2c3b4a5d6e7f80d01
  schemas:
    RecipeSummary:
      type: object
      required: [id, name, timesOrdered, isAddon, tags, calories, proteinGrams, timeBand, householdRating, myRating]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80915
        name:
          type: string
          example: Beef Tacos
        headline:
          type: string
        imageUrl:
          type: string
        totalMinutes:
          type: integer
        cookMinutes:
          type: integer
          minimum: 1
          description: |
            Effective cook time: the larger of `prepMinutes` and
            `totalMinutes` (sources report them inconsistently). Omitted when
            neither is known. Use it for display and time filters.
        timesOrdered:
          type: integer
          description: Number of distinct weeks the household received this recipe.
        lastOrderedWeek:
          type: string
          description: ISO week of the latest delivery. Omitted when never ordered.
          example: 2026-W30
        isAddon:
          type: boolean
        tags:
          type: array
          items:
            type: string
        calories:
          type: [integer, "null"]
          description: |
            Kilocalories per serving, read from the recipe's nutrition list.
            Null when the source didn't report energy.
          example: 690
        proteinGrams:
          type: [integer, "null"]
          description: Grams of protein per serving, or null.
          example: 36
        timeBand:
          $ref: "#/components/schemas/TimeBand"
        householdRating:
          $ref: "#/components/schemas/HouseholdRating"
        myRating:
          description: The caller's own rating, or null.
          oneOf:
            - $ref: "#/components/schemas/Rating"
            - type: "null"
    RecipeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
        nextCursor:
          type: string
          description: Present when another page exists.
    TimeBand:
      type: [string, "null"]
      enum: [quick, medium, long, null]
      description: |
        The band a recipe's `cookMinutes` falls in under the household's
        Autopilot cook-time limits (20 and 35 minutes by default). Null when
        the cook time is unknown.
    MenuResponse:
      type: object
      required: [week, weekStart, weekEnd, currentWeek, timing, plan, proposal, sections]
      properties:
        week:
          type: string
          example: 2026-W38
        weekStart:
          type: string
          description: The week's first day, YYYY-MM-DD, which depends on the household's `weekStartsOn` (Sunday-first 2026-W38 starts 2026-09-13).
          example: 2026-09-13
        weekEnd:
          type: string
          description: The week's last day, YYYY-MM-DD.
          example: 2026-09-19
        currentWeek:
          type: string
          description: The household's current week, which `timing` compares to.
          example: 2026-W38
        timing:
          type: string
          enum: [past, current, upcoming]
        plan:
          description: The week's plan, or null when nothing is stored for it.
          oneOf:
            - $ref: "#/components/schemas/Plan"
            - type: "null"
        proposal:
          description: A summary of the week's Autopilot proposal, or null.
          oneOf:
            - $ref: "#/components/schemas/MenuProposalSummary"
            - type: "null"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/MenuSection"
    MenuProposalSummary:
      type: object
      required: [id, status, version, plannedMeals]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [proposed, accepted, rejected]
        version:
          type: integer
          format: int64
        plannedMeals:
          type: integer
    MenuSection:
      type: object
      required: [id, kind, title, subtitle, items, moreQuery]
      properties:
        id:
          type: string
          description: |
            `favorites`, `quick`, `new_to_you`, `long_cooks`, `sides`,
            `history_planned`, `history_ordered`, or `rule_<day>` for a
            weekday rule (`rule_sun`, and `rule_sun_2` for a second rule on
            one day). Treat it as opaque: new IDs can appear.
          example: favorites
        kind:
          type: string
          enum: [carousel, history]
        title:
          type: string
          example: Your Favorites
        subtitle:
          type: string
          example: Based on what you rate and reorder
        items:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/MenuCard"
        moreQuery:
          description: |
            Query parameters for GET .../menu/recipes that list more of the
            same, or null. Every value is a string.
          oneOf:
            - type: object
              additionalProperties:
                type: string
              example: { "sort": "popular" }
            - type: "null"
    MenuCard:
      type: object
      required: [recipe, badges, reason, inPlan, planEntryIds]
      properties:
        recipe:
          $ref: "#/components/schemas/RecipeSummary"
        badges:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/MenuBadge"
        reason:
          type: [string, "null"]
          description: A short explanation, or null.
          example: Ordered 21 times
        inPlan:
          type: boolean
          description: The shown week's plan has this recipe.
        planEntryIds:
          type: array
          description: The shown week's plan entries for this recipe.
          items:
            type: string
    MenuBadge:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
          enum: [quick, make_again, kid_favorite, new, top_rated, autopilot_pick, smoker_friendly, often_ordered]
        text:
          type: string
          example: Make Again
    MenuRecipesResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuCard"
        nextCursor:
          type: [string, "null"]
          description: Null on the last page. Send it back with the same sort.
    MenuFiltersResponse:
      type: object
      required: [proteins, cuisines, tags, maxMinutes, sorts]
      properties:
        proteins:
          type: array
          items:
            $ref: "#/components/schemas/MenuFilterOption"
        cuisines:
          type: array
          items:
            $ref: "#/components/schemas/MenuFilterOption"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/MenuFilterOption"
        maxMinutes:
          type: array
          description: Cook-time chips, in minutes.
          items:
            type: integer
          example: [15, 20, 30, 45]
        sorts:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
                enum: [recommended, popular, recent, quick, name]
              label:
                type: string
    MenuFilterOption:
      type: object
      required: [value, label, count]
      properties:
        value:
          type: string
          description: Send this back as the filter's value.
          example: chicken
        label:
          type: string
          example: Chicken
        count:
          type: integer
          description: Main meals the chip matches.
    WeeksResponse:
      type: object
      required: [items, earliestWeek]
      properties:
        items:
          type: array
          description: Weeks, oldest first.
          items:
            $ref: "#/components/schemas/WeekSummary"
        earliestWeek:
          type: [string, "null"]
          description: |
            The earliest week with a planned entry or an ordered main meal,
            so the app knows how far back "Past" goes. Null without history.
          example: 2023-W05
    WeekSummary:
      type: object
      required: [week, weekStart, weekEnd, timing, plannedCount, addOnCount, cookedCount, orderedCount, status]
      properties:
        week:
          type: string
          example: 2026-W30
        weekStart:
          type: string
          example: 2026-07-20
        weekEnd:
          type: string
          example: 2026-07-26
        timing:
          type: string
          enum: [past, current, upcoming]
        plannedCount:
          type: integer
          description: |
            Planned main meals that week. Add-ons are excluded, so this is the
            number to show as "meals".
        addOnCount:
          type: integer
          description: |
            Planned add-ons that week (a pairing's garlic bread). Counted
            separately so "5 meals · 1 add-on" reads correctly.
        cookedCount:
          type: integer
          description: Distinct recipe.cooked events that week.
        orderedCount:
          type: integer
          description: Main meals delivered that week; add-ons are excluded.
        status:
          type: string
          enum: [draft, finalized, none]
          description: none when no plan is stored for the week.
    Recipe:
      type: object
      required: [id, householdId, source, sourceRecipeId, sourceAliases, name, isAddon, servings, cuisines, tags, utensils, allergens, nutritionPerServing, ingredients, steps, orderWeeks, timesOrdered, createdAt, updatedAt, householdRating, myRating]
      properties:
        id:
          type: string
        householdId:
          type: string
        source:
          type: string
          enum: [hellofresh, manual, import, user, provider, partner]
        sourceRecipeId:
          type: string
        sourceAliases:
          type: array
          description: Other source IDs known to be this recipe.
          items:
            type: string
        sourceUrl:
          type: string
        name:
          type: string
        headline:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        isAddon:
          type: boolean
        servings:
          type: array
          description: Serving sizes with authored amounts, ascending.
          items:
            type: integer
        prepMinutes:
          type: integer
        totalMinutes:
          type: integer
        cookMinutes:
          type: integer
          minimum: 1
          description: |
            Effective cook time: the larger of `prepMinutes` and
            `totalMinutes` (sources report them inconsistently). Omitted when
            neither is known. Use it for display and time filters.
        timeBand:
          $ref: "#/components/schemas/TimeBand"
        calories:
          type: [integer, "null"]
          description: Kilocalories per serving, or null.
          example: 690
        proteinGrams:
          type: [integer, "null"]
          description: Grams of protein per serving, or null.
          example: 36
        difficulty:
          type: integer
          description: The source's difficulty scale, when it gave one.
        cuisines:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        utensils:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        nutritionPerServing:
          type: array
          items:
            type: object
            required: [name, amount, unit]
            properties:
              name:
                type: string
              amount:
                type: number
              unit:
                type: string
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredient"
        steps:
          type: array
          items:
            type: object
            required: [index, text]
            properties:
              index:
                type: integer
              text:
                type: string
              imageUrl:
                type: string
        orderWeeks:
          type: array
          description: ISO weeks the household received this recipe, sorted.
          items:
            type: string
            example: 2026-W30
        timesOrdered:
          type: integer
        lastOrderedWeek:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        householdRating:
          $ref: "#/components/schemas/HouseholdRating"
        myRating:
          description: The caller's own rating, or null.
          oneOf:
            - $ref: "#/components/schemas/Rating"
            - type: "null"
    RecipeIngredient:
      type: object
      required: [ingredientId, name, category, pantryStaple, amounts]
      properties:
        ingredientId:
          type: string
          description: Catalog ingredient ID.
        name:
          type: string
          example: Parmesan Cheese
        category:
          type: string
          enum: [produce, meat-seafood, dairy-eggs, bakery, deli, pantry, spices, condiments, frozen, beverages, other]
        imageUrl:
          type: string
          description: |
            The catalog ingredient's image, when it has one. Ingredient lines
            carry no allergens of their own: the import format reports
            allergens per recipe.
        pantryStaple:
          type: boolean
          description: Source hint that the ingredient is usually at home.
        amounts:
          type: array
          items:
            $ref: "#/components/schemas/IngredientAmount"
    IngredientAmount:
      type: object
      required: [servings, quantity, quantityValue, unit, sourceUnit, rawText]
      properties:
        servings:
          type: integer
          example: 2
        quantity:
          type: [string, "null"]
          description: Exact amount as "n" or "n/d". Null when the source gave no amount.
          example: 1/2
        quantityValue:
          type: [number, "null"]
          description: The same amount as a number, for display only.
          example: 0.5
        unit:
          type: string
          description: DinnerOS unit code, or empty.
          example: oz
        sourceUnit:
          type: string
          example: ounce
        rawText:
          type: string
          example: ½ ounce Parmesan Cheese
    RecipeInstructions:
      type: object
      required: [recipeId, recipeName, servings, servingOptions, specialtiesApplied, steps, substitutions, unchosenSpecialties]
      properties:
        recipeId:
          type: string
        recipeName:
          type: string
        servings:
          type: integer
          description: The serving size every amount below is for.
          example: 4
        servingOptions:
          type: array
          items:
            type: integer
        specialtiesApplied:
          type: boolean
          description: |
            False when the server could not consult the household's specialty
            ingredient choices, so the steps read as the recipe was written.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/InstructionStep"
        substitutions:
          type: array
          description: The specialty ingredients that read differently because of the household's choices.
          items:
            $ref: "#/components/schemas/InstructionSubstitution"
        unchosenSpecialties:
          type: array
          description: |
            Specialty ingredients this recipe uses that the household has not
            decided about. They read as the card wrote them; offer the choice.
          items:
            type: object
            required: [id, key, name]
            properties:
              id:
                type: string
              key:
                type: string
              name:
                type: string
    InstructionStep:
      type: object
      required: [index, text, segments, notes]
      properties:
        index:
          type: integer
        text:
          type: string
          description: The whole step; equals every segment's text joined in order.
          example: Whisk 2 tbsp gochujang with 2 tbsp Tomato Paste.
        originalText:
          type: string
          description: The recipe's own wording, present only when a substitution changed it.
        imageUrl:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/InstructionSegment"
        notes:
          type: array
          description: |
            Sentences to show under the step when a substitution changes the
            amount or the method in a way a swapped word cannot say.
          items:
            type: object
            required: [kind, text]
            properties:
              kind:
                type: string
                enum: [substitution]
              specialtyId:
                type: string
              text:
                type: string
    InstructionSegment:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [text, ingredient]
        text:
          type: string
        ingredientId:
          type: string
          description: Catalog ingredient, absent when the catalog does not know it.
        name:
          type: string
          description: What the segment stands for, after any substitution.
        amount:
          description: |
            The amount for `servings`. Absent when the recipe gave none, when
            an earlier mention in the same step already carried it, or when a
            substitution's amount does not convert exactly.
          type: object
          required: [quantity, quantityValue, unit, text]
          properties:
            quantity:
              type: string
              description: Exact amount as "n" or "n/d".
              example: 1/2
            quantityValue:
              type: number
            unit:
              type: string
              example: tbsp
            text:
              type: string
              example: ½ tbsp
        spicy:
          type: boolean
          description: |
            The ingredient brings heat. Clients must pair any colour they use
            for it with a non-colour signal.
        substituted:
          type: boolean
          description: The household's specialty choice changed this mention.
        specialtyId:
          type: string
        specialtyName:
          type: string
    InstructionSubstitution:
      type: object
      required: [specialtyId, specialtyKey, specialtyName, optionId, optionName, type, source, text]
      properties:
        specialtyId:
          type: string
        specialtyKey:
          type: string
        specialtyName:
          type: string
        optionId:
          type: string
        optionName:
          type: string
        type:
          type: string
          enum: [store_alternative, house_made_batch]
        source:
          type: string
          description: Who decided: a member, or the household's standing strategy.
          enum: [household, strategy]
        text:
          type: string
          example: Tex-Mex Paste → 2 tsp Tomato Paste and ½ tsp Chili Powder
    ImportFile:
      type: object
      description: The recipe import contract. Field-level rules are in docs/import-format.md.
      additionalProperties: false
      required: [version, source, recipes]
      properties:
        version:
          type: integer
          enum: [1]
        source:
          type: string
          enum: [hellofresh, manual, import, user, provider, partner]
        generatedAt:
          type: string
          format: date-time
        recipes:
          type: array
          items:
            type: object
            description: ImportRecipe (docs/import-format.md).
        review:
          type: array
          items:
            type: object
            description: ReviewItem (docs/import-format.md).
    ImportReviewListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportReview"
    ImportReview:
      type: object
      required: [recipeName, source, sourceRecipeId, field, reason, status, createdAt]
      properties:
        recipeId:
          type: string
          description: The household recipe this is about. Absent when no stored recipe carries the source ID.
        recipeName:
          type: string
        source:
          type: string
        sourceRecipeId:
          type: string
        field:
          type: string
          description: "What could not be mapped: variant, steps, cookTime, or ingredients.<name>.unit."
        value:
          type: string
          description: What the source said. Absent when the source said nothing.
        reason:
          type: string
        status:
          type: string
          enum: [open]
        createdAt:
          type: string
          format: date-time
    ImportResult:
      type: object
      required: [created, updated, unchanged, ingredientsCreated, reviewItems, errors]
      properties:
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        ingredientsCreated:
          type: integer
          description: New ingredient catalog entries.
        reviewItems:
          type: integer
          description: Distinct review items in the file. Items already recorded are not duplicated.
        errors:
          type: array
          description: Rejected recipes, in file order.
          items:
            type: object
            required: [index, problems]
            properties:
              index:
                type: integer
                description: Position in the file's `recipes` array.
              sourceRecipeId:
                type: string
              name:
                type: string
              problems:
                type: array
                items:
                  type: string
                example: ['ingredients[3] (Mystery Paste): unit "dollop" is not a DinnerOS unit code']
    HouseholdRating:
      type: object
      required: [average, count]
      properties:
        average:
          type: [number, "null"]
          description: Mean score rounded to two decimals. Null when nobody has rated the recipe.
          example: 4.5
        count:
          type: integer
          description: Number of members who rated the recipe.
          example: 2
    RatingTag:
      type: string
      enum: [make-again, never-again, kid-favorite, kids-disliked, too-spicy, too-bland, too-much-work, great-leftovers]
      description: A fixed vocabulary; anything else belongs in `comment`. `make-again` and `never-again` can't be combined.
    Rating:
      type: object
      required: [recipeId, userId, score, comment, tags, createdAt, updatedAt]
      properties:
        recipeId:
          type: string
        userId:
          type: string
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
          description: Empty when there is none.
        tags:
          type: array
          description: Distinct, in the order the `RatingTag` enum lists them.
          items:
            $ref: "#/components/schemas/RatingTag"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MemberRating:
      allOf:
        - $ref: "#/components/schemas/Rating"
        - type: object
          required: [displayName]
          properties:
            displayName:
              type: string
              description: May be empty when the user has no display name.
    RatingListResponse:
      type: object
      required: [householdRating, items]
      properties:
        householdRating:
          $ref: "#/components/schemas/HouseholdRating"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemberRating"
    RateRecipeRequest:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
          description: Leading and trailing whitespace is trimmed.
        tags:
          type: array
          description: Duplicates are ignored.
          items:
            $ref: "#/components/schemas/RatingTag"
    ClientEvent:
      type: object
      additionalProperties: false
      required: [type, occurredAt]
      properties:
        clientEventId:
          type: string
          maxLength: 64
          description: Optional idempotency key, unique per user (a UUID works). Retries with the same key are stored once.
        type:
          type: string
          enum: [recipe.viewed, recipe.cooked, recipe.skipped, grocery.item_checked]
        recipeId:
          type: string
          description: Required for `recipe.*` types and not allowed otherwise. Must be a recipe of the household.
        week:
          type: string
          pattern: '^\d{4}-W(0[1-9]|[1-4]\d|5[0-3])$'
          description: ISO week the event concerns, if any.
          example: 2026-W38
        occurredAt:
          type: string
          format: date-time
          description: When it happened, from the device clock. Within the last 30 days and at most 5 minutes ahead.
        payload:
          description: At most 1024 bytes. The shape depends on `type`; unknown fields are rejected.
          anyOf:
            - $ref: "#/components/schemas/RecipeViewedPayload"
            - $ref: "#/components/schemas/RecipeCookedPayload"
            - $ref: "#/components/schemas/RecipeSkippedPayload"
            - $ref: "#/components/schemas/GroceryItemCheckedPayload"
    RecipeViewedPayload:
      type: object
      additionalProperties: false
      properties:
        surface:
          type: string
          enum: [detail, plan, search, recommendation]
    RecipeCookedPayload:
      type: object
      additionalProperties: false
      properties:
        entryId:
          type: string
          maxLength: 64
          description: The plan entry that was cooked, if it was planned.
        date:
          type: string
          format: date
        servings:
          type: integer
          minimum: 1
          maximum: 12
    RecipeSkippedPayload:
      type: object
      additionalProperties: false
      properties:
        entryId:
          type: string
          maxLength: 64
        date:
          type: string
          format: date
        reason:
          type: string
          enum: [no-time, ate-out, missing-ingredients, not-in-the-mood, other]
    GroceryItemCheckedPayload:
      type: object
      additionalProperties: false
      description: "`ingredientId` or `name` is required."
      required: [checked]
      properties:
        ingredientId:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 100
        checked:
          type: boolean
          description: False when the item was unchecked again.
    IngestEventsRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ClientEvent"
    IngestEventsResponse:
      type: object
      required: [accepted, duplicates, rejected]
      properties:
        accepted:
          type: integer
          description: Newly stored events.
        duplicates:
          type: integer
          description: Events whose `clientEventId` was already stored or repeated in the batch.
        rejected:
          type: array
          description: Invalid events, in batch order. Retrying them won't help.
          items:
            type: object
            required: [index, message]
            properties:
              index:
                type: integer
                description: Position in `events`.
              message:
                type: string
                example: "occurredAt must be within the last 30 days"
    Role:
      type: string
      enum: [admin, member]
      description: |
        A member's role. More roles (viewer, shopper, child, guest) may be
        added later; clients should rely on `permissions`, not the role name.
    Permission:
      type: string
      enum:
        - household.view
        - household.update
        - members.view
        - members.invite
        - members.remove
        - members.changeRole
        - plan.edit
        - pantry.edit
        - recipes.edit
        - recipes.import
        - shopping.edit
    Household:
      type: object
      required: [id, name, defaultServings, timeZone, orderDay, thawReminderHour, weekStartsOn, mealKit, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80913
        name:
          type: string
          maxLength: 100
          example: The Lines
        defaultServings:
          type: integer
          minimum: 1
          maximum: 12
          example: 2
        timeZone:
          type: string
          description: IANA time zone name. Plan dates are interpreted in it.
          example: America/Denver
        orderDay:
          type: [string, "null"]
          enum: [mon, tue, wed, thu, fri, sat, sun, null]
          description: The weekday the household means to place its grocery order; null until someone picks one, which leaves order reminders off.
          example: thu
        thawReminderHour:
          type: integer
          minimum: 0
          maximum: 23
          default: 6
          description: The local hour the household's thaw reminders go out. Always set; 6 for a household that never chose one.
          example: 6
        weekStartsOn:
          $ref: "#/components/schemas/WeekStartDay"
        mealKit:
          description: What the household spent on meal kits, compared with its weekly grocery cost; null until set.
          oneOf:
            - $ref: "#/components/schemas/MealKit"
            - type: "null"
        createdBy:
          type: string
          description: User ID of the member who created the household.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Membership:
      type: object
      required: [id, householdId, userId, role, permissions, createdAt, updatedAt]
      properties:
        id:
          type: string
        householdId:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Member:
      type: object
      required: [userId, displayName, role, joinedAt]
      properties:
        userId:
          type: string
        displayName:
          type: string
          description: May be empty when the user has no display name.
          example: Ada Lovelace
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
    CreateHouseholdRequest:
      type: object
      additionalProperties: false
      required: [name, timeZone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Leading and trailing whitespace is trimmed.
          example: The Lines
        timeZone:
          type: string
          description: IANA time zone name (not an offset, not "Local").
          example: America/Denver
        defaultServings:
          type: integer
          minimum: 1
          maximum: 12
          default: 2
        weekStartsOn:
          $ref: "#/components/schemas/WeekStartDay"
    UpdateHouseholdRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields sent are changed.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Leading and trailing whitespace is trimmed.
          example: The Lines
        timeZone:
          type: string
          description: IANA time zone name (not an offset, not "Local").
          example: America/Denver
        defaultServings:
          type: integer
          minimum: 1
          maximum: 12
          example: 2
        orderDay:
          type: string
          enum: [mon, tue, wed, thu, fri, sat, sun, ""]
          description: The weekday the household means to place its grocery order; `""` clears it, which leaves order reminders off.
          example: thu
        thawReminderHour:
          type: [integer, "null"]
          minimum: 0
          maximum: 23
          description: The local hour thaw reminders go out; null returns the household to the default hour of 6.
          example: 7
        weekStartsOn:
          $ref: "#/components/schemas/WeekStartDay"
        mealKit:
          description: The meal kit baseline to compare weekly grocery cost with; null clears it.
          oneOf:
            - $ref: "#/components/schemas/MealKit"
            - type: "null"
    WeekStartDay:
      type: string
      enum: [sun, mon, tue, wed, thu, fri, sat]
      default: sun
      description: >-
        The first day of the household's week. It decides which dates each week key covers: week `YYYY-Www`
        starts on the ISO week's Monday moved by 0 to +3 days (Monday to Thursday) or −3 to −1 days (Friday to
        Sunday), so Sunday-first 2026-W38 is Sep 13–19, 2026. Every `startDate`, `endDate`, `weekStart`,
        `weekEnd`, entry and slot `date`, `dueOn`, and "current week" follows it. New households default to
        `sun`; households created before the setting existed read `mon`.
      example: sun
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        timeZone:
          type: string
          example: Europe/Paris
        defaultServings:
          type: integer
          minimum: 1
          maximum: 12
        orderDay:
          type: string
          enum: [mon, tue, wed, thu, fri, sat, sun, ""]
          description: The grocery order day. An empty string clears it, turning order reminders off; omitting the field leaves it unchanged.
          example: thu
        weekStartsOn:
          allOf:
            - $ref: "#/components/schemas/WeekStartDay"
          description: >-
            Changes the first day of the week. Scheduled plan entries whose calendar date now falls in the
            neighboring week are moved into that week (same ID, day, and date; finalized weeks included), so no
            meal changes date. Reload plans, menus, and shopping weeks afterwards.
        mealKit:
          description: The meal kit baseline; null turns the comparison off, omitting it leaves it unchanged.
          oneOf:
            - $ref: "#/components/schemas/MealKit"
            - type: "null"
    CreateHouseholdResponse:
      type: object
      required: [household, membership]
      properties:
        household:
          $ref: "#/components/schemas/Household"
        membership:
          $ref: "#/components/schemas/Membership"
    HouseholdListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [household, role, permissions]
            properties:
              household:
                $ref: "#/components/schemas/Household"
              role:
                $ref: "#/components/schemas/Role"
              permissions:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
    HouseholdDetailResponse:
      type: object
      required: [household, role, permissions]
      properties:
        household:
          $ref: "#/components/schemas/Household"
        members:
          type: array
          description: Oldest member first. Omitted when the caller's role lacks `members.view`.
          items:
            $ref: "#/components/schemas/Member"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          description: What the caller may do in this household.
          items:
            $ref: "#/components/schemas/Permission"
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    Invitation:
      type: object
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          description: Trimmed and lowercased.
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time
          description: Seven days after creation.
        createdAt:
          type: string
          format: date-time
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: A bare address (no display name).
          example: bob@example.com
        role:
          $ref: "#/components/schemas/Role"
    CreateInvitationResponse:
      type: object
      required: [invitation, code, emailDelivered]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        code:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}$"
          description: |
            Invite code to share directly. Returned only in this response; it
            can't be retrieved later. The email contains the same code.
          example: 7K3QM-X9D2P
        emailDelivered:
          type: boolean
          description: False when the email could not be sent. The invitation and code still work.
    InvitationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `token` or `code`.
      properties:
        token:
          type: string
          maxLength: 256
          description: The token from the invitation link.
        code:
          type: string
          maxLength: 64
          description: The invite code. Case-insensitive; spaces and dashes are ignored.
          example: 7k3qm x9d2p
      oneOf:
        - required: [token]
        - required: [code]
    InvitationPreviewResponse:
      type: object
      required: [householdName, inviterName, role, expiresAt]
      properties:
        householdName:
          type: string
          example: The Lines
        inviterName:
          type: string
          description: The inviter's display name. Empty when they have none.
          example: Merrill Lines
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time
    AcceptInvitationResponse:
      type: object
      required: [household, role, permissions]
      properties:
        household:
          $ref: "#/components/schemas/Household"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          example:
            mongodb: ok
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          description: Configured application name (APP_NAME).
          example: DinnerOS
        version:
          type: string
          description: Deployed build identifier.
          example: 3f2c1ab

    AppleSignInRequest:
      type: object
      additionalProperties: false
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
          description: The `identityToken` from `ASAuthorizationAppleIDCredential`, as a UTF-8 string.
        nonce:
          type: string
          maxLength: 512
          description: The raw nonce the app generated. Apple's request must use its SHA-256 hex digest.
        fullName:
          type: string
          maxLength: 100
          description: |
            Display name formatted by the app. Apple provides it only on the
            first authorization; it is used only when a new user is created.
    GoogleSignInRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          description: The Google Sign-In ID token.
        nonce:
          type: string
          maxLength: 512
          description: Optional raw nonce passed to Google Sign-In. When present, the token's `nonce` claim must equal it.
    DevSignInRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          maxLength: 256
          description: Stable test identity; the same subject always signs in to the same user.
          example: simulator-ada
        email:
          type: string
          format: email
          example: ada@example.com
        displayName:
          type: string
          maxLength: 100
          example: Ada
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
          description: JWT bearer token for authenticated routes.
        accessTokenExpiresAt:
          type: string
          format: date-time
          example: "2026-09-14T18:45:00Z"
        refreshToken:
          type: string
          description: Opaque single-use token (43 base64url characters). Store in the Keychain.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Sliding expiry; each refresh extends it to 60 days from the refresh.
          example: "2026-11-13T18:30:00Z"
    SessionResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user, isNewUser]
          properties:
            user:
              $ref: "#/components/schemas/User"
            isNewUser:
              type: boolean
              description: True when this sign-in created the account.
    User:
      type: object
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80912
        displayName:
          type: string
          description: May be empty when no provider supplied a name.
          example: Ada Lovelace
        primaryEmail:
          type: string
          format: email
          description: Present only when a provider verified it. May be an Apple private relay address.
        createdAt:
          type: string
          format: date-time
    Identity:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [apple, google, dev]
        email:
          type: string
          format: email
          description: Verified email from this provider, if any.
    MeResponse:
      type: object
      required: [user, identities]
      properties:
        user:
          $ref: "#/components/schemas/User"
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
    IsoWeek:
      type: string
      pattern: "^[0-9]{4}-W[0-9]{2}$"
      description: >-
        A week key in ISO 8601 form. The week must exist in its year (52 or 53 weeks). The dates it covers
        follow the household's `weekStartsOn` (see WeekStartDay); with `mon` it is the ISO week itself.
      example: 2026-W38
    PlanDay:
      type: [string, "null"]
      enum: [mon, tue, wed, thu, fri, sat, sun, null]
      description: Day of the week, or null for "this week, not scheduled".
    PlanStatus:
      type: string
      enum: [draft, finalized]
      description: A finalized plan's entries are locked until it is set back to draft.
    Plan:
      type: object
      required: [householdId, week, startDate, endDate, status, entries, createdAt, updatedAt]
      properties:
        householdId:
          type: string
        week:
          $ref: "#/components/schemas/IsoWeek"
        startDate:
          type: string
          format: date
          description: The week's first day (the household's weekStartsOn).
          example: "2026-09-13"
        endDate:
          type: string
          format: date
          description: The week's last day.
          example: "2026-09-19"
        status:
          $ref: "#/components/schemas/PlanStatus"
        entries:
          type: array
          description: In the order they were added.
          items:
            $ref: "#/components/schemas/PlanEntry"
        createdAt:
          type: [string, "null"]
          format: date-time
          description: Null for a week nobody has planned.
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: Null for a week nobody has planned.
    MealCustomizations:
      type: object
      required: [recipeId, servings, groups]
      properties:
        recipeId:
          type: string
        servings:
          type: integer
          description: The serving size the amounts are for.
          example: 2
        groups:
          type: array
          description: One per customizable protein line, in recipe order. Empty when the recipe has none.
          items:
            $ref: "#/components/schemas/MealCustomizationGroup"
    MealCustomizationGroup:
      type: object
      required: [ingredientKey, ingredientName, amountText, quantity, unit, imageUrl, selectedChoiceId, choices]
      properties:
        ingredientKey:
          type: string
          description: The line's key, as on grocery items — a catalog ingredient ID or `name:<normalized name>`. Send it back in a selection.
          example: 66e5a1f2c3b4a5d6e7f80a20
        ingredientName:
          type: string
          example: Ground Pork
        amountText:
          type: string
          description: The recipe's amount for display.
          example: 10 ounce
        quantity:
          type: string
          description: The exact amount as `n` or `n/d`.
          example: "10"
        unit:
          type: string
          description: Unit code; always a weight.
          example: oz
        imageUrl:
          type: [string, "null"]
          description: The catalog ingredient's image, or null.
        selectedChoiceId:
          type: [string, "null"]
          description: The entry's current choice (`original` when it isn't customized) when `entryId` was given; null otherwise.
        choices:
          type: array
          description: The original first, then double, then each swap followed by its double.
          items:
            $ref: "#/components/schemas/MealCustomizationChoice"
    MealCustomizationChoice:
      type: object
      required: [id, label, ingredientName, amountText, quantity, unit, imageUrl, kind, badge]
      properties:
        id:
          type: string
          description: "`original`, `double`, `swap:<proteinId>`, or `swap:<proteinId>:double`."
          example: swap:ground-beef:double
        label:
          type: string
          example: 2x Ground Beef
        ingredientName:
          type: string
          example: Ground Beef
        amountText:
          type: string
          example: 20 ounce
        quantity:
          type: string
          example: "20"
        unit:
          type: string
          example: oz
        imageUrl:
          type: [string, "null"]
        kind:
          type: string
          enum: [original, double, swap, swap_double]
        badge:
          type: [string, "null"]
          description: "`Double portion` on doubled choices, otherwise null."
    SetMealCustomizationRequest:
      type: object
      required: [selections]
      additionalProperties: false
      properties:
        selections:
          type: array
          description: Replaces the entry's customizations. An empty array resets the meal.
          maxItems: 20
          items:
            type: object
            required: [ingredientKey, choiceId]
            additionalProperties: false
            properties:
              ingredientKey:
                type: string
                description: A group's `ingredientKey` for this meal.
              choiceId:
                type: string
                description: One of that group's choice IDs. `original` stores nothing.
    PlanEntryCustomization:
      type: object
      required: [ingredientKey, choiceId, label]
      properties:
        ingredientKey:
          type: string
        choiceId:
          type: string
          example: swap:ground-beef
        label:
          type: string
          description: The choice's label when it was chosen.
          example: Ground Beef
    PlanEntry:
      type: object
      required: [id, recipe, day, date, servings, note, addedBy, addedAt, origin]
      properties:
        id:
          type: string
          example: 66e5a1f2c3b4a5d6e7f80c01
        recipe:
          type: object
          description: Snapshot taken when the entry was added. Load the recipe for details.
          required: [id, name, isAddon]
          properties:
            id:
              type: string
            name:
              type: string
              example: Beef Tacos
            isAddon:
              type: boolean
              description: |
                True for a pairing's add-on (garlic bread alongside the pasta),
                which is planned with a meal and never counted as one. False
                for entries added before add-ons were marked.
            imageUrl:
              type: string
        day:
          $ref: "#/components/schemas/PlanDay"
        date:
          type: [string, "null"]
          format: date
          description: The date of `day`, or null when unscheduled.
          example: "2026-09-15"
        servings:
          type: integer
          minimum: 1
          example: 2
        note:
          type: string
          maxLength: 500
        addedBy:
          type: string
          description: User ID of the member who added the entry.
        addedAt:
          type: string
          format: date-time
        origin:
          type: string
          enum: [manual, autopilot]
          description: "`autopilot` for entries added by accepting an Autopilot proposal; otherwise `manual`."
        customizations:
          type: array
          description: |
            The meal's protein customizations, omitted when the meal is cooked
            as written. See the customization endpoints.
          items:
            $ref: "#/components/schemas/PlanEntryCustomization"
    AddPlanEntryRequest:
      type: object
      required: [recipeId, servings]
      additionalProperties: false
      properties:
        recipeId:
          type: string
          description: A recipe in this household.
        day:
          $ref: "#/components/schemas/PlanDay"
        servings:
          type: integer
          description: One of the recipe's `servings`.
          example: 2
        note:
          type: string
          maxLength: 500
    AddPlanEntryResponse:
      type: object
      required: [entry, plan]
      properties:
        entry:
          $ref: "#/components/schemas/PlanEntry"
        plan:
          $ref: "#/components/schemas/Plan"
    UpdatePlanEntryRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        day:
          $ref: "#/components/schemas/PlanDay"
        servings:
          type: integer
          description: One of the recipe's `servings`.
        note:
          type: string
          maxLength: 500
    SetPlanStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/PlanStatus"
    PlanSummary:
      type: object
      required: [week, startDate, status, entryCount, updatedAt]
      properties:
        week:
          $ref: "#/components/schemas/IsoWeek"
        startDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/PlanStatus"
        entryCount:
          type: integer
          minimum: 0
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: Null for a week nobody has planned.
    PlanListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanSummary"
    GroceryList:
      type: object
      required: [week, status, pantryApplied, specialtiesApplied, categories, batches, skipped, skippedItems]
      properties:
        week:
          $ref: "#/components/schemas/IsoWeek"
        status:
          $ref: "#/components/schemas/PlanStatus"
        pantryApplied:
          type: boolean
          description: True when the household pantry decided item statuses.
        specialtiesApplied:
          type: boolean
          description: True when the household's specialty ingredient choices were applied.
        batches:
          type: array
          description: The house-made specialty ingredients the week uses.
          items:
            $ref: "#/components/schemas/GroceryBatch"
        categories:
          type: array
          description: In aisle order; empty categories are omitted.
          items:
            $ref: "#/components/schemas/GroceryCategory"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SkippedPlanEntry"
        skippedItems:
          type: array
          description: |
            The ingredients the household chose not to buy. They are not in
            `categories`, so nothing asks anyone to buy them, but each is a
            full grocery item carrying `skipScope` and `skipText`. Not to be
            confused with `skipped`, which is about plan entries.
          items:
            $ref: "#/components/schemas/GroceryItem"
    GrocerySkipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GrocerySkip"
    GrocerySkipScope:
      type: string
      enum: [week, always]
      description: |
        How long a skip lasts. `week` leaves the ingredient off one week's list
        and ends on its own the following week. `always` leaves it off every
        list until someone resumes it.
    GrocerySkip:
      type: object
      required: [id, ingredientKey, key, name, scope, week, text, createdBy, createdAt, updatedBy, updatedAt]
      properties:
        id:
          type: string
        ingredientKey:
          type: string
          description: The catalog ingredient ID, or `name:<normalized name>`, as the grocery line gave it.
        key:
          type: string
          description: The normalized name the skip also matches.
          example: cilantro
        name:
          type: string
          example: Cilantro
        scope:
          $ref: "#/components/schemas/GrocerySkipScope"
        week:
          description: The ISO week a week-scoped skip covers, and null when the scope is always.
          oneOf:
            - $ref: "#/components/schemas/IsoWeek"
            - type: "null"
        text:
          type: string
          description: What the skip does, in the words the app shows.
          example: Never buying this
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    GrocerySkipRequest:
      type: object
      required: [ingredientKey, scope]
      properties:
        ingredientKey:
          type: string
          description: The grocery line's key, as the list gave it.
          example: name:cilantro
        name:
          type: string
          description: |
            What to show on the review screen. Required unless `ingredientKey`
            is a `name:` key, which already carries a name.
          example: Cilantro
        scope:
          $ref: "#/components/schemas/GrocerySkipScope"
        week:
          description: Required when the scope is week, and rejected when it is always.
          oneOf:
            - $ref: "#/components/schemas/IsoWeek"
            - type: "null"
    GroceryCategory:
      type: object
      required: [category, items]
      properties:
        category:
          type: string
          enum: [produce, meat-seafood, dairy-eggs, bakery, deli, pantry, spices, condiments, frozen, beverages, other]
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroceryItem"
    GroceryItem:
      type: object
      required: [ingredientKey, name, amounts, quantityText, unquantified, status, recipes, specialty, specialtyDetail, via, extras]
      properties:
        ingredientKey:
          type: string
          description: The catalog ingredient ID, or `name:<normalized name>` for uncatalogued lines.
        name:
          type: string
          example: Yellow Onion
        amounts:
          type: array
          description: One amount per group of units that combine. A count and a weight stay separate.
          items:
            $ref: "#/components/schemas/GroceryAmount"
        quantityText:
          type: string
          description: The amounts' texts joined with " + ". Empty when no recipe gave an amount.
          example: 1 ½ + 8 oz
        unquantified:
          type: boolean
          description: At least one recipe gave no amount ("salt to taste").
        status:
          type: string
          enum: [toBuy, inPantry, pantryHint, fromFreezer, skipped]
          description: |
            `inPantry`: in stock in the household pantry. `toBuy`: not at home,
            including anything the pantry marks as low or out. `pantryHint`:
            every recipe marks it as a staple and the pantry doesn't list it.
            `fromFreezer`: a frozen pantry item covers it. The line stays on
            the list, de-emphasized and with a "Grab from the freezer" note,
            so the household is told to fetch it rather than having it
            silently disappear, and no handoff buys it again. `skipped`: the
            household chose not to buy it, and the item is in `skippedItems`
            rather than in `categories`.
        recipes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        specialty:
          type: boolean
          description: The item is a specialty ingredient by its own name (no choice, `as_is`, or a batch in the pantry).
        specialtyDetail:
          oneOf:
            - $ref: "#/components/schemas/GrocerySpecialty"
            - type: "null"
        via:
          type: array
          description: The specialty ingredients this item stands in for. Empty for ordinary items.
          items:
            $ref: "#/components/schemas/GroceryVia"
        extras:
          type: array
          description: What put the item on the list besides a recipe. Empty for ordinary items.
          items:
            type: object
            required: [id, origin, text]
            properties:
              id:
                type: string
                description: Identifies the extra where it is stored, so it can be removed.
              origin:
                type: string
                enum: [pairing]
                description: "`pairing`: an accepted Autopilot pairing (docs/autopilot.md#add-on-pairings)."
              text:
                type: string
                example: Club crackers for Chicken Noodle Soup
        skipScope:
          $ref: "#/components/schemas/GrocerySkipScope"
        skipText:
          type: string
          description: |
            What the skip does, in the words the app shows. Present only on an
            item in `skippedItems`, alongside `skipScope`; both are absent on
            every item that is actually on the list.
          example: Never buying this
    GroceryAmount:
      type: object
      required: [quantity, quantityValue, unit, text]
      properties:
        quantity:
          type: string
          description: Exact amount as "n" or "n/d".
          example: "3/2"
        quantityValue:
          type: number
          description: The same amount as a number, for display only.
          example: 1.5
        unit:
          type: string
          description: DinnerOS unit code.
          example: count
        text:
          type: string
          example: 1 ½
    SkippedPlanEntry:
      type: object
      required: [entryId, recipeId, recipeName, reason]
      properties:
        entryId:
          type: string
        recipeId:
          type: string
        recipeName:
          type: string
        reason:
          type: string
          enum: [recipeUnavailable, servingsUnavailable]
          description: |
            `recipeUnavailable`: the recipe is no longer in the household.
            `servingsUnavailable`: the recipe no longer offers the entry's serving size.
    ThawDue:
      type: object
      required: [date, reminderHour, items]
      properties:
        date:
          type: string
          format: date
          description: Today in the household's time zone.
          example: 2026-09-21
        reminderHour:
          type: integer
          minimum: 0
          maximum: 23
          description: The household's `thawReminderHour`.
          example: 6
        items:
          type: array
          description: Never null; empty means nothing frozen is needed today.
          items:
            $ref: "#/components/schemas/ThawDueItem"
    ThawDueItem:
      type: object
      required: [itemId, name, recipes, hours, measured, moveBy, overnight, summary]
      properties:
        itemId:
          type: string
          description: The frozen pantry item.
        name:
          type: string
          example: Chicken Thighs
        recipes:
          type: array
          description: The meals planned today that need it, by name. Never null.
          items:
            type: string
          example: [Sheet Pan Chicken and Peppers]
        hours:
          type: integer
          minimum: 2
          maximum: 48
          description: The fridge thaw estimate for one portion.
          example: 5
        measured:
          type: boolean
          description: False when `hours` is the category default rather than a weight calculation.
        moveBy:
          type: string
          description: The local time to move it to the fridge, as `HH:MM`.
          example: "13:00"
        overnight:
          type: boolean
          description: True when `moveBy` has already passed today, so the honest advice is "move it now".
        summary:
          type: string
          example: about 5 hours
    GroceryCategoryName:
      type: string
      enum: [produce, meat-seafood, dairy-eggs, bakery, deli, pantry, spices, condiments, frozen, beverages, other]
    PantryStatus:
      type: string
      enum: [in_stock, low, out]
      description: |
        `in_stock`: grocery lists show the ingredient as `inPantry`. `low`
        and `out`: always `toBuy`, even for a staple.
    PantryStorage:
      type: string
      enum: [pantry, freezer]
      description: |
        Where the item is kept. `pantry` is the shelf, and is also what every
        item stored before the freezer existed reads as. `freezer`: sealed
        stock that has to be thawed before it is cooked
        (docs/pantry-usage.md#the-freezer).
      example: freezer
    PantryItem:
      type: object
      required: [id, householdId, ingredientId, key, displayName, category, quantity, quantityValue, unit, status, isStaple, expiresOn, note, storage, frozen, statusSource, lowThresholdPercent, unitSize, estimate, updatedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        householdId:
          type: string
        ingredientId:
          type: [string, "null"]
          description: The catalog ingredient; null for free text that matched no catalog ingredient.
        key:
          type: string
          description: The normalized ingredient name, unique within the household (the catalog key when linked).
          example: olive oil
        displayName:
          type: string
          example: Olive Oil
        category:
          $ref: "#/components/schemas/GroceryCategoryName"
        quantity:
          type: [string, "null"]
          description: Exact amount as "n" or "n/d"; null when no amount was recorded ("have some").
          example: "3/2"
        quantityValue:
          type: [number, "null"]
          description: The same amount as a number, for display only.
          example: 1.5
        unit:
          type: [string, "null"]
          description: DinnerOS unit code; null exactly when quantity is null.
          example: cup
        status:
          $ref: "#/components/schemas/PantryStatus"
        isStaple:
          type: boolean
          description: An always-have item such as salt or oil.
        expiresOn:
          type: [string, "null"]
          format: date
        note:
          type: string
        storage:
          $ref: "#/components/schemas/PantryStorage"
        frozen:
          description: How the item was sealed and how long it takes to thaw; null for a shelf item.
          oneOf:
            - $ref: "#/components/schemas/PantryFrozen"
            - type: "null"
        statusSource:
          $ref: "#/components/schemas/PantryStatusSource"
        lowThresholdPercent:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: The item's own low-stock threshold; null uses the household's.
        unitSize:
          oneOf:
            - $ref: "#/components/schemas/PantryUnitSize"
            - type: "null"
        estimate:
          oneOf:
            - $ref: "#/components/schemas/PantryEstimate"
            - type: "null"
          description: The usage estimate; null when no amount is recorded.
        updatedBy:
          type: string
          description: User ID of the last change by a person.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PantryFrozen:
      type: object
      description: A freezer item, with when it went in, how it was portioned, and the thaw estimate for one portion.
      required: [frozenOn, portions, thaw]
      properties:
        frozenOn:
          type: [string, "null"]
          format: date
          description: The day it was sealed; null for an item frozen before the date was recorded.
          example: 2026-09-17
        portions:
          type: integer
          minimum: 1
          description: How many sealed portions the amount was split into.
          example: 2
        thaw:
          $ref: "#/components/schemas/PantryThaw"
    PantryThaw:
      type: object
      description: |
        How long one portion takes to thaw in the fridge: about 5 hours per
        pound of frozen protein, 2 for bread, deli and dairy, rounded to whole
        hours and kept between 2 and 48.
      required: [hours, measured, portionOunces, summary]
      properties:
        hours:
          type: integer
          minimum: 2
          maximum: 48
          example: 5
        measured:
          type: boolean
          description: False when the amount isn't a weight and `hours` is the 8-hour default rather than a calculation.
        portionOunces:
          type: [number, "null"]
          description: The weight of one portion the estimate used; null when unmeasured.
          example: 16
        summary:
          type: string
          example: about 5 hours
    PantryItemListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PantryItem"
    AddPantryItemRequest:
      type: object
      description: Either `ingredientId` or `name` is required.
      properties:
        ingredientId:
          type: string
          description: A catalog ingredient ID from GET /api/v1/ingredients.
        name:
          type: string
          maxLength: 100
          description: Display name. Defaults to the catalog name when `ingredientId` is given.
        category:
          $ref: "#/components/schemas/GroceryCategoryName"
        quantity:
          type: string
          maxLength: 32
          description: A positive amount such as `2`, `0.5`, `1/2`, `1 1/2`, or `½`. Omit for "have some".
          example: 1 1/2
        unit:
          type: string
          description: DinnerOS unit code (docs/grocery-engine.md#units). Defaults to `count` when `quantity` is given; requires `quantity`.
          example: cup
        status:
          $ref: "#/components/schemas/PantryStatus"
        isStaple:
          type: boolean
        expiresOn:
          type: string
          format: date
        note:
          type: string
          maxLength: 500
    UpdatePantryItemRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 100
        category:
          $ref: "#/components/schemas/GroceryCategoryName"
        quantity:
          type: [string, "null"]
          description: A positive amount; null or "" clears the amount and unit.
        unit:
          type: [string, "null"]
          description: DinnerOS unit code for the current or new quantity.
        status:
          $ref: "#/components/schemas/PantryStatus"
        isStaple:
          type: boolean
        expiresOn:
          type: [string, "null"]
          format: date
        note:
          type: [string, "null"]
          maxLength: 500
        lowThresholdPercent:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: The item's own low-stock threshold; null returns it to the household's.
    FreezePantryItemRequest:
      type: object
      description: Either `ingredientId` or `name` is required.
      required: [quantity, unit]
      properties:
        ingredientId:
          type: string
          description: A catalog ingredient ID from GET /api/v1/ingredients.
        name:
          type: string
          maxLength: 100
          description: Display name. Defaults to the catalog name when `ingredientId` is given.
          example: Chicken Thighs
        quantity:
          type: string
          maxLength: 32
          description: The amount actually sealed, such as `2`, `0.5`, or `1 1/2`. The real remainder, not the package size.
          example: "32"
        unit:
          type: string
          description: DinnerOS unit code for `quantity` (docs/grocery-engine.md#units).
          example: oz
        portions:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: How many sealed portions it was split into; one portion at a time is what the thaw estimate weighs.
          example: 2
        note:
          type: string
          maxLength: 500
          example: Two flat bags, labelled
        source:
          description: |
            The handoff line the remainder came from. Sending it makes the
            freeze idempotent: the same line twice changes nothing.
          type: object
          required: [provider, handoffId, lineId]
          properties:
            provider:
              type: string
              example: walmart
            handoffId:
              type: string
              example: 66e5a1f2c3b4a5d6e7f81204
            lineId:
              type: string
              description: The line's ID within the handoff.
              example: l3
    FreezePantryItemResponse:
      type: object
      required: [item, alreadyFrozen, thaw]
      properties:
        item:
          $ref: "#/components/schemas/PantryItem"
        alreadyFrozen:
          type: boolean
          description: True when this handoff line had been sealed before and nothing changed.
        thaw:
          $ref: "#/components/schemas/PantryThaw"
    BulkPantryStatusRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [id, status]
            properties:
              id:
                type: string
              status:
                $ref: "#/components/schemas/PantryStatus"
    BulkPantryStatusResponse:
      type: object
      required: [items, missing]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PantryItem"
        missing:
          type: array
          description: Requested IDs that aren't in the household's pantry.
          items:
            type: string
    DefaultStaplesResponse:
      type: object
      required: [items, skipped]
      properties:
        items:
          type: array
          description: The staples added.
          items:
            $ref: "#/components/schemas/PantryItem"
        skipped:
          type: integer
          description: Default staples the pantry already had.
    PantryStatusSource:
      type: string
      enum: [person, estimate]
      description: "`estimate` when the usage estimate marked the item low; `person` otherwise."
    PantryAmount:
      type: object
      required: [quantity, quantityValue]
      properties:
        quantity:
          type: string
          description: Exact amount as "n" or "n/d".
          example: "5"
        quantityValue:
          type: number
          description: The same amount as a number, for display only.
          example: 5
    PantryUnitSize:
      type: object
      description: One `per` unit holds `quantity` `unit` ("1 count = 1/2 cup").
      required: [per, quantity, quantityValue, unit]
      properties:
        per:
          type: string
          description: A discrete unit code (count, package, can, …).
          example: count
        quantity:
          type: string
          example: "1/2"
        quantityValue:
          type: number
          example: 0.5
        unit:
          type: string
          description: A volume or weight unit code.
          example: cup
    PantryEstimate:
      type: object
      description: |
        The estimated amount left (docs/pantry-usage.md). Every amount is in
        `unit`. `remaining` and `otherUse` are rounded to hundredths and
        `dailyRate` to thousandths; `startAmount` and `recipeUse` are exact.
      required: [cycleId, cycleSource, cycleStartedAt, adjustedAt, unit, startAmount, remaining, percentRemaining, percentUsed, recipeUse, otherUse, dailyRate, skippedRecipes, lowThresholdPercent, thresholdSource, belowThreshold, summary, estimatedAt]
      properties:
        cycleId:
          type: string
          description: The purchase ID that started the cycle, or a generated ID when a person set the amount.
        cycleSource:
          type: string
          enum: [grocery_list, manual, provider, edit, house_made]
        cycleStartedAt:
          type: string
          format: date-time
        adjustedAt:
          type: [string, "null"]
          format: date-time
          description: When a person last corrected the amount in this cycle.
        unit:
          type: string
          example: tbsp
        startAmount:
          $ref: "#/components/schemas/PantryAmount"
        remaining:
          $ref: "#/components/schemas/PantryAmount"
        percentRemaining:
          type: integer
          minimum: 0
          maximum: 100
          example: 31
        percentUsed:
          type: integer
          minimum: 0
          maximum: 100
          example: 69
        recipeUse:
          type: object
          required: [count, quantity, quantityValue]
          description: Cooked recipes deducted this cycle.
          properties:
            count:
              type: integer
              example: 2
            quantity:
              type: string
              example: "6"
            quantityValue:
              type: number
              example: 6
        otherUse:
          $ref: "#/components/schemas/PantryAmount"
        dailyRate:
          type: [object, "null"]
          description: Learned non-recipe use per day; null until at least 2 usage periods are known.
          required: [quantity, quantityValue, basedOnSegments]
          properties:
            quantity:
              type: string
              example: "1"
            quantityValue:
              type: number
              example: 1
            basedOnSegments:
              type: integer
              example: 3
        skippedRecipes:
          type: integer
          description: Cooked recipes that used the item but couldn't be deducted (no amount, or units that don't convert).
        lowThresholdPercent:
          type: integer
          description: The threshold in effect.
          example: 80
        thresholdSource:
          type: string
          enum: [item, household]
        belowThreshold:
          type: boolean
          description: At least `lowThresholdPercent` of `startAmount` is used.
        summary:
          type: string
          example: "About 31% left: 2 recipes used 6 tbsp, plus about 1 tbsp a day of other use."
        estimatedAt:
          type: string
          format: date-time
    RecordPantryPurchaseRequest:
      type: object
      description: "`itemId`, or `ingredientId` or `name`, identifies the item (not both)."
      required: [source]
      properties:
        itemId:
          type: string
          description: A pantry item (restocking from the Pantry tab).
        ingredientId:
          type: string
          description: A catalog ingredient (a checked-off grocery line).
        name:
          type: string
          maxLength: 100
          description: A free-text ingredient (an uncatalogued grocery line).
        source:
          type: string
          enum: [grocery_list, manual]
        quantity:
          type: string
          maxLength: 32
          description: A positive amount; omit when unknown (the item won't be tracked).
          example: "4"
        unit:
          type: string
          description: DinnerOS unit code; defaults to `count` when `quantity` is given.
          example: count
        unitSize:
          type: object
          description: How much one `unit` holds; only for a discrete `unit`.
          required: [quantity, unit]
          properties:
            quantity:
              type: string
              example: "1/2"
            unit:
              type: string
              description: A volume or weight unit code.
              example: cup
        week:
          $ref: "#/components/schemas/IsoWeek"
        clientPurchaseId:
          type: string
          maxLength: 64
          description: Idempotency key, unique per member.
        priceCents:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Optional. What the whole purchase cost, in US cents.
    PantryPurchase:
      type: object
      required: [id, householdId, itemId, source, quantity, quantityValue, unit, unitSize, week, clientPurchaseId, provider, priceCents, recordedBy, purchasedAt]
      properties:
        id:
          type: string
          description: Also the ID of the usage cycle it started.
        householdId:
          type: string
        itemId:
          type: string
        source:
          type: string
          enum: [grocery_list, manual, provider, house_made]
          description: |
            `house_made` is a batch recorded through POST .../specialty-ingredients/{specialtyId}/batches.
            `provider` is an order confirmed through POST .../shopping/handoffs/{handoffId}/confirm.
        quantity:
          type: [string, "null"]
        quantityValue:
          type: [number, "null"]
        unit:
          type: [string, "null"]
        unitSize:
          oneOf:
            - $ref: "#/components/schemas/PantryUnitSize"
            - type: "null"
        week:
          type: [string, "null"]
        clientPurchaseId:
          type: [string, "null"]
        provider:
          description: The handoff line a `provider` purchase confirms; null for every other source.
          oneOf:
            - $ref: "#/components/schemas/PantryPurchaseProvider"
            - type: "null"
        priceCents:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
          description: What the whole purchase cost, in US cents; null when nobody entered a price.
        recordedBy:
          type: string
        purchasedAt:
          type: string
          format: date-time
    RecordPantryPurchaseResponse:
      type: object
      required: [purchase, item]
      properties:
        purchase:
          $ref: "#/components/schemas/PantryPurchase"
        item:
          $ref: "#/components/schemas/PantryItem"
    PantryPurchaseListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PantryPurchase"
    PantrySettings:
      type: object
      required: [lowThresholdPercent, defaultLowThresholdPercent, updatedBy, updatedAt]
      properties:
        lowThresholdPercent:
          type: integer
          minimum: 1
          maximum: 100
          description: Percent of an item's starting amount used before the estimate marks it low.
          example: 80
        defaultLowThresholdPercent:
          type: integer
          example: 80
        updatedBy:
          type: [string, "null"]
          description: Null until someone changes the defaults.
        updatedAt:
          type: [string, "null"]
          format: date-time
    UpdatePantrySettingsRequest:
      type: object
      required: [lowThresholdPercent]
      properties:
        lowThresholdPercent:
          type: integer
          minimum: 1
          maximum: 100
    Notification:
      type: object
      required: [id, householdId, type, title, body, subject, read, createdAt]
      properties:
        id:
          type: string
        householdId:
          type: string
        type:
          type: string
          description: Stable type. `pantry.low` and `shopping.order_due` exist today; show unknown types by title and body.
          example: pantry.low
        title:
          type: string
          example: Butter is running low
        body:
          type: string
          example: "About 19% left: 4 recipes used 0.81 cup."
        subject:
          type: object
          required: [kind, id]
          description: What to open. `pantry_item` is a pantry item ID; `shopping_week` is an ISO week to open in Shop.
          properties:
            kind:
              type: string
              example: pantry_item
            id:
              type: string
        read:
          type: boolean
          description: Whether the caller has read it.
        createdAt:
          type: string
          format: date-time
    NotificationListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: [string, "null"]
          description: Pass as `before` for the next page; null on the last page.
    NotificationUnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
    PushEnvironment:
      type: string
      enum: [sandbox, production]
      description: |
        The APNs gateway the token belongs to: `sandbox` for Xcode debug
        builds, `production` for TestFlight and App Store builds.
    RegisterDeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [token, environment]
      properties:
        token:
          type: string
          pattern: "^[0-9a-fA-F]{16,400}$"
          description: The APNs device token as hex (stored lowercase).
        environment:
          $ref: "#/components/schemas/PushEnvironment"
        platform:
          type: string
          enum: [ios]
          default: ios
    DeleteDeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: "^[0-9a-fA-F]{16,400}$"
    DeviceToken:
      type: object
      required: [token, environment, platform, createdAt, updatedAt]
      properties:
        token:
          type: string
        environment:
          $ref: "#/components/schemas/PushEnvironment"
        platform:
          type: string
          enum: [ios]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MarkNotificationsReadRequest:
      type: object
      description: "Send `ids`, or `all: true`."
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        all:
          type: boolean
    CatalogIngredient:
      type: object
      required: [id, key, name, category, categoryConfident]
      properties:
        id:
          type: string
        key:
          type: string
          example: olive oil
        name:
          type: string
          example: Olive Oil
        category:
          $ref: "#/components/schemas/GroceryCategoryName"
        categoryConfident:
          type: boolean
          description: False when no category rule matched and the category is a placeholder (`other`).
        imageUrl:
          type: string
    IngredientSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogIngredient"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: not_found
            message:
              type: string
              description: Human-readable description. Not stable; do not parse.
              example: resource not found
            requestId:
              type: string
              description: Matches the X-Request-ID response header; quote it when reporting problems.
              example: 5f0c1e9a2b7d4c3e8f6a1b2c
    GrocerySpecialty:
      type: object
      required: [id, key, name, choiceType, optionId, houseMade, suggestedOptions, text]
      properties:
        id:
          type: string
          example: sweet-soy-glaze
        key:
          type: string
        name:
          type: string
        choiceType:
          type: [string, "null"]
          enum: [as_is, house_made_batch, null]
          description: Null when the household hasn't chosen; `house_made_batch` when a pantry batch covers the week.
        optionId:
          type: [string, "null"]
        houseMade:
          type: boolean
          description: Covered by a house-made batch in the pantry ("In pantry (house-made)").
        suggestedOptions:
          type: array
          description: Options to offer when the household hasn't chosen, the default first.
          items:
            type: object
            required: [id, type, name, isDefault]
            properties:
              id:
                type: string
              type:
                type: string
                enum: [store_alternative, house_made_batch]
              name:
                type: string
              isDefault:
                type: boolean
        text:
          type: string
          example: "Specialty ingredient: choose a store alternative or a house-made batch"
    GroceryVia:
      type: object
      required: [kind, specialtyId, specialtyKey, specialtyName, optionId, optionName, strategy, yield, batches, recipes, text]
      properties:
        kind:
          type: string
          enum: [store_alternative, house_made_batch, customized]
          description: |
            `customized` marks a line a member customized: `specialtyName` is
            the recipe's original ingredient, `optionId` the choice, and
            `optionName` its label. `specialtyId` is then empty.
        specialtyId:
          type: string
        specialtyKey:
          type: string
        specialtyName:
          type: string
          example: Tex-Mex Paste
        optionId:
          type: string
        optionName:
          type: string
        strategy:
          type: string
          enum: ["", similar, closest]
          description: |
            The household strategy that picked the option, empty when a member
            chose it explicitly. When set, `text` says so ("Store alternative
            for Tex-Mex Paste in Smoky Pork Tacos (your default)").
        yield:
          description: What one batch makes; null for a store alternative.
          oneOf:
            - $ref: "#/components/schemas/GroceryAmount"
            - type: "null"
        batches:
          type: [integer, "null"]
          description: Batches the list asks for; null for a store alternative.
        recipes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        text:
          type: string
          example: for Tex-Mex Paste in Smoky Pork Tacos
    GroceryBatch:
      type: object
      required: [specialtyId, specialtyKey, specialtyName, optionId, optionName, yield, status, reason, batches, pantryItemId, remaining, needed, recipes, text]
      properties:
        specialtyId:
          type: string
        specialtyKey:
          type: string
        specialtyName:
          type: string
        optionId:
          type: string
        optionName:
          type: string
        yield:
          $ref: "#/components/schemas/GroceryAmount"
        status:
          type: string
          enum: [inPantry, make]
        reason:
          type: string
          enum: [enough, inStock, notEnough, low, out, missing]
          description: |
            `enough`: in stock and the estimate covers the week. `inStock`: in
            stock but amounts can't be compared. `notEnough`, `low`, `out`,
            `missing`: the list asks for `batches` batches' ingredients.
        batches:
          type: integer
          minimum: 0
          description: Batches to make; 0 when in the pantry.
        pantryItemId:
          type: [string, "null"]
        remaining:
          description: The pantry estimate, or null when untracked or missing.
          oneOf:
            - $ref: "#/components/schemas/GroceryAmount"
            - type: "null"
        needed:
          description: The week's total in the yield's unit, or null when a recipe gives no amount or units don't convert.
          oneOf:
            - $ref: "#/components/schemas/GroceryAmount"
            - type: "null"
        recipes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        text:
          type: string
          example: Make a batch (makes about 12 tbsp)
    SpecialtyAmount:
      type: object
      required: [quantity, quantityValue, unit, text]
      properties:
        quantity:
          type: string
          example: "12"
        quantityValue:
          type: number
          example: 12
        unit:
          type: string
          example: tbsp
        text:
          type: string
          example: 12 tbsp
    SpecialtyOption:
      type: object
      required: [id, specialtyId, source, type, name, notes, isDefault, per, ingredients, steps, yield, shelfLifeDays, basedOnOptionId, summary, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: A slug for curated options (`southwest-spice-blend.batch`), an ObjectID for household options.
        specialtyId:
          type: string
        source:
          type: string
          enum: [curated, household]
        type:
          type: string
          enum: [store_alternative, house_made_batch]
        name:
          type: string
          example: Southwest spice blend (house blend)
        notes:
          type: string
        isDefault:
          type: boolean
        per:
          description: "Store alternatives: `per` of the specialty ingredient is `ingredients`."
          oneOf:
            - $ref: "#/components/schemas/SpecialtyAmount"
            - type: "null"
        ingredients:
          type: array
          description: Per `per` for a store alternative, or for one batch.
          items:
            type: object
            required: [name, quantity, quantityValue, unit, text, category]
            properties:
              name:
                type: string
              quantity:
                type: [string, "null"]
                description: Null for "to taste".
              quantityValue:
                type: [number, "null"]
              unit:
                type: [string, "null"]
              text:
                type: string
                example: 3 tbsp Chili Powder
              category:
                type: [string, "null"]
        steps:
          type: array
          items:
            type: string
        yield:
          oneOf:
            - $ref: "#/components/schemas/SpecialtyAmount"
            - type: "null"
        shelfLifeDays:
          type: [integer, "null"]
        basedOnOptionId:
          type: [string, "null"]
        summary:
          type: string
          example: Makes about 12 tbsp and keeps 180 days.
        createdBy:
          type: [string, "null"]
        updatedBy:
          type: [string, "null"]
        createdAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: [string, "null"]
          format: date-time
    SpecialtyIngredient:
      type: object
      required: [id, key, name, aliases, category, note, ingredientIds, recipeCount, unitSizes, defaultOptionId, retired, choiceSource, choice, options, batch]
      properties:
        id:
          type: string
          example: southwest-spice-blend
        key:
          type: string
          description: The normalized name; also the batch's pantry item key.
          example: southwest spice blend
        name:
          type: string
          example: Southwest Spice Blend
        aliases:
          type: array
          items:
            type: string
        category:
          type: string
        note:
          type: string
          description: |
            A short shopping note for the app, empty for most. It flags the
            specialty ingredients whose store route needs a caveat ("bottled
            ponzu is in the Asian aisle") or that have no honest store
            equivalent.
          example: ""
        ingredientIds:
          type: array
          description: Catalog ingredients that are this specialty ingredient.
          items:
            type: string
        recipeCount:
          type: integer
          description: The household's recipes that use it.
        unitSizes:
          type: array
          description: Estimated packet sizes, so recipes that count packets convert.
          items:
            type: object
            required: [per, quantity, quantityValue, unit, text]
            properties:
              per:
                type: string
                example: count
              quantity:
                type: string
              quantityValue:
                type: number
              unit:
                type: string
              text:
                type: string
        defaultOptionId:
          type: string
        retired:
          type: boolean
        choiceSource:
          type: string
          enum: [household, strategy, none]
          description: |
            Where the current plan comes from: `household` (a member chose it,
            including `as_is`), `strategy` (the household's standing strategy
            picked it, and a member can still override it), or `none` (nothing
            applies, so `choice` is null and the ingredient stays on the list).
        choice:
          description: |
            What currently applies, whoever decided it. Null when
            `choiceSource` is `none`.
          oneOf:
            - type: object
              required: [source, optionId, type, optionName, strategy, chosenBy, chosenAt]
              properties:
                source:
                  type: string
                  enum: [household, strategy]
                optionId:
                  type: string
                type:
                  type: string
                  enum: [as_is, store_alternative, house_made_batch]
                optionName:
                  type: [string, "null"]
                strategy:
                  description: The strategy that picked it; null when a member chose it.
                  oneOf:
                    - type: string
                      enum: [similar, closest]
                    - type: "null"
                chosenBy:
                  description: Null for a strategy, which nobody chose.
                  type: [string, "null"]
                chosenAt:
                  type: [string, "null"]
                  format: date-time
            - type: "null"
        options:
          type: array
          items:
            $ref: "#/components/schemas/SpecialtyOption"
        batch:
          description: The batch item in the pantry, or null.
          oneOf:
            - type: object
              required: [pantryItemId, status, remaining, percentRemaining, expiresOn]
              properties:
                pantryItemId:
                  type: string
                status:
                  type: string
                  enum: [in_stock, low, out]
                remaining:
                  oneOf:
                    - $ref: "#/components/schemas/SpecialtyAmount"
                    - type: "null"
                percentRemaining:
                  type: [integer, "null"]
                expiresOn:
                  type: [string, "null"]
                  format: date
            - type: "null"
    SpecialtyIngredientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpecialtyIngredient"
    SpecialtyDefaultsResponse:
      type: object
      required: [items, skipped]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpecialtyIngredient"
        skipped:
          type: integer
    SetSpecialtyChoiceRequest:
      type: object
      required: [optionId]
      properties:
        optionId:
          type: string
          description: A curated option ID, a household option ID, or `as_is`.
    SetSpecialtySettingsRequest:
      type: object
      required: [strategy]
      properties:
        strategy:
          type: string
          enum: [similar, closest, ask]
    SpecialtySettings:
      type: object
      required: [strategy, updatedBy, updatedAt, options]
      properties:
        strategy:
          type: string
          enum: [similar, closest, ask]
          default: similar
          description: |
            The household's standing answer for specialty ingredients without
            an explicit choice. `similar` prefers a store alternative and falls
            back to a house-made batch; `closest` prefers a batch and falls
            back to a store alternative; `ask` applies nothing.
        updatedBy:
          type: [string, "null"]
          description: Null for a household that never set one.
        updatedAt:
          type: [string, "null"]
          format: date-time
        options:
          type: array
          description: |
            Every strategy with the words to show, in the order to offer them.
            The same three entries every time, so the app needn't hardcode the
            trade-off copy.
          items:
            type: object
            required: [value, label, description]
            properties:
              value:
                type: string
                enum: [similar, closest, ask]
              label:
                type: string
                example: Something similar
              description:
                type: string
                example: Buy something close from the store — quicker, tastes a little different
    SpecialtyOptionRequest:
      type: object
      required: [type, name, ingredients]
      properties:
        type:
          type: string
          enum: [store_alternative, house_made_batch]
        name:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 500
        per:
          type: object
          description: Required for store_alternative; not allowed for batches.
          required: [quantity, unit]
          properties:
            quantity:
              type: string
            unit:
              type: string
        ingredients:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                maxLength: 100
              quantity:
                type: string
                description: Required for store alternatives; omit for "to taste" in a batch.
              unit:
                type: string
                description: DinnerOS unit code; defaults to `count` with a quantity.
              category:
                type: string
                description: A grocery category, used when the catalog doesn't know the ingredient.
        steps:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 500
        yield:
          type: object
          description: Required for house_made_batch.
          required: [quantity, unit]
          properties:
            quantity:
              type: string
            unit:
              type: string
        shelfLifeDays:
          type: integer
          minimum: 1
          maximum: 730
          description: Required for house_made_batch.
        basedOnOptionId:
          type: string
    RecordSpecialtyBatchRequest:
      type: object
      properties:
        optionId:
          type: string
          description: A house_made_batch option; defaults to the household's choice.
        batches:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        clientPurchaseId:
          type: string
          maxLength: 64
    RecordSpecialtyBatchResponse:
      type: object
      required: [purchase, item, option]
      properties:
        purchase:
          $ref: "#/components/schemas/PantryPurchase"
        item:
          $ref: "#/components/schemas/PantryItem"
        option:
          $ref: "#/components/schemas/SpecialtyOption"
    AutopilotDay:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
      description: Day of the week. Unlike `PlanDay`, never null.
      example: sun
    AutopilotProtein:
      type: string
      enum: [chicken, beef, pork, turkey, lamb, duck, fish, shellfish, tofu, legumes, eggs]
      description: "`tofu` covers tofu, tempeh, and seitan; `legumes` covers beans and lentils."
    AutopilotDiet:
      type: string
      enum: [vegetarian, pescatarian, vegan, gluten-free, dairy-free]
    AutopilotAllergen:
      type: string
      enum: [milk, eggs, fish, shellfish, tree-nuts, peanuts, wheat, soy, sesame]
    AutopilotEquipment:
      type: string
      enum: [smoker, grill, air-fryer, slow-cooker, pressure-cooker]
      description: A cooking method or piece of equipment.
    AutopilotNovelty:
      type: string
      enum: [favorites, balanced, adventurous]
      description: Appetite for new meals. Defaults to `balanced`.
    AutopilotRuleFrequency:
      type: string
      enum: [every_week, at_most_once]
      description: "`at_most_once` discourages a second meal matching the rule in the same week."
    AutopilotTimeBand:
      type: string
      enum: [quick, medium, long]
      description: |
        Cook-time band from the profile's limits: `quick` up to
        `quickMaxMinutes`, `medium` up to `mediumMaxMinutes`, `long` beyond.
        A recipe with unknown cook time is `medium`.
    AutopilotProposalStatus:
      type: string
      enum: [proposed, accepted, rejected]
      description: Only a `proposed` proposal can be swapped, accepted, or rejected.
    AutopilotSection:
      type: string
      enum: [taste, restrictions, schedule, cookTime, novelty, equipment, weekdayRules, pairings]
    AutopilotChoices:
      type: object
      additionalProperties: false
      required: [cuisines, tags, proteins]
      properties:
        cuisines:
          type: array
          maxItems: 30
          description: Free values, stored trimmed, lowercase, in canonical form (`North America` → `north american`; see docs/autopilot.md#cuisines), deduplicated, and sorted.
          items:
            type: string
            maxLength: 40
          example: [mexican, thai]
        tags:
          type: array
          maxItems: 30
          description: Free values (food types), stored like `cuisines`.
          items:
            type: string
            maxLength: 40
          example: [one pot, tacos]
        proteins:
          type: array
          description: Deduplicated and returned in vocabulary order.
          items:
            $ref: "#/components/schemas/AutopilotProtein"
          example: [chicken, pork]
    AutopilotTaste:
      type: object
      additionalProperties: false
      description: Soft preferences. A value can't be both liked and disliked.
      required: [likes, dislikes]
      properties:
        likes:
          $ref: "#/components/schemas/AutopilotChoices"
        dislikes:
          $ref: "#/components/schemas/AutopilotChoices"
    AutopilotRestrictions:
      type: object
      additionalProperties: false
      description: |
        Hard constraints: a recipe that violates one is never suggested. A
        liked cuisine or protein can't also be excluded.
      required: [diets, allergens, excludedIngredients, excludedCuisines, excludedProteins, excludedTags, noSpicy]
      properties:
        diets:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotDiet"
        allergens:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotAllergen"
        excludedIngredients:
          type: array
          maxItems: 50
          description: Free values matched against ingredient names, stored like `cuisines`.
          items:
            type: string
            maxLength: 60
          example: [cilantro]
        excludedCuisines:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 40
        excludedProteins:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotProtein"
        excludedTags:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 40
        noSpicy:
          type: boolean
    AutopilotSchedule:
      type: object
      additionalProperties: false
      required: [planDays, weeknights, mealsPerWeek, defaultServings, weeknightMaxMinutes]
      properties:
        planDays:
          type: array
          minItems: 1
          maxItems: 7
          description: Days Autopilot plans, in week order. Defaults to `mon`–`fri`.
          items:
            $ref: "#/components/schemas/AutopilotDay"
          example: [mon, tue, wed, thu, sun]
        weeknights:
          type: array
          maxItems: 7
          description: Days the weeknight time limit applies to, in week order. Defaults to `mon`–`thu`.
          items:
            $ref: "#/components/schemas/AutopilotDay"
          example: [mon, tue, wed, thu]
        mealsPerWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Between 1 and the number of `planDays`. Defaults to 4.
          example: 4
        defaultServings:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
          description: Null uses the household's default servings (see `effective.defaultServings`).
        weeknightMaxMinutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 480
          description: Soft cook-time limit on weeknights, or null for none.
          example: 30
    AutopilotCookTime:
      type: object
      additionalProperties: false
      required: [quickMaxMinutes, mediumMaxMinutes, maxLongPerWeek, minQuickPerWeek, avoidConsecutiveLong]
      properties:
        quickMaxMinutes:
          type: integer
          minimum: 5
          maximum: 480
          description: Longest quick meal. Defaults to 20.
          example: 20
        mediumMaxMinutes:
          type: integer
          minimum: 6
          maximum: 480
          description: Longest medium meal; greater than `quickMaxMinutes`. Longer meals are long. Defaults to 35.
          example: 35
        maxLongPerWeek:
          type: integer
          minimum: 0
          maximum: 7
          description: Most long meals wanted in a week; 7 means no limit. Defaults to 2.
          example: 2
        minQuickPerWeek:
          type: integer
          minimum: 0
          maximum: 7
          description: Fewest quick meals wanted in a week. Defaults to 0.
          example: 2
        avoidConsecutiveLong:
          type: boolean
          description: Discourage long meals on back-to-back days. Defaults to true.
    AutopilotWeekdayRule:
      type: object
      additionalProperties: false
      description: |
        A soft preference for one day. Needs at least one cuisine, tag,
        protein, method, or a time band.
      required: [day, label, cuisines, tags, proteins, methods, timeBand, frequency]
      properties:
        day:
          $ref: "#/components/schemas/AutopilotDay"
        label:
          type: string
          maxLength: 40
          description: Whitespace is collapsed; an empty label becomes the day's name.
          example: Sunday smoker night
        cuisines:
          type: array
          maxItems: 10
          description: Free values, stored like profile cuisines.
          items:
            type: string
            maxLength: 40
        tags:
          type: array
          maxItems: 10
          description: Free values, stored like profile tags.
          items:
            type: string
            maxLength: 40
        proteins:
          type: array
          items:
            $ref: "#/components/schemas/AutopilotProtein"
          example: [pork]
        methods:
          type: array
          description: Each must also be in the profile's `equipment`.
          items:
            $ref: "#/components/schemas/AutopilotEquipment"
          example: [smoker]
        timeBand:
          description: Preferred cook time (`long` means a long cook is OK), or null for no preference.
          oneOf:
            - $ref: "#/components/schemas/AutopilotTimeBand"
            - type: "null"
          example: long
        frequency:
          $ref: "#/components/schemas/AutopilotRuleFrequency"
    AutopilotChange:
      type: object
      required: [updatedBy, updatedAt]
      properties:
        updatedBy:
          type: string
          description: User ID of the member who made the change.
        updatedAt:
          type: string
          format: date-time
    AutopilotProfile:
      type: object
      required: [householdId, configured, taste, restrictions, schedule, cookTime, novelty, equipment, weekdayRules, pairings, sections, effective, createdBy, createdAt, updatedBy, updatedAt]
      properties:
        householdId:
          type: string
        configured:
          type: boolean
          description: False until the household saves a profile; the values are then the defaults.
        taste:
          $ref: "#/components/schemas/AutopilotTaste"
        restrictions:
          $ref: "#/components/schemas/AutopilotRestrictions"
        schedule:
          $ref: "#/components/schemas/AutopilotSchedule"
        cookTime:
          $ref: "#/components/schemas/AutopilotCookTime"
        novelty:
          $ref: "#/components/schemas/AutopilotNovelty"
        equipment:
          type: array
          description: Equipment the household has, in vocabulary order. Weekday rules can only use these methods.
          items:
            $ref: "#/components/schemas/AutopilotEquipment"
          example: [smoker, air-fryer]
        weekdayRules:
          type: array
          maxItems: 7
          description: At most one per day, in week order.
          items:
            $ref: "#/components/schemas/AutopilotWeekdayRule"
        pairings:
          type: array
          maxItems: 20
          description: Add-on pairing rules (docs/autopilot.md#pairing-rules).
          items:
            $ref: "#/components/schemas/AutopilotPairingRule"
        sections:
          type: object
          description: Who last changed each section and when; null for a section never set.
          required: [taste, restrictions, schedule, cookTime, novelty, equipment, weekdayRules, pairings]
          properties:
            taste:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            restrictions:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            schedule:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            cookTime:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            novelty:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            equipment:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            weekdayRules:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
            pairings:
              oneOf:
                - $ref: "#/components/schemas/AutopilotChange"
                - type: "null"
        effective:
          type: object
          description: Values resolved from the household.
          required: [defaultServings]
          properties:
            defaultServings:
              type: integer
              description: "`schedule.defaultServings`, or the household's default servings when that is null."
              example: 4
        createdBy:
          type: [string, "null"]
          description: Null until the profile is saved.
        createdAt:
          type: [string, "null"]
          format: date-time
          description: Null until the profile is saved.
        updatedBy:
          type: [string, "null"]
          description: Null until the profile is saved.
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: Null until the profile is saved.
    AutopilotChoicesInput:
      type: object
      additionalProperties: false
      properties:
        cuisines:
          type: array
          maxItems: 30
          description: Free values, stored trimmed, lowercase, in canonical form (`North America` → `north american`; see docs/autopilot.md#cuisines), deduplicated, and sorted.
          items:
            type: string
            maxLength: 40
          example: [mexican, thai]
        tags:
          type: array
          maxItems: 30
          description: Free values (food types), stored like `cuisines`.
          items:
            type: string
            maxLength: 40
          example: [one pot, tacos]
        proteins:
          type: array
          description: Deduplicated and returned in vocabulary order.
          items:
            $ref: "#/components/schemas/AutopilotProtein"
          example: [chicken, pork]
    AutopilotTasteInput:
